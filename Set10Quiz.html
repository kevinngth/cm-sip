<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#6b7280;--line:#e3e6ea;--acc:#2563eb;
--ok:#16a34a;--okbg:#eaf7ef;--no:#dc2626;--nobg:#fdeeee}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1c2024;--ink:#e8eaed;--mut:#9aa3ad;
--line:#2c3238;--okbg:#14301f;--nobg:#331717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.setbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.setbtn:hover{border-color:var(--acc)}
.setbtn b{display:block;font-size:15px}
.setbtn span{color:var(--mut);font-size:13px}
.rand{background:var(--acc);border-color:var(--acc);color:#fff}.rand span{color:#dbe6ff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
margin:0 -18px 20px;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-size:16px;margin:0;flex:1}
.pill{font-size:13px;color:var(--mut);white-space:nowrap}.pill b{color:var(--ink)}
button.lnk{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qn{color:var(--mut);font-size:13px;margin-bottom:6px}
.qt{font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
padding:9px 12px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:#9aa3ad}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt .k{font-weight:600;color:var(--mut);min-width:16px}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt.correct .k{color:var(--ok)}.opt.wrong .k{color:var(--no)}
.done .opt{cursor:default}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.expl{margin-top:12px;padding:12px 14px;border-left:3px solid var(--acc);background:rgba(37,99,235,.05);
border-radius:0 8px 8px 0;font-size:14px;line-height:1.6;white-space:pre-wrap}
.expl .ref{display:block;color:var(--mut);font-size:12px;margin-bottom:6px;font-weight:600}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
.res .score{font-size:34px;font-weight:700}
.foot{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA = [{"n":1,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 1\n\nWhen an investor puts his money in a fixed deposit or a Range Accrual Note (RAN) from ABC Bank, the _______ risk is the same.","o":["Market","Issuer","Transactional","Volatility"],"a":[1],"e":"Issuer risk is another factor which could impact the performance of the structured product. As the product itself is considered to be the issuer's liability, there is a risk that the issuer is not able to fulfill its liabilities due to bankruptcy or lack of liquidity, sometimes arising from instances unrelated to the structured product itself.","ref":"Page 135 | Chapter 6"},{"n":2,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 2\n\nA KO event occurs when the HSI trades:","o":["When the HSI trades at or above 22,200 or below 22,400","When the HSI trades above 22,400","When the HSI trades at or above 22,400 or below 22,200","When the HSI trades below 22,200"],"a":[2],"e":"A knock-out event occurs if:\n\nThe HSI trades at or above the knock-out barrier during the investment period; or\nThe HSI trades at or below the accrual barrier.\nWhen the knock-out event occurs, the accrual coupon accumulation stops. Any accrued coupon is paid on the periodic interest payment dates, typically semi-annually, quarterly, monthly, or at the end of the investment period. The note holder can recover, at maturity, the principal plus the coupon accrued for the number of days on which knock-out event does not occur.","ref":"Page 285 | Chapter 14"},{"n":3,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 3\n\nWhat is the yield if the investor has only accumulated 150 trading days during the period?","o":["1.70%","2.10%","2.30%","2.50%"],"a":[1],"e":"Solution:\n\nYield = 0.3% + [3% x 150/250] = 2.1% (Ans)"},{"n":4,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 4\n\nThis Hang Seng Index (HSI) daily Range Accrual Note (RAN)","o":["Accrues an enhanced yield for which the spot HSI trades outside a predetermine range","Accrues an enhanced yield for which the spot HSI trades within a predetermine range","Accrues an enhanced yield for which the spot HSI trades above a predetermine range","Accrues an enhanced yield for which the spot HSI trades below a predetermine range"],"a":[1],"e":"A RAN is a structured note where the investor receives a target level of return, if a reference index \"falls\" within an agreed range, failing which the investor will receive less or no interest, although the principal will not be affected. The reference index can be a stock index (e.g. Dow Jones Industrial Average (DJIA)) or an interest rate benchmark (e.g. LIBOR or Singapore SOR (Swap Offer Rate)).\n\nInterest is usually accrued and calculated on a daily basis for the days when the reference index falls within the range stipulated in the RAN's terms and conditions. In essence, the RAN's final interest payout depends on observed price movements of the reference index. As long as the reference index falls within the range, the investor will get a fixed or floating coupon. If the reference index closes outside of the predefined range, the investor will receive less or no interest.","ref":"Page 142 | Chapter 17"},{"n":5,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 5\n\nWith a more volatile market, the probability of the spot HSI trading outside the range will","o":["Decrease, and hence the risk is higher","Decrease, and hence the risk is lower","Increase, and hence the risk is higher","Increase, and hence the risk is lower"],"a":[2],"e":"2. Yield Determinants\n\nThe accrual range (i.e. the range between the knock-out barrier and accrual barrier) is typically set symmetrically around the spot HSI price. The probability of HSI prices trading outside the range will increase with longer tenure, so the notes holder should be compensated for the higher risk with higher yield. Similarly, price volatility of HIS will affect the risk assumed by the investors. A more volatile HSI will result in higher probability of the price trading outside the range and hence the yield for the investors should be higher to compensate for the higher risk.","ref":"Page 288 | Chapter 14"},{"n":6,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 6\n\nWith the spot HSI trades below the accrual level","o":["Accrued coupon will not be accumulated and will not resume when the HSI subsequently trades above the accrual level","Accrued coupon will not be accumulated and will resume when HSI subsequently trades above the accrual level","Accrued coupon will reduce and will not resume when the HSI subsequently trades above the accrual level","Accrued coupon will reduce and will resume when HSI subsequently trades above the accrual level"],"a":[1],"e":"When HSI trades below the accrual barrier, accrual coupons will not be accumulated. The accrual of coupons will resume when HSI trades above the accrual barrier.","ref":"Page 288 | Chapter 14"},{"n":7,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 7\n\nAssuming that the HSI trades above the knock-out barrier on the 100th day of trading","o":["This RAN will be knock-out and the investor will get back his principal immediately","This RAN will be knock-out and the investor will get back his principal plus the coupon accrued immediately","The coupon will stop accumulating and the investor will get back his principal plus the coupon accrued immediately","The coupon will stop accumulating and the investor will get back his principal plus the coupon accrued only on maturity"],"a":[3],"e":"When HSI trades above the knock-out barrier, the coupon will stop accumulating. The investor will only have accumulated 100 trading days of accrual coupon. Payoff to investor will only be done at maturity date.","ref":"Page 287 | Chapter 14"},{"n":8,"q":"Case study\n\nBelow are the terms of a daily range accrual note (RAN) on the Hang Seng Index (HSI) issued by ABC Bank\n\nInvestment Tenure: 12 months, daily accrual\n\nPayment Frequency: Quarterly\n\nAccrual Barrier / KO Barrier: 22,200 / 22,400\n\nYield: 0.3% + [3% x n/N] where n = no. of days HSI fixes within 22,200 and 22,400 while N = total no. of days during the period (250 trading days)\n\nInvestment Amount: SGD 1 million principal (to be repaid at maturity)\n\n6-month SGD time deposit: 3%\n\nHSI spot / forward: 22,280 / 22,320\n\nQuestion 8\n\nWith longer investment tenure, the probability of HSI trading outside the range will","o":["Increase, and hence the note holder will be compensated with lower yield","Increase, and hence the note holder will be compensated with higher yield","Decrease, and hence the note holder will be compensated with higher yield","Decrease, and hence the note holder will be compensated with lower yield"],"a":[1],"e":"2. Yield Determinants\n\nThe accrual range (i.e. the range between the knock-out barrier and accrual barrier) is typically set symmetrically around the spot HSI price. The probability of HSI prices trading outside the range will increase with longer tenure, so the notes holder should be compensated for the higher risk with higher yield. Similarly, price volatility of HIS will affect the risk assumed by the investors. A more volatile HSI will result in higher probability of the price trading outside the range and hence the yield for the investors should be higher to compensate for the higher risk.","ref":"Page 288 | Chapter 14"},{"n":9,"q":"Case study - Accumulator\n\nProduct Variables | Details\nReference share | XYZ Limited\nTenor / observation period | 1 year (250 business days)\nSpot reference price | SGD 2.25\nStrike price | SGD 2.00\nKnock-out barrier | SGD 2.60\nNumber of shares per daily observation | 50,000\nSettlement | Daily observation, monthly settlement\n\nQuestion 1\n\nWhich of the following would be an additional risk when an accumulator is structured as \"unfunded basis\"?","o":["Issuer risk","Leverage risk","Systemic risk","Volatility risk"],"a":[1],"e":"Product Description\n\nAn accumulator is a structured note that allows an investor to purchase a pre-determined quantity of a reference stock at regular intervals. The product involves a long-call and a short-put on the stock with the same strike price. An accumulator can be structured as an OTC option where investor is only required to put up a margin (i.e. unfunded basis) or wrapped as a structured note (fully funded). Unfunded accumulators are more commonly purchased by investors.\n\nMechanism of the Note\n\nMost accumulators have knock-out barrier put options. If the daily closing price of the underlying shares is at or above the barrier, the derivative agreement will be terminated. With such a feature, the upside (quantities purchased at discounted price) for the investor is limited by the knock-out barrier. As long as the daily closing price of the underlying is below the knock-out barrier, investor will accumulate a predetermined quantity of the shares daily and take delivery periodically, e.g. monthly.","ref":"Page 290 | Chapter 14"},{"n":10,"q":"Case study - Accumulator\n\nProduct Variables | Details\nReference share | XYZ Limited\nTenor / observation period | 1 year (250 business days)\nSpot reference price | SGD 2.25\nStrike price | SGD 2.00\nKnock-out barrier | SGD 2.60\nNumber of shares per daily observation | 50,000\nSettlement | Daily observation, monthly settlement\n\nQuestion 3\n\nWhich scenario allows the investor to accumulate the most units of XYZ shares?","o":["The share price of XYZ Ltd stays at $2.60 on each business day during the tenor","The share price of XYZ Ltd stays above $2.60 on each business day during the tenor","The share price of XYZ Ltd stays at $2.25 on each business day during the tenor","The share price of XYZ Ltd stays between $2.00 and $2.60 on each business day during the tenor"],"a":[2],"e":"For unfunded accumulators that provide leveraging / margin facilities, investors may not be required to make an initial payment.\n\nAn accumulator can be structured as an OTC option where investor is only required to put up a margin (unfunded basis) or wrapped as a structured note (fully funded). Unfunded accumulators are more commonly bought by investors.","ref":"Page 293 | Chapter 14"},{"n":11,"q":"Case study - Accumulator\n\nProduct Variables | Details\nReference share | XYZ Limited\nTenor / observation period | 1 year (250 business days)\nSpot reference price | SGD 2.25\nStrike price | SGD 2.00\nKnock-out barrier | SGD 2.60\nNumber of shares per daily observation | 50,000\nSettlement | Daily observation, monthly settlement\n\nQuestion 4\n\nWhich of the following is the worst case scenario of this accumulator?","o":["The closing price of XYZ shares is below $2.60 for each business day during the tenor","The closing price of XYZ shares is above $2.60 for each business day during the tenor","The closing price of XYZ shares is $0.00 for each business day during the tenor","The closing price of XYZ shares is $2.00 for each business day during the tenor"],"a":[2],"e":"Worst case scenario\n\nThe closing price of XYZ shares is zero for each business day during the tenor. In this case, investor will have to purchase 50,000 shares per day for 250 business days, or 2,500,000 XYZ shares at S$2.00 per share. The investor will not be able to sell the shares as they are valueless, and incur a marked-to-market loss of SGD 25,000,000, the maximum loss under this agreement.","ref":"Page 293 | Chapter 14"},{"n":12,"q":"Case study\n\nRST Bank has an auto-redeemable structured fund in USD with a 3-year tenor. The fund's returns and payout are based on S&P 500 and Nikkei 225 equity indices.\n\nGeneral specifications of the fund are as follow:\n\nPayment structure: Payout is based on formula which determines relative performance of Nikkei 225 against S&P 500. Max. payout = 125.5% at maturity (if no auto-redemption) and Min. payout = 100% at maturity\n\nAuto-Redeemable feature: Auto-redeemable from 1 year after inception and every 6 months until maturity if performance of Nikkei 225 at Valuation Time on observation date is greater/equal to the performance of S&P 500. Pre-determined price: 108.5% after 1 yr, 112.75% after 1.5 yrs, 117% after 2 yrs, 121.25% after 2.5 yrs.\n\nIf not terminated early, payout is 125.5% if Nikkei 225 performs equal or better than S&P 500.\n\n10-year Gov. interest rate for Japan is 0.5% and 2.5% for USA.\n\nInitial (Strike) / Maturity (Expiry) Dates: 16 May 2015 / 15 May 2018\n\nQuestion 1\n\nHow is the mandatory redemption event and performance payout at maturity determined?","o":["Absolute performance of the two indices to a predefined threshold level or hurdle rate.","Absolute performance of the two indices to a specified market risk-free rate.","Relative forward performance of the two indices with each other.","Relative forward performance of the two indices to their past performance."],"a":[2],"e":"Payment structure: Payout is based on formula which determines relative performance of Nikkei 225 against S&P 500."},{"n":13,"q":"Case study\n\nRST Bank has an auto-redeemable structured fund in USD with a 3-year tenor. The fund's returns and payout are based on S&P 500 and Nikkei 225 equity indices.\n\nGeneral specifications of the fund are as follow:\n\nPayment structure: Payout is based on formula which determines relative performance of Nikkei 225 against S&P 500. Max. payout = 125.5% at maturity (if no auto-redemption) and Min. payout = 100% at maturity\n\nAuto-Redeemable feature: Auto-redeemable from 1 year after inception and every 6 months until maturity if performance of Nikkei 225 at Valuation Time on observation date is greater/equal to the performance of S&P 500. Pre-determined price: 108.5% after 1 yr, 112.75% after 1.5 yrs, 117% after 2 yrs, 121.25% after 2.5 yrs.\n\nIf not terminated early, payout is 125.5% if Nikkei 225 performs equal or better than S&P 500.\n\n10-year Gov. interest rate for Japan is 0.5% and 2.5% for USA.\n\nInitial (Strike) / Maturity (Expiry) Dates: 16 May 2015 / 15 May 2018\n\nQuestion 2\n\nWhich of the following statements is TRUE with regards to the risk of this structured fund?","o":["Credit risk is mitigated because of 100% capital preservation at maturity.","Liquidity risk is mitigated as the underlying benchmarks are commonly traded global indices.","Reinvestment risk is low for the initial years.","Volatility risk may affect the performance of the fund."],"a":[3],"e":"Solution:\n\nAnswer (A) is incorrect - a structured product is exposed to the credit risk of the issuer or when the underlying financial instruments involve a credit product.\n\nAnswer (B) is incorrect - Liquidity risk is a result of the lack of marketability. Structured products are usually designed for investors who are willing to hold the investment to maturity. As they are customised products tied to a specific risk / reward profile, there is typically a limited secondary market making it hard for investors to sell it before maturity date.a structured product is exposed to the credit risk of the issuer or when the underlying financial instruments involve a credit product.\n\nAnswer (C) is incorrect - Reinvestment risk refers to the risk that investors have to reinvest their bond proceeds - coupons and/or principal - at an interest rate below their yield-to-maturity (YTM). If interest rates fall, bond proceeds can only be reinvested at the prevailing lower interest rates. Hence, the bond return will be lower than the YTM. Reinvestment risk is greatest for bonds with large coupons, higher coupon payment frequency, long maturities, selling at a premium. Zero coupon bonds have no reinvestment risk, while callable bonds have high reinvestment risk. Structured product is exposed to the credit risk of the issuer or when the underlying financial instruments involve a credit product."},{"n":14,"q":"Case study\n\nRST Bank has an auto-redeemable structured fund in USD with a 3-year tenor. The fund's returns and payout are based on S&P 500 and Nikkei 225 equity indices.\n\nGeneral specifications of the fund are as follow:\n\nPayment structure: Payout is based on formula which determines relative performance of Nikkei 225 against S&P 500. Max. payout = 125.5% at maturity (if no auto-redemption) and Min. payout = 100% at maturity\n\nAuto-Redeemable feature: Auto-redeemable from 1 year after inception and every 6 months until maturity if performance of Nikkei 225 at Valuation Time on observation date is greater/equal to the performance of S&P 500. Pre-determined price: 108.5% after 1 yr, 112.75% after 1.5 yrs, 117% after 2 yrs, 121.25% after 2.5 yrs.\n\nIf not terminated early, payout is 125.5% if Nikkei 225 performs equal or better than S&P 500.\n\n10-year Gov. interest rate for Japan is 0.5% and 2.5% for USA.\n\nInitial (Strike) / Maturity (Expiry) Dates: 16 May 2015 / 15 May 2018\n\nQuestion 3\n\nThis structured fund is suitable for which kind of investors?","o":["Risk adverse investors with constant income payments periodically over the next three years.","Risk adverse investors with variable income payments periodically and guaranteed capital payment in three years.","Risk takers with constant income payments periodically and potential capital appreciation between now till maturity.","Risk takers with potential investment growth and principal payout in three years."],"a":[3],"e":"A structured product is generally considered a complex investment product, as they often contain embedded derivatives. As such, there are various restrictions governing the sales process of structured products compared to simpler financial products.\n\nOne major restriction is that only qualified representatives are allowed to provide advice to investors who wish to trade in structured products; otherwise investors are required to have the relevant experience and knowledge to understand the structured product's features and risks. Financial advisors and representatives are expected to provide full disclosure of the potential risks to their clients.","ref":"Page 135 | Chapter 6"},{"n":15,"q":"Case study\n\nRST Bank has an auto-redeemable structured fund in USD with a 3-year tenor. The fund's returns and payout are based on S&P 500 and Nikkei 225 equity indices.\n\nGeneral specifications of the fund are as follow:\n\nPayment structure: Payout is based on formula which determines relative performance of Nikkei 225 against S&P 500. Max. payout = 125.5% at maturity (if no auto-redemption) and Min. payout = 100% at maturity\n\nAuto-Redeemable feature: Auto-redeemable from 1 year after inception and every 6 months until maturity if performance of Nikkei 225 at Valuation Time on observation date is greater/equal to the performance of S&P 500. Pre-determined price: 108.5% after 1 yr, 112.75% after 1.5 yrs, 117% after 2 yrs, 121.25% after 2.5 yrs.\n\nIf not terminated early, payout is 125.5% if Nikkei 225 performs equal or better than S&P 500.\n\n10-year Gov. interest rate for Japan is 0.5% and 2.5% for USA.\n\nInitial (Strike) / Maturity (Expiry) Dates: 16 May 2015 / 15 May 2018\n\nQuestion 4\n\nIf mandatory redemption does not occur, and S&P500 performs exactly equal to Nikkei 225 at maturity, how much will the investor get?","o":["125.50%","121.25%","112.75%","100%"],"a":[0],"e":"If not terminated early, payout is 125.5% if Nikkei 225 performs equal or better than S&P 500."},{"n":16,"q":"Which of the following statements about structured products is TRUE?","o":["Structured products must have minimum two derivatives.","The demand for structured products has increased due to high volatility in the financial markets.","Structured products are considered a traditional investment asset class just like bonds or futures.","When interest rates are persistently low, it reduces the demand for structured products."],"a":[1],"e":"refer to:\n\n(6.1.1) Growth of Structured Products\n\nExtreme volatility in the financial markets driven by geopolitical and economic uncertainty, which has led to a greater desire by investors for structured products which are partially or fully principal guaranteed. These products are designed to preserve the principal amount against negative returns due to volatile or bear markets, as well as offer upside participation","ref":"Page 123 | Chapter 6"},{"n":17,"q":"A fixed income instrument is usually used as the principal component of a structured product because","o":["it protects a part of the investment capital from loss","it enhances the potential for capital appreciation","it gives investors the opportunity to invest in higher-yield bonds","it leads to a longer investment horizon for the investors"],"a":[0],"e":"refer to:\n\nPrincipal Component\n\nThe principal component is usually a fixed income instrument such as a bond. This component is used to create a feature such that all of part or whole of the investment amount can be protected from loss.","ref":"Page 125 | Chapter 6"},{"n":18,"q":"____ are constructed based on the credit default swaps linked to one or more reference entities.","o":["Credit-linked notes","Participatory notes","Access notes","Equity linked notes"],"a":[0],"e":"refer to:\n\n(7.6.4) Credit Linked Notes (CLNs)\n\nA credit linked note is another type of yield enhancement structured product. As the name suggests, it has exposure to the credit markets. In a CLN, the issuer offers credit insurance known as credit default swaps (CDS) linked to a particular company (referred to as \"reference entity\" in the term sheet). It has a fixed income investment, which is used as collateral against the credit insurance sold in the market.\n\nA CDS is akin to providing credit insurance on a reference entity. It is a contract between two counterparties, whereby the \"buyer\" pays periodic payments (insurance premium) to the seller in exchange for the right to a payout if there is a credit default of the \"reference entity\".","ref":"Page 148 | Chapter 7"},{"n":19,"q":"Which of the following structured products DOES NOT have an embedded short put option written by the holder?","o":["Accumulators.","Bond-linked notes.","First-to-default credit-linked notes.","Zero coupon plus option note."],"a":[3],"e":"refer to:\n\n(7.6.6) Bond-Linked Notes (BLNs)\n\nA BLN is also a yield enhancement structured product. It embeds a short put into a bond. The investor may end up owning a bond at maturity\n\nPage 150 | Chapter 7        (7.6.7) Accumulators\n\nAn accumulator is a structured product that allows investors to buy a pre-determined quantity of an asset (e.g. equity or foreign exchange) at regular intervals. The product involves a long-call and a short-put on the underlying asset with the same strike price.","ref":"Page 150 | Chapter 7"},{"n":20,"q":"Which of the following statements about structured products is TRUE?","o":["Auto-callable structured products usually offer lower yields to investors.","Auto-callable structured products can only be constructed using American-type barrier options and not with Bermudan options.","Structured products with barrier options have uncertain maturities and greater reinvestment risk.","A plain vanilla financial product and a structured product have similar volatility risk if the underlying assets are the same."],"a":[2],"e":"refer to:\n\nReinvestment risk - If a structured deposit is called or redeemed before maturity, the investor is exposed to reinvestment risk and may have to reinvest the funds at less attractive interest rates.\n\nWith an auto-callable product, the investor faces call risk as he has no control over when the product may be called, leading to uncertainty on the exact holding period of the investment. The investor also faces reinvestment risk if the product is redeemed early. The investor will look at the prospective returns offered by the product with respect to the potential yield and upside participation, and determine if the rewards are attractive enough to invest in for assuming these risks.","ref":"Page 155 | Chapter 7"},{"n":21,"q":"How are derivatives used within a structured fund?\n\nI Derivatives are used to synthetically track/replicate the performance of the underlying(s)\n\nII Derivatives are used to provide a return linked to the underlying asset of the fund\n\nIII Derivatives are used to protect capital of the fund","o":["I only","I & II","II & III","I, II & III"],"a":[1],"e":"refer to:\n\nA structured fund is a fund that combines financial instruments, such as equity and fixed income securities and/or derivatives, to achieve specific risk/return profiles or cost/savings objectives that may otherwise not be achievable in the marketplace. While it typically comprises a combination of securities and derivatives components, it is also possible for a structured fund to invest only in derivatives.\n\nSome structured funds have a fixed income component which is intended to provide some capital preservation and regular interest payments. The derivatives component is normally used in an attempt to achieve higher returns linked to an underlying asset.","ref":"Page 160 | Chapter 8"},{"n":22,"q":"A fund manager sells the relevant equity index futures contracts to offset his long cash positions in the equity market. This is an example of ____.","o":["basis trading","hedge trading","outright trading","spread trading"],"a":[1],"e":"(3.4.9) Hedging Equity Risks\n\nEquity index futures can only hedge against market risks. The fund manager can offset the portfolio's market exposure by selling futures contracts when long in the equity market (short hedge) and buying futures contracts when short in the equity market (long hedge).","ref":"Page 47 | Chapter 3"},{"n":23,"q":"Based on the following information, calculate the number of futures contracts that an investor should sell for a delta-neutral hedge. Portfolio value is $100 million, Price of each futures contract is $200,000 and the hedge ratio is 0.5.","o":["100","250","500","1,000"],"a":[1],"e":"(3.4.9) Hedging Equity Risks\n\nPage 324 | Appendix D        Hedge Ration (Delta-neutral hedge)\n\nNumber of contracts = Hedge ration x Portfolio Value / Futures Contract value\n\nNumber of contracts = 0.5 x $100,000,000 / $200,000 = 250 (Ans)","ref":"Page 47 | Chapter 3"},{"n":24,"q":"_________ is NOT a type of hedge.","o":["Strips and stacks","Matching hedge","Extrapolative hedge","Interpolative hedge"],"a":[1],"e":"(3.4.7) Types of Hedges\n\n1. Strips and Stacks\nThe futures buyer must also consider and decide whether to use strips or stacks:\n\n1. Strips use successive futures contract months to match delivery dates on the futures contracts with the rollover dates or tenor on a cash loan.\n2. Stacks use the deferred contract months to match the rollover dates or tenor on a cash loan.\n3. Time Horizon\nUnder normal market conditions, the nearby contract is preferred due to its liquidity and statistically high correlation to the movement of the underlying instrument. When there is a mismatch of the time horizon and expiry date, basis risk occurs. If the hedging horizon extends beyond the expiry of the nearby contract, the hedger has to decide whether to use the nearby contract and rollover into a deferred one or use a deferred contract from the beginning.\n\nBoth choices will have basis risk when the hedge is terminated. When there is no exact futures contract for hedging an exposure, the correlation between the hedge vehicle and the instrument to be hedged must be properly studied to achieve the desired results. When the maturity date of the underlying instrument does not coincide with the maturity date of the hedge instrument, two types of hedges can be considered:\n\nInterpolative hedge - used when time horizon straddles 2 expiry dates; and\n\nExtrapolative hedge - used when time horizon stretches beyond the tenor of the last traded contract.","ref":"Page 54 | Chapter 3"},{"n":25,"q":"A trader expects that the Japanese Yen will reverse its recent course and decline in the coming months. Given that the current level of 3-month US and Japan interest rates in the money markets are 2% and 0.25% respectively, which of the following choices would the trader pick? (Assume other factors are not a concern.)","o":["Buy USD/JPY in the foreign exchange market at 82.20 for spot delivery","Buy a JPN YEN currency futures Sep.12 contract at 0.012295","Sell a JPN YEN currency futures Sep.12 contract at 0.012265","Sell USD/JPY in the foreign exchange market at 82.20 for spot delivery"],"a":[2],"e":"(2.7.2) Currency Futures\n\nCurrency futures (also called forex, foreign exchange or FX futures) are exchange-traded futures contracts to buy or sell a specified amount of a particular currency at a set price and at a future date. Currency futures were introduced at the Chicago Mercantile Exchange (now the CME Group) in 1972 after the fixed exchange rate system and gold standard were discarded.\n\nCurrency futures contracts reflect changes in the value of one currency against another. Financial institutions, investment managers, corporations and private investors use currency futures to manage the risks or take advantage of profit opportunities arising from currency rate fluctuations.\n\nInterest Rate Parity Theory\n\nThe theory states that the forward (futures) premium or discount between 2 currencies should be equal to the difference in the domestic interest rates for securities of the same maturity (except for the effects of small transaction costs). If the interest rate parity relationship is violated, arbitrageurs can make risk-free profits in foreign exchange markets and their actions will force futures and spot exchange rates back into alignment.\n\nSolution:\n\nThe trader expects the Japanese Yen to decline; he may (1) buy USD/Yen or (2) short Yen futures\n\nWhen Spot USD/JYP = 82.20, the theoretical price of YEN Futures:\n\n1 / 82.20 x [1 + (0.25% x 90/360) / 1 + (2% x 90/360)] = 1 / 81.84216 = 0.012219\n\nAnswer (C) of 0.012265 is higher than the theoretical price. Therefore, answer is (C).","ref":"Page 25 | Chapter 2"},{"n":26,"q":"The futures markets absorb information and help the market players in the process of _________.","o":["Arbitrage","Transparency","Regulatory oversight","Price discovery"],"a":[3],"e":"(2.1.1) The Economic Importance of the Futures Market\n\nPrice Discovery\n\nFutures market prices depend on a continuous flow of information from around the world and thus require a high amount of transparency. Factors such as political, (elections, war), economic (recessions, bankruptcies), socio-cultural (disruptive societies, ethnic tensions) and environmental (pollution, deforestation) can all have a major effect on supply and demand and, as a result, the present and future price of commodities and financial assets.\n\nDue to its highly competitive nature, the futures market is an important economic tool to determine prices based on today's information and tomorrow's projected supply and demand. How market participants absorb the information constantly changes the prices of commodities and assets - a process known as price discovery","ref":"Page 8 | Chapter 2"},{"n":27,"q":"Which of the following statements about forwards and futures contracts is TRUE?","o":["Futures are traded on an organized exchange.","Futures contracts have settlement terms which may vary for each contract.","Investors in futures contracts are exposed to significant counterparty risks.","Forward contracts have an active secondary market."],"a":[0],"e":"(2.3.1) Futures versus Forwards\n\nFutures are standardised contracts for the purchase and sale of financial instruments or physical commodities, on a regulated futures exchange, for future delivery. Forwards are a private, cash-market agreement between a buyer and seller for the future delivery of a commodity, at an agreed upon price. These contracts are not standardised and are non-transferable between parties.","ref":"Page 10 | Chapter 2"},{"n":28,"q":"There are certain risks involved in hedging in the forward or futures market. Which of the following is true","o":["Futures contracts have no counterparty risk, only the risk of the exchange, while forward contracts carry the credit risk of the counterparty","Futures contracts have both mismatch risk and basis risk","Forward contracts have the risk of the exchange","a and b only"],"a":[3],"e":"(2.3.1) Futures versus Forwards\n\nFutures are standardised contracts for the purchase and sale of financial instruments or physical commodities, on a regulated futures exchange, for future delivery. Forwards are a private, cash-market agreement between a buyer and seller for the future delivery of a commodity, at an agreed upon price. These contracts are not standardised and are non-transferable between parties.","ref":"Page 10 | Chapter 2"},{"n":29,"q":"Which of the following statement is true about futures contracts","o":["Futures contracts can cater to any forward dates that a trader/hedger desired","Once the futures contract reaches its final settlement date, the contract can be settled by cash or physical delivery of the underlying products","Futures contracts do not have an expiry date","All of the above"],"a":[1],"e":"Delivery or Hold to Expiry\n\nAll futures contracts have an expiration date. At that date, the buyer will accept delivery of the underlying asset and the seller liquidates his position by delivering the asset at the agreed contract price.\n\nCommodity contracts will state the physical delivery to an approved warehouse of the underlying commodity. Currencies and some financial instruments such as the S&P 500 index, simply call for cash settlement. Every futures contract specifies the last day of trading before the expiry date.","ref":"Page 14 | Chapter 2"},{"n":30,"q":"Which of the following statement is TRUE about futures contract?","o":["Futures contract has an efficient number of delivery dates that are feasible and suitable for trading/hedging a particular underlying product","Once the contract has reached its last trading day, the final settlement can either be in cash or by physical delivery of the underlying","Every futures contract has an expiry date or a last available trading day","All of the above"],"a":[3],"e":"Delivery or Hold to Expiry\n\nAll futures contracts have an expiration date. At that date, the buyer will accept delivery of the underlying asset and the seller liquidates his position by delivering the asset at the agreed contract price.\n\nCommodity contracts will state the physical delivery to an approved warehouse of the underlying commodity. Currencies and some financial instruments such as the S&P 500 index, simply call for cash settlement. Every futures contract specifies the last day of trading before the expiry date.\n\nInvestors must know the expiry dates because as the date approaches, liquidity slowly decreases as traders begin to roll their positions to the next available contract month.","ref":"Page 14 | Chapter 2"},{"n":31,"q":"Which of the following statements is TRUE about Futures Contracts?","o":["Liquidity in trading is usually better for the nearby contract months","Once the futures contract has reached its last trading day, the final settlement must be settled by cash only","Future contracts do not have an expiry date","All of the above are incorrect"],"a":[0],"e":"Delivery or Hold to Expiry\n\nInvestors must know the expiry dates because as the date approaches, liquidity slowly decreases as traders begin to roll their positions to the next available contract month.","ref":"Page 14 | Chapter 2"},{"n":32,"q":"Which futures contracts is more likely to be cash settled at maturity","o":["Oil and Gas futures","Gold futures","S&P index futures","Corn futures"],"a":[2],"e":"Delivery or Hold to Expiry\n\nCommodity contracts will state the physical delivery to an approved warehouse of the underlying commodity. Currencies and some financial instruments such as the S&P 500 index, simply call for cash settlement.","ref":"Page 14 | Chapter 2"},{"n":33,"q":"Which of the following order types are available on SGX\n\nI Limit order\n\nII Market if Touch order\n\nIII Volume weighted average price order\n\nIV Session State Order","o":["I and II","II and III","I, II and IV","All of the above"],"a":[2],"e":"Table 2.4.2 Types of Order Available on SGX\n\nLimit Order\n\nMarket to Limit (MTL) order\n\nMarket Order\n\nStop (limit, MTL and Market) Order\n\nMarket if Touched (MIT) Order\n\nSession State Order (Limit, MTL, Market, Stop and MIT)\n\nSession state orders (SSO) trigger the entry of an order into the order book. SSOs will trigger only when the market transitions into a new session state. Market participants can query for the list of valid session states and select the appropriate session state.\nSSOs and their triggered orders are not visible to other market participants until triggering occurs. The SSO will be deleted at the end of the trading day if the market does not transition into the session state during the day (e.g. due to trading halts, invalid session state and etc.) SSOs may not be GTC.","ref":"Page 15 | Chapter 2"},{"n":34,"q":"The SGX-DC has a mutual offset arrangement with which of the following exchanges?","o":["Chicago Mercantile Exchange.","Euronext exchange.","NYSE Euronext.","Tokyo International Financial Futures Exchange."],"a":[0],"e":"(2.4.6) Mutual Offset System (MOS)\n\nSGX-DC and the Chicago Mercantile Exchange (CME) have a long standing mutual offset arrangement since 1984 that allows market participants to initiate positions in one exchange for allocation to the other exchange on a real-time basis.","ref":"Page 18 | Chapter 2"},{"n":35,"q":"Currently the following SGX-DT products are eligible for mutual offset with CME, EXCEPT","o":["Eurodollar Futures (ED)","Euroyen (TIBOR) Futures (EY)","CNX Nifty Index Futures (IN)","CNX China Index Futures (CN)"],"a":[3],"e":"(2.4.6) Mutual Offset System (MOS)\n\nSGX-DC and the Chicago Mercantile Exchange (CME) have a long standing mutual offset arrangement since 1984 that allows market participants to initiate positions in one exchange for allocation to the other exchange on a real-time basis.\n\nCurrently the following SGX-DT products are eligible for mutual offset with CME:\n\nEurodollar Futures (ED)\nEuroyen (TIBOR) Futures (EY)\nNikkei 225 Index Futures (NK)\nUSD Nikkei 225 Index Futures (NU)\nCNX Nifty Index Futures (IN)","ref":"Page 18 | Chapter 2"},{"n":36,"q":"Which of the following theories posits that futures prices are basically the expected spot prices of the underlying asset in the future?","o":["Backwardation and Contango theory.","Cash and carry arbitrage theory.","Expectancy model.","Time value of money concept."],"a":[2],"e":"(2.5.3) Expectancy Model of Futures Pricing\n\nThis model says futures prices are just expected spot prices of an asset in the future. If there are more traders who expect the futures price of an asset to rise in the future than those who expect it to fall, the current futures price of that asset will be positive.\n\nThe theory suggests that it is not the relationship between the cash market price and the futures price that is relevant, but the relationship between the expected spot price on the date of expiry of the contract and the futures price that is.","ref":"Page 21 | Chapter 2"},{"n":37,"q":"Spot price of USD/SGD is 1.3900, the annual interest rate in the USA is 5% and that in Singapore is 3%. What is the theoretical price of a 1-year forward USD/SGD contract?","o":["1.4178","1.4170","1.3635","1.3627"],"a":[2],"e":"(2) Interest Rate Parity Theory\n\nPage 323 | Appendix D – Formulae Sheet\n\n1.3900 x [(1+3%) / (1+5%)] = 1.3635 (Ans)","ref":"Page 25 | Chapter 2"},{"n":38,"q":"The cost of carry model assumes that arbitrage between the cash market and the futures market eliminates all imperfections in pricing. Which of the following is not an assumption of the Cost of carry Model?","o":["Contracts are held to maturity","Investors can borrow or lend at the same interest rate","There are no transaction costs or margin requirements","Short selling is not permitted"],"a":[3],"e":"(2.5.2) Futures versus Spot Market (Cash Market)\n\nThe relationship between futures prices and spot prices can be summarised in terms of cost of carry. Cost of carry includes financial costs (e.g. interest costs on bonds, interest expenses onmargin accounts and interest on loans used to purchase a security), and economic costs (e.g. opportunity costs from taking the initial position).\n\nThe net cost of carry involves all costs that an investor may incur to hold a similar position in the cash market, less the returns that he would have received from this position. Costs typically include financing charges at the prevailing rate of interest, because he may have borrowed to finance a similar position in the cash market, and if not, he may have lost interest on the capital invested to keep his position open.\n\nBy contrast in the futures market, the investor only has to deposit a fraction of the value of his position in the form of a margin. The returns that he receives could be dividends or bonuses received if he held shares in the cash market. In the case of an index future, his returns may be gauged by the average return that an index delivers.\n\nThe cost of carry model assumes that arbitrage between the cash market and the futures market eliminates all imperfections in pricing. For simplicity, it assumes that:\n\ni. The contract is held till maturity, so that a fair price can be arrived at;\n\nii. There are no transaction costs or margin requirements;\n\niii. There are no restrictions on short selling; and\n\niv. Investors can borrow and lend at the same interest rate.","ref":"Page 19 | Chapter 2"},{"n":39,"q":"The Futures markets absorb Economical and Political information and enable market participants to make investment decisions through the process of ___________.","o":["A. Arbitrage","B. Price discovery","C. Regulatory oversight","D. Transparency"],"a":[1],"e":"(2.1.1) The Economic Importance of the Futures Market\n\n1. Price Discovery\nFutures market prices depend on a continuous flow of information from around the world and thus require a high amount of transparency. Factors such as political, (elections, war), economic (recessions, bankruptcies), socio-cultural (disruptive societies, ethnic tensions) and environmental (pollution, deforestation) can all have a major effect on supply and demand and, as a result, the present and future price of commodities and financial assets.\n\nDue to its highly competitive nature, the futures market is an important economic tool to determine prices based on today's information and tomorrow's projected supply and demand. How market participants absorb the information constantly changes the prices of commodities and assets – a process known as price discovery.\n\n2. Risk Management\nFutures markets are also a place where investors manage risk. Risks are reduced because market prices are transparent and readily available, therefore participants' know how much they need to buy or sell. For consumers and buyers of commodities, hedging with futures helps to reduce the final cost to consumers by lowering the risk of manufacturers raising the prices of key supplies due to the volatility in the spot market. Business managers and financial investors also use suitable futures contracts as part of their planning to reach their investment objectives.","ref":"Page 8 | Chapter 2"},{"n":40,"q":"A Fund manager wants exposure to the Straits Times Index (STI), which approach will be the least preferred because it involves greater degree of active management and incurred higher transaction costs?","o":["Buy all 30 component stocks of the STI","Buy STI futures","Buy STI options","Buy Total Return Swaps (TSR) on the STI"],"a":[0],"e":"Total Return Swap (TRS)\n\nA common derivative transaction, the TRS, is used under the indirect approach. To illustrate, assume that a fund wants to match the performance of the Straits Times Index (STI). The fund has many ways of tracking the index – simply buy the underlying 30 company shares which make up the STI with the corresponding weightings, or more realistically trade the STI futures. However, these strategies require some ongoing active management, either by frequently rebalancing the stock portfolio and reinvesting the dividends, or by rolling over the futures close to maturity.\n\nAlternatively, the investor may decide to enter into a TRS providing the STI total return every 6 months for the next 5 years based on the notional amount. In exchange, the investor would agree to pay a rate of SIBOR plus (for example, 30 basis points = SIBOR + 30bps) per annum. In this way, the fund would have achieved its objective of matching the return of the index at a spread cost of 30bps","ref":"Page 19 | Chapter 2"},{"n":41,"q":"Under the UCITS III Guidelines on ETFs, the 10% Counterparty Risk on ETFs ____________________.","o":["Applied to all ETF including Swap-based Full Replication and Representative Sampling ETFs","Is implement back to the day the ETF is established and no further intervention is needed","Is based on the swaps mark-to-market value of the fund's NAV on a monthly basis","Can be decreased to less than 10% voluntarily depending on the swap counterparty"],"a":[3],"e":"(8.2.8) ETF & Fund Governance in USA and Europe\n\nUnder the UCITS regulations, it became possible for ETFs to invest in instruments such as swaps, subject to certain counterparty risk exposure limits. Instead of holding all or a representative sample of the index constituents, swap-based ETFs use index swaps or equity-linked swaps to replicate the index performance. Among other investment restrictions, the UCITS regulations stipulate that an ETF is not allowed to invest more than 10 % of its prevailing NAV in derivative instruments including swaps issued by a single counterparty. In other words, the amount that the swap counterparty owes to the fund is limited to a maximum of 10 % of the fund's prevailing NAV.\n\nUnder the UCITS III guidelines, the swaps marked-to-market value cannot exceed 10% of the fund's NAV on a daily basis. Depending on the swap counterparty involved, this UCITS limit on counterparty exposure can be decreased to less than 10% voluntarily.","ref":"Page 184 | Chapter 2"},{"n":42,"q":"Which of the following is TRUE about Forwards and Futures contracts?","o":["A. Both Forwards and Futures contracts have mark-to-market procedure","B. Both Forwards and Futures contracts provide price discovery through an auction process","C. Forwards and Futures contracts with the same underlying asset and maturity date can have different level of counter party risks","D. Forwards and Futures contracts both offer standardized contract terms such as quality, quantity, delivery time and place."],"a":[2],"e":"(2.3.1) Futures versus Forwards\n\nFutures are standardised contracts for the purchase and sale of financial instruments or physical commodities, on a regulated futures exchange, for future delivery. Forwards are a private, cash-market agreement between a buyer and seller for the future delivery of a commodity, at an agreed upon price. These contracts are not standardised and are non-transferable between parties.","ref":"Page 10 | Chapter 2"},{"n":43,"q":"With DV01 of USD 10,000, the position size of a 1-year instrument is limited to USD 100 million (i.e. every basis point move would generate USD 10,000 profit or loss for the position). With the same DV01 of US$10,000, the size of a 5-year instrument will be limited to:","o":["USD 100 million","USD 200 million","USD 50 million","USD 20 million"],"a":[3],"e":"refer to:\n\nDV01 (dollar value per basis point) – This is the dollar change in price with respect to the yield of a fixed income security or a swap. It is also known as dollar duration, PV01 (present value of a 01), or PVBP (price value of a basis point);","ref":"Page 208 | Chapter 9"},{"n":44,"q":"Calculate the price of a bond based on the following information. Modified duration=4, market price of bond=$970, and the bond yield declines by 50 basis points.","o":["$989.40","$950.60","$1,000.00","$990.00"],"a":[0],"e":"Modified duration\n\nModified duration – This is a related to (iii) and measures the bond price's sensitivity to changes in interest rates. A higher modified duration implies that a security is more interest rate sensitive. It reflects the greater risks of longer-dated exposures compared to shorter-dated ones. Modified duration increases with:\n\nIncrease in time to maturity\n\nFall in coupon rates\n\nFall in bond yields.","ref":"Page 208 | Chapter 9"},{"n":45,"q":"A portfolio has a 3-month 95% VaR of $5 million. Which of the following statements about the portfolio is TRUE?","o":["There is a 95% probability that the portfolio will fall to 95% of its value within 3 months.","There is a 95% probability that the portfolio will fall by $5 million within 3 months.","There is a 5% probability that the portfolio will have a zero value within 3 months.","There is a 5% probability that the portfolio will fall by 5 million within 3 months."],"a":[3],"e":"refer to:\n\n(3) Value at Rick VaR\n\nA VaR statistic has three components:\n\n1. A relatively high level of confidence (typically either 95% or 99%);\n2. A time period (a day, a month or a year); and\niii. An estimate of investment loss (expressed either in dollar or percentage terms).\n\nFor example, if a portfolio has a 1-day 95% VaR of SGD 1 million, it means that there is a 5% probability that the portfolio will fall in value by more than SGD 1 million over a 1-day period. In other words, a loss of SGD 1 million or more on this portfolio is expected on 1 day in 20.","ref":"Page 209 | Chapter 9"},{"n":46,"q":"If an investor has a bearish market outlook, which of the following strategies would be suitable for him?","o":["Purchase of a yield enhanced note.","Call warrant purchase.","Purchase of an index-linked note.","Put warrant purchase."],"a":[3],"e":"(4.11.4) Put Buying Strategies\n\nBuying a put is a popular strategy used by investors who are bearish on the underlying share as it gives them the right, but not the obligation, to sell the underlying share at the strike price. An investor could buy a put to assume an uncovered position or for hedging.","ref":"Page 83 | Chapter 4"},{"n":47,"q":"For a single \"knock out\" call barrier option, the barrier level is:","o":["Call price < Strike price","Call price ≤ Strike price","Call price > Strike price","Call price ≥ Strike price"],"a":[3],"e":"refer to:\n\n11.3.1 Single Barrier Option\n\nThis is the most common type of barrier option, where there is one barrier. When the barrier level is reached, the option gets \"knocked out.\"\n\nThe barrier level is the call price, and with respect to the strike price:\n\nFor a call barrier option, the call price is HIGHER than or EQUAL to the strike price.\n\nFor a put barrier option, the put price is LOWER than or EQUAL to the strike price.","ref":"Page 229 | Chapter 11"},{"n":48,"q":"A spread that is constructed using options on the same underlying security, with the same strike price, but with different expiration dates is referred to as a _______.","o":["Diagonal spread","Synthetic spread","Vertical spread","Horizontal spread"],"a":[3],"e":"(10) Vertical, Horizontal & Diagonal Spreads\n\ni. Vertical spreads are constructed using options of the same class, same underlying security, same expiration month, but at different strike prices.\n\nii. Horizontal (or calendar spreads) are constructed using options of the same underlying security, same strike prices but with different expiration dates. It can be created by selling short-dated options and buying a long dated one expressing a view that the volatility may increase, or vice-versa.\n\niii. Diagonal spreads are created using options of the same underlying security but different strike prices and expiration dates. A diagonal spread is a combination of vertical and calendar spreads.","ref":"Page 96 | Chapter 4"},{"n":49,"q":"Which barrier options work like simple European-style options whereby they operate as if they are \"Out- of- the-Money (OTM)\" and become active when the spot price hits the strike price?","o":["\"Down & In\" calls and \"Down & Out\" puts","\"Down & In\" puts and \"Up & In\" calls","\"Down & Out\" calls and \"Up & Out\" puts","\"Down & Out\" puts and \"Up & Out\" calls"],"a":[1],"e":"refer to:\n\n11.3.3 Categories of Barrier Options\n\nFor Up-and-In calls and Down-and-In puts – These barrier options work just like simple European-style options that are out-of-the-money (OTM) until the barrier level is reached (i.e. trigger event), and the option then becomes active (i.e. \"knocks in\").\n\nFor Up-and-Out calls and Down-and-Out puts – These barrier options work like simple European-style options that are in-the-money (ITM) until the barrier level is reached (trigger event), and the option then terminates (i.e. \"knocks out\").","ref":"Page 230 | Chapter 11"},{"n":50,"q":"The terms in-the-money and at-the-money refer to the ____ of an option.","o":["Delta","Breakeven point","Moneyness","Put-call parity"],"a":[2],"e":"Moneyness refers to the potential profit or loss from the immediate exercise of an option. It describes the relationship between the strike price of an option and the current trading price of its underlying security. Terms such as in-the-money (ITM), out-of-the-money (OTM) and at-the-money (ATM), describe the moneyness of options.","ref":"Page 103 | Chapter 4"},{"n":51,"q":"All other variables being equal, which of the following statements about barrier options is TRUE?","o":["Single barrier options are cheaper than double barrier options.","Double barrier options are cheaper than both single barrier options and standard options.","Standard options are always cheaper than single barrier options.","Standard options are always cheaper than double barrier options."],"a":[1],"e":"refer to:\n\n(11.3.4) Advantages of Barrier Options\n\nBarrier options are cheaper and require a lower premium compared to standard options. The possibility exists that a knock-out barrier option will terminate before expiration (or a knock-in barrier option will never become active during its lifetime). Double barriers are cheaper than single barriers as the probability of being knocked out is higher (or probability of being knocked-in is lower);","ref":"Page 231 | Chapter11"},{"n":52,"q":"The delta of a callable bull/bear contract (CBBC) is ____.","o":["usually close to -2","usually equal to 1","usually close to zero","can be any number based on the specifications of the CBBC product"],"a":[1],"e":"refer to:\n\n11.5.1 Price Movement of a CBBC\n\nPrice changes of a CBBC tend to closely follow the prices changes of the underlying asset as the delta of the CBBC is close to 1. Hence, if the value of the underlying asset increases, the Bull CBBC (with conversion ratio of 1:1) will increase in value by approximately the same amount. For a Bear CBBC (with conversion ratio of 1:1), its value will decrease by approximately the same amount as the underlying asset.","ref":"Page 236 | Chapter 11"},{"n":53,"q":"Based on the following specifications of a Bear CBBC, calculate the theoretical value of the contract. Strike price=$30, Spot price of the underlying asset=$25, Financial cost till maturity=$5.00, and the Conversion ratio is 1:1.","o":["$5.00","$15.00","$12.50","$10.00"],"a":[3],"e":"refer to:\n\n(2.4.6) Mutual Offset System (MOS)\n\nCBBC Theoretical Price of:\n\nBull Contract = Underlying Asset Price-Strike Price + Financial Cost / Conversion Ratio\n\nBear Contract = Strike Price-Underlying Asset Price + Financial Cost / Conversion Ratio","ref":"Page 238 | Chapter11"},{"n":54,"q":"Investment in CFDs involves which of the following risks?\n\nI Currency risk\n\nII Volatility risk\n\nIII Counterparty risk.","o":["I, II & III","II & III","I & III","I & II"],"a":[0],"e":"refer to:\n\n(12.9) Risks of Investing in CFDs","ref":"Page 259 | Chapter 12"},{"n":55,"q":"Which of the following is an advantage of OTC options over the Exchange traded options?","o":["A. Customization to suits investor's needs","B. Daily pricing and Mark to Market procedure","C. Provision of liquidity by market makers","D. Regulatory oversight to minimized counter party risk"],"a":[0],"e":"Table 4.9 – Differences between Exchange-Traded and OTC-traded Options\n\nExchange Traded\n\nOriginated and traded on an organized and regulated exchange. Overseen by an extensive government and industry regulation.\nStandardised terms (e.g. type, notional size, expiration date) in the form of a public transaction\nSettled through a clearing house associated with the exchange. This guaratees performance of the option contract.\nDaily mark-to-market prices available because contracts are standardised.\n\nOTC Traded\n\nDoes not trade on an exchange or through a formalized trading system. Less regulation from government and industry bodies.\n\nContracts are not standardised. Option terms are tailor-made and can be fully customised to suit the needs of parties involves. Transactions are private.\nNo clearing house, leading to weaker performance guarantees. Counterparty risk needs to be managed and the selection of a reputable or financially sound counterparty or broker becomes important.\nDaily mark-to-market procedures may not be readily available.","ref":"Page 78| Chapter 4"},{"n":56,"q":"Which of the following BEST describes Country Risks?","o":["A product involving financial instrument issued in another country would have high exposure to Country Risk","Country Risk is the result of Government actions in that Country","A product issued by a company in a foreign country would have high exposure to Country Risk","Country risk is the risk related to the stability of the country's economy"],"a":[3],"e":"(9.2.1) Country Risk\n\nWhen undertaking an assessment of country risk, the PESTLE framework can be used:\n\nP – Political\n\nE – Economic\n\nS – Socio-cultural\n\nT – Technological\n\nL – Legal; and\n\nE – Environmental\n\nWhile investors are primarily concerned with the economic stability of the country and the companies from that jurisdiction, uncertainty and major changes in any other factors can impact the prevailing economic conditions and alter the country risk.\n\nWhen evaluating country risk, political risk is probably the most important variable to consider. Unexpected negative developments, such as a non-democratic change in government (military coup), government actions (capital controls) and announcement of new tax policies (higher tariffs), could have great impact on investments. Investors will lose confidence in that country's economy and this will lead to a fall in the value of financial assets.","ref":"Page 192 | Chapter 9"},{"n":57,"q":"Which of the following funds adopting the Constant Proportion Portfolio Insurance (CPPI) strategy will have the lowest allocation to the risky assets?\n\n | Crash Size | Cushion Value\nFund A | 20% | 25%\nFund B | 25% | 20%\nFund C | 30% | 35%\nFund D | 35% | 30%","o":["A. Fund A","B. Fund B","C. Fund C","D. Fund D"],"a":[1],"e":"How CPPI Works\n\nAsset Allocation – Adjustment is done periodically, usually once a month. The difference between the total portfolio value and the floor value is known as the cushion. If the cushion is large, the manager can afford to take more risk, i.e. higher allocation to risky assets, and vice versa.\n\nFloor Value – The floor value changes during the life of the structured product, depending on the remaining term to maturity and the yield curve at each point in time. As the investment moves towards maturity, the floor value approaches 100% of the principal sum.\n\nCrash Size – This is the percentage drop in underlying asset value in any one period in a crash scenario.\n\nMultiplier – This is used to determine the amount to be allocated to the risky asset component of the overall portfolio:\n\nMultiplier = 1 / Crash Size\n\nFor example, if the manager is of the view that the largest percentage crash for the chosen risky asset is 20%, then the multiplier is equal to 1/20%, or 5.\n\nRisky Asset – This is the component of the total portfolio which generates the upside returns. The amount allocated is driven by the multiplier and floor value:\n\nAllocation to Risky Asset = Multiplier x Cushion Value where Cushion Value = Total portfolio – Floor Value\n\nCushion Value = Total Portfolio – Floor Value\n\nMultiplier (M) = 1 / Crash Size\n\nAmount Invested in Risky Assets = M x Cushion Value\n\nSolution:\n\n1/20% x 25% =125.00%\n\n1/25% x 20% =80.00% (Ans)\n\n1/30% x 35% =116.67%\n\n1/35% x 30% =85.71%","ref":"Page 132 | Chapter 6"},{"n":58,"q":"Which of the following products is most likely to be used as the Return Component in structured products with aim to achieve potentially unlimited returns?","o":["Equity Index Futures","Coupon bonds","Credit default swaps","Butterfly spread"],"a":[0],"e":"(2) Return Component\n\nThe return component of a structured product comprises of financial instruments such as equities, equity indices, debt instruments or derivatives relating to equities, credit, foreign currency and commodities, or any combinations of these. There are no fixed forms or combinations for the return component. Depending on the investment strategy, instruments in the return component can be combined to provide pre-determined or potentially unlimited returns. It is important to note that the actual performance of the underlying instrument may differ from its expected returns.\n\nFor example, the return component in a structured product with some capital preservation can be invested in higher-yield bonds or junk bonds to achieve higher fixed returns, or invested in equity indices for potentially unlimited returns.","ref":"Page 126 | Chapter 6"},{"n":59,"q":"All of the following products has an embedded “short put” option written by the holder of the structured Notes, EXCEPT","o":["Accumulators","Bond Linked Notes","First to default Credit Link Notes","Zero coupon Plus Option"],"a":[3],"e":"(6.4.2) Short Option Strategy\n\nStructured products which employ the short option strategy include:\n\nDual currency investments\nEquity linked notes\nCredit linked notes\nBond linked notes\nRange accrual notes\nAccumulators\nDecumulators","ref":"Page 130 | Chapter 6"},{"n":60,"q":"Structured Products can be used for all of the following investors, EXCEPT","o":["An investor who wants to profit from the current market trend","An investor who wants investment flexibility in the products","An investor who wants to access to different asset classes","An investor who wants to trades in standardised products"],"a":[3],"e":"(6.1.2) Uses of Structured Products\n\nA structured product is created to meet specific needs that cannot be met by the standardized financial instruments available in the market. It can be used as an alternative to a direct investment, as part of the asset allocation process to reduce the risk exposure of a portfolio, or to profit from the current market trend. A structured product also increases the efficiency of a portfolio by catering to diverse risk-return profiles, if there is a wide variety of a financial instrument in the portfolio.\n\nFor example, an investor may wish to participate in the potential market upside and at the same time, want some principal preservation. Buying securities directly from the market will not satisfy the investor's needs, as the principal could be lost if securities prices decline. With a structured product that has underlying instruments of a bond and a call option on the securities, the investor can have his capital preserved and at the same time, benefit from the returns if securities prices advance.\n\nInvestors can choose from a wide range of structured products that offer yield enhancement, access to different asset classes, investment flexibility and other features which meet their financial objectives. Many structured products do not offer principal protection, and their principal payments and investment returns are mainly generated from long and short positions in various options","ref":"Page 124 | Chapter 6"},{"n":61,"q":"What is the “Cushion” of a structured fund?","o":["The peak to trough reduction of a fund's asset during a specified investment period","The market value of assets that the fund manager manages on behalf of investors","The portfolio return in excess of the benchmark index","The portion of the fund's assets that can be exposed to risk without jeopardizing the preservation feature of the fund"],"a":[3],"e":"Cushion. This is the portion of the fund's assets that can be exposed to risk without jeopardizing the preservation feature. For example, if a fund is worth SGD 100 and needs SGD 80 to honour the preservation, it can expose SGD 20 (“the cushion”) to risk, in order to boost returns.","ref":"Page 161 | Chapter 8"},{"n":62,"q":"If an investor currently has a long position in a physical share, he can undertakes to protect himself against the fall of the share price by ___________ position in Extended Settlement Contracts","o":["An Arbitrage trade","A Long hedge","A Short hedge","A stock spread"],"a":[2],"e":"(13.6) Trading Strategies Using ES Contracts\n\nThe aim of using ES contracts, in risk management or hedging, is either to achieve price certainty by locking in prices in advance or to protect against adverse price impact on the value of one's assets. Hedgers can seek to reduce price risk by buying ES contracts to create a long hedge or selling ES contracts to create a short hedge.\n\n13.6.1 Long Hedge\n\nES contracts can also be used to hedge an anticipated purchase of shares. In this case the investor wants to protect themselves against a rise in the price of shares before the purchase takes place. By buying ES contracts, the investor locks in the 'purchase' price for the underlying shares.\n\n13.6.2 Short Hedge\n\nInvestors can use ES contracts to hedge their physical shares. An investor with a long position in the underlying shares can consider taking short positions in related ES contracts and deliver the physical underlying shares at the maturity of the ES contract.","ref":"Page 269 | Chapter 13"},{"n":63,"q":"A foreign investor wants to assess the Liquidity Risks of investing in India equities securities. Which of the following Indian market indicators should he consider?","o":["Historical volatility and market disruption frequency","Interest rate risks and Currency risks","Issuer rating and credit default rate","Open Interest and trading volume"],"a":[3],"e":"Liquidity Risk\n\nSome useful indicators to gauge the level of liquidity for a particular futures contract and for particular delivery months are:\n\nTrading volume; or\n\nOpen interest (the number of open contracts not yet closed off or not yet delivered)","ref":"Page 195 | Chapter 9"},{"n":64,"q":"__________ is the risk cause by the time different between a financial instrument's commencement date and settlement date","o":["Legal risk","Liquidity risk","Transactional risk","Correlation risk"],"a":[2],"e":"(9.4.13) Transactional Risk\n\nThis refers to the risk resulting from the time difference between the commencement of a financial instrument contract and settlement of the contract. This is especially so when there is a difference in currencies between structured products and the financial instruments that it will enter into. After the commencement of a financial instrument contract, the pricing, terms and conditions are usually fixed. Investors of the structured product may have to bear any price fluctuations that occur between the contract commencement date and the settlement date.","ref":"Page 206 | Chapter 9"},{"n":65,"q":"Changes in the TED spread can provide an indication for which of the following risks?","o":["Interest rate risks.","Volatility risk.","Credit risk.","Correlation risk."],"a":[2],"e":"(3.3.4) TED Spread\n\nThe TED spread is used as an indicator of credit risk because U.S. T-bills are considered risk free, while the rate associated with the Eurodollar futures reflects the credit ratings of corporate borrowers. When the TED spread increases, default risk is seen to be increasing and investors will prefer safer investments. As the spread shrinks, the default risk is seen to be decreasing.","ref":"Page 39 | Chapter 3"},{"n":66,"q":"Which market signal indicates to investors that default risk in the Financial Market is rising?","o":["Narrowing butterfly spread","Narrowing calendar spread","Widening condor spread","Widening TED spread"],"a":[3],"e":"(3.3.4) TED Spread\n\nThe TED spread is used as an indicator of credit risk because U.S. T-bills are considered risk free, while the rate associated with the Eurodollar futures reflects the credit ratings of corporate borrowers. When the TED spread increases, default risk is seen to be increasing and investors will prefer safer investments. As the spread shrinks, the default risk is seen to be decreasing.","ref":"Page 39 | Chapter 3"},{"n":67,"q":"Which type of hedge is used when the time horizon of the Futures contracts straddles 2 expiry dates?","o":["Extrapolative hedge","Interpolative hedge","Strips hedge","Stacks hedge"],"a":[1],"e":"(3.4.7) Types of Hedges\n\n1. Strips and Stacks\nThe futures buyer must also consider and decide whether to use strips or stacks:\n\nStrips use successive futures contract months to match delivery dates on the futures contracts with the rollover dates or tenor on a cash loan.\nStacks use the deferred contract months to match the rollover dates or tenor on a cash loan.\n2. Time Horizon\nUnder normal market conditions, the nearby contract is preferred due to its liquidity and statistically high correlation to the movement of the underlying instrument. When there is a mismatch of the time horizon and expiry date, basis risk occurs. If the hedging horizon extends beyond the expiry of the nearby contract, the hedger has to decide whether to use the nearby contract and rollover into a deferred one or use a deferred contract from the beginning.\n\nBoth choices will have basis risk when the hedge is terminated. When there is no exact futures contract for hedging an exposure, the correlation between the hedge vehicle and the instrument to be hedged must be properly studied to achieve the desired results. When the maturity date of the underlying instrument does not coincide with the maturity date of the hedge instrument, two types of hedges can be considered:\n\nInterpolative hedge – used when time horizon straddles 2 expiry dates; and\n\nExtrapolative hedge – used when time horizon stretches beyond the tenor of the last traded contract.","ref":"Page 45 | Chapter 3"},{"n":68,"q":"When Option is “In-the-Money”, it mean that the option is","o":["A. Making a profit","B. Making a loss","C. Breaking even","D. Going to expire"],"a":[0],"e":"(4.4.2) Option Price\n\nBeing a derivative product, an option's value depends on the underlying asset's price. Moneyness refers to the potential profit or loss from the immediate exercise of an option. It essentially describes the relationship between the strike price of an option and the current trading price of its underlying security. An option's moneyness is described by the terms in-the-money (ITM), out-of-the-money (OTM) and at-the-money (ATM).\n\nAn option's price consists of two parts – intrinsic value and time value:\n\nOption Price = Intrinsic Value + Time Value\n\nIntrinsic value is the difference between the market price and the strike price. This difference is the amount by which the option is in-the-money.\n\nFor a call: Intrinsic Value = Current Market Price – Option Strike Price\nFor a put: Intrinsic Value = Option Strike Price – Current Market Price","ref":"Page 64 | Chapter 4"},{"n":69,"q":"In January, the share price of ABC Limited is $20.00. An investor buys the ABC Limited call option for $1.50, the exercise price of the call option is $14.00. In February, ABC Limited share price is $23.00. Assuming zero transaction cost, what is the break-even price for the buyer of the call option?","o":["A. $14.00","B. $15.50","C. $18.00","D. $20.00"],"a":[1],"e":"Breakeven point – The call option holder only breaks even if the price of the underlying rises above the exercise price by an amount equal to the price of the option. As the price of the ca
