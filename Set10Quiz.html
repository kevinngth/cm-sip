tment risk is greatest for bonds with large coupons, higher coupon payment frequency, long maturities, selling at a premium. Zero coupon bonds have no reinvestment risk, while callable bonds have high reinvestment risk.","ref":"Page 205 | Chapter 9"},{"n":144,"q":"The risk arising from the time difference between the commencement of a financial instrument contract and its settlement is referred to as the ____.","o":["correlation risk","transactional risk","structure risk","market risk"],"a":[1],"e":"(9.4.13) Transactional Risk\n\nThis refers to the risk resulting from the time difference between the commencement of a financial instrument contract and settlement of the contract. This is especially so when there is a difference in currencies between structured products and the financial instruments that it will enter into. After the commencement of a financial instrument contract, the pricing, terms and conditions are usually fixed. Investors of the structured product may have to bear any price fluctuations that occur between the contract commencement date and the settlement date.","ref":"Page 206 | Chapter 9"},{"n":145,"q":"Which of the following statements about Over-the-Counter (OTC) options and exchange-traded options is TRUE?","o":["OTC options have stronger government and industry oversight compared to exchange-traded options.","OTC options have higher degree of counterparty risk compared to exchange-traded options.","OTC options are more liquid as compared to exchange-traded options.","There is greater price transparency in OTC options as compared to exchange-traded options."],"a":[1],"e":"(4.2) Introduction to Options Trading\n\nIn 1973, the Chicago Board Option Exchange (CBOE) began trading listed call options on 16 underlying stocks. Prior to exchange-traded options, options were OTC products. Back then, option dealers matched buyers and sellers for a commission and OTC options contracts were usually executed at the prevailing share price with fixed time periods. Hence, it was difficult to find counterparties to liquidate a trade. The lack of liquidity and a proper market to regulate such trades eventually led CBOT, which had success with futures contracts, to create standardised options contracts. CBOT has since become the world's leading exchange for options trading. Compared with OTC markets, options exchanges provide more transparent pricing as well as liquidity.","ref":"Page 61 | Chapter 4"},{"n":146,"q":"Which of the following is NOT a function of the front, middle and back office staff of a brokerage firm? Managing the ____.","o":["credit risk","market risk","reinvestment risk","settlement risk"],"a":[2],"e":"(9.5) Trading Risk Control and Management\n\nThere are three main types of risks involved in trading:\n\nMarket risks\nCredit risks\nSettlement risks\nThe personnel in the front, middle and back office must be diligent to proactively monitor and manage these risks. Depending on whether futures or options are involved, the risk metrics used are different.","ref":"Page 207 | Chapter 9"},{"n":147,"q":"An option contract has a finite life and will lapse at the expiration date. __________ Options can only be exercised on the expiration date. For __________ options, the option holders can exercise their right at any time before expiration.","o":["European; American","American; European","In-the-money; Out-of-the-money","Out-of-the-money; In-the-money"],"a":[0],"e":"(4.4.2) Expiration Date\n\nAn option contract has a finite life and will lapse at the expiration date. European options can only be exercised on the expiration date. For American options, the option holders can exercise their right at any time before expiration.","ref":"Page 63 | Chapter 4"},{"n":148,"q":"An option's value depends on the underlying asset's price. An option's price consists of two parts.","o":["Option Price = Intrinsic Value + Time Value","Option Price = Intrinsic Value + Strike Price","Option Price = Strike Price + Time Value","Option Price = Time Value – Intrinsic Value"],"a":[0],"e":"(4.4.3) Option Price\n\nBeing a derivative product, an option's value depends on the underlying asset's price. Moneyness refers to the potential profit or loss from the immediate exercise of an option. It essentially describes the relationship between the strike price of an option and the current trading price of its underlying security. An option's moneyness is described by the terms in-the-money (ITM), out-of-the-money (OTM) and at-the-money (ATM)\n\nAn option's price consists of two parts – intrinsic value and time value:\n\nOption Price = Intrinsic Value + Time Value\n\nIntrinsic value is the difference between the market price and the strike price. This difference is the amount by which the option is in-the-money. An option contract has a finite life and will lapse at the expiration date. European options can only be exercised on the expiration date. For American options, the option holders can exercise their right at any time before expiration.","ref":"Page 63 | Chapter 4"},{"n":149,"q":"Which of the following is/are correct?\n\nI. For a call: Intrinsic Value = Current Market Price – Option Strike Price\n\nII. For a put: Intrinsic Value = Option Strike Price – Current Market Price\n\nIII. For a call: Intrinsic Value = Current Option Price – Option Strike Price\n\nIV. For a put: Intrinsic Value = Option Strike Price – Current Option Price","o":["I and II only","I and IV only","II and III only","III and IV only"],"a":[0],"e":"(4.4.3) Option Price\n\nBeing a derivative product, an option's value depends on the underlying asset's price. Moneyness refers to the potential profit or loss from the immediate exercise of an option. It essentially describes the relationship between the strike price of an option and the current trading price of its underlying security. An option's moneyness is described by the terms in-the-money (ITM), out-of-the-money (OTM) and at-the-money (ATM)\n\nAn option's price consists of two parts – intrinsic value and time value:\n\nOption Price = Intrinsic Value + Time Value\n\nIntrinsic value is the difference between the market price and the strike price. This difference is the amount by which the option is in-the-money. An option contract has a finite life and will lapse at the expiration date. European options can only be exercised on the expiration date. For American options, the option holders can exercise their right at any time before expiration.","ref":"Page 63 | Chapter 4"},{"n":150,"q":"In which of the following cases will the value of a put option decrease?   All other factors being equal, when there is a decrease in the ________.","o":["Exercise price","Volatility of the underlying share","Time to expiration","All of the above."],"a":[3],"e":"(4.5.7) Summary of Factors affecting Sensitivity of Equity Options\n\nThe table below summarises the relationship of factors with the equity option price:\n\nOption Price Sensitivity | Call Option | Put Option\nPrice of underlying share ↑ | ↑ | ↓\nExercise price ↑ | ↓ | ↑\nTime to expiration ↑ | ↑ | ↑\nVolatility of underlying share ↑ | ↑ | ↑\nRisk-free interest rate ↑ | ↑ | ↓\nExpected dividends ↑ | ↓ | ↑","ref":"Page 65 | Chapter 4"},{"n":151,"q":"A financial advisor recommends different product options for the same underlying investment that has the same risk-reward profile to a client. While making the investment decision, the client should accord the least priority to which of the following factors?","o":["Cheapest pricing.","Income payouts on regular or deferred basis.","Personal life-cycle profile.","His risk tolerance level."],"a":[0],"e":"(10.1.1) Wrappers\n\nStructured products are available to investors in a variety of wrappers. Common wrappers include deposits, notes and bonds, funds, warrants, ILPs, ETFs and ETNs. Even if the underlying instrument is the same, a wrapper offers certain benefits (as well as drawbacks) to meet the financial needs and objectives of investors, such as regular income payouts, favourable tax treatment and life insurance coverage. The variation of wrappers also enables financial intermediaries to focus on their clients' needs in various market segments, such as financial institutions, high net worth individuals, retirees and tax-exempt entities, by offering them tailored solutions.\n\nGiven the broad range of underlying combinations available, representatives of CMS licence holders must ensure that they understand and are able to explain the features, potential risks, costs and trade-offs associated with these products to their clients.","ref":"Page 215 | Chapter 10"},{"n":152,"q":"Which of the following correctly represents the structuring of a discount certificate?","o":["A short position zero-strike call option and a long call position on a given stock.","A long position zero-strike call option and a short call position on a given stock.","A long position zero-strike call option and a long call position on a given stock.","A short position zero-strike call option and a short call position on a given stock."],"a":[1],"e":"(10.3.2) Discount Certificates\n\nFor an equity discount certificate, the payoff is similar to that of a reverse convertible. The construction is different as it consists of a long position zero-strike call option and a short call position on a given stock (with a strike that is at-the-money or out-of-the money).","ref":"Page 225 | Chapter 10"},{"n":153,"q":"If the premium of a Nikkei 225 option changes by 5 point as the result of a 10 point change in the price of Nikkei 225 futures contract, the delta of the option is","o":["0.05","0.20","0.50","1.00"],"a":[2],"e":"(4.5.7) Summary of Factors affecting Sensitivity of Equity Options\n\nThe delta of the call option is a value between 0 to 1. Every increase in the underlying asset price results in a rise in the value of the call option. A decrease in the underlying price would result in a decrease in the call option value.\n\nThe delta of the put options is negative and has a value between -1 to 0. An increase in the underlying asset price results in a decrease in the value of the puts.\n\nPage 325 | Formulae sheet\n\nDelta = Change in option price/Change in underlying price\n\nΔ = ∂V/∂S\n\nWhere:  V is the option price and S is the underlying price.\n\nSolution:\n\nDelta of the option = 5 / 10 = 0.5 (Ans)","ref":"Page 65 | Chapter 4"},{"n":154,"q":"A reverse convertible is constructed using:","o":["A long zero-coupon bond and short put option","A short zero-coupon bond and short put option","A long zero-coupon bond and long put option","A short zero-coupon bond and long put option"],"a":[0],"e":"(10.3.2) Discount Certificates\n\nFor an equity discount certificate, the payoff is similar to that of a reverse convertible. The construction is different as it consists of a long position zero-strike call option and a short call position on a given stock (with a strike that is at-the-money or out-of-the money). The risk profile of a discount certificate is shown in the payoff diagram below:","ref":"Page 225 | Chapter 10"},{"n":155,"q":"Calculate the breakeven price for a put holder based on the following information. Spot price of the share is $100. Price of the put option purchased for strike price of $100 is $5. The stock price rises to $110 on the expiry date.","o":["$95","$115","$105","$90"],"a":[0],"e":"Put Options – Payoff at Expiration\n\nA put option gives the right to sell an asset at the exercise price. Here, the holder will not exercise the option unless the asset price is less than the exercise price. The solid line illustrates the payoff at maturity to the put option holder. If the share price at expiry is above the exercise price, the put has no value. If the share price falls below the exercise price, the put value at expiry increases. The broken line represents the put option holder's profit at expiry, net of the initial cost of the put.\n\ni. Breakeven – The put option holder only breaks even (net profit = 0) if the price of the underlying falls below the exercise price by an amount equal to the price of the option.\n\nii. Payoff – The payoff cannot be negative as the option is exercised only if S < X.\n\niii. Maximum Gain – Similar to buying call options, the maximum gain to a put option holder is the option payoff less the option price. The further the underlying asset price falls below the exercise price, the greater the put option's payoff.\n\niv. Maximum Loss – The option buyer would have already paid for the option, therefore the maximum loss is the option price.\n\nSolution:\n\nBreakeven price (Put) = Strike Price – Price of the Put option = $100 – $5 = $95 (Ans)","ref":"Page 68 | Chapter4"},{"n":156,"q":"In the case of a single knock-out (KO) barrier put option, the knock out put price is ____ than the strike price.","o":["less than","higher than","less than or equal to","higher than or equal to"],"a":[2],"e":"(11.3.1) Single Barrier Option\n\nThis is the most common type of barrier option, where there is one barrier. When the barrier level is reached, the option gets \"knocked out.\"\n\nThe barrier level is the call price, and with respect to the strike price:\n\nFor a call barrier option, the call price is HIGHER than or EQUAL to the strike price.\nFor a put barrier option, the put price is LOWER than or EQUAL to the strike price.","ref":"Page 229 | Chapter 11"},{"n":157,"q":"Which of the following statements about knock-out products and structured warrants is FALSE?","o":["There is no possibility of early termination in either product.","There is no margin requirement in either product.","Both products can be used to take a bullish or a bearish view of the market.","Both products can be used for similar classes of underlying assets."],"a":[0],"e":"(11.7) Knock-Out Products vs Structured Warrants","ref":"Page 243 | Chapter 11"},{"n":158,"q":"Which of the following CFDs DOES NOT have any counterparty risk?","o":["Direct market access business model CFDs.","Exchange-traded business model CFDs.","Market maker business model CFDs.","None of the above."],"a":[1],"e":"Exchange-Traded CFDs – These CFDs are traded on an exchange just like listed equities. Orders are placed through brokers who have access to the exchange. This type of CFD is not common and is currently only available in Australia.","ref":"Page 248 | Chapter 12"},{"n":159,"q":"If an investor has a negative view on a stock and believes the stock price will fall, he can execute a profitable trade with:","o":["Callable bull/bear contracts or CFDs only","CFDs or options only","Options or callable bull/bear contracts only","CFDs, options or callable bull/bear contracts"],"a":[3],"e":"(12.5) Advantages of CFDs over Other Instruments","ref":"Page 248 | Chapter 12"},{"n":160,"q":"An investor holding a CFD position can use a \"stop-loss\" order and:\n\nI It will always be executed when the market stock price hits the stop-loss price\n\nII It may not always be executed in a volatile market as the stop-loss price may not be hit\n\nIII To ensure further safety, the investor should use a \"guaranteed stop-loss\" as the order will be executed once the price is reached\n\nIV The CFD margin requirement can be lower than a position without a \"stop-loss order","o":["I & III","I, III & IV","II & III","II, III & IV"],"a":[3],"e":"(a) Stop-Loss Order\n\nThe use of a stop-loss strategy can be risky. Even if a stop-loss price has been set, the CFD provider may not always execute the stop-loss order at the price. This can happen in volatile market conditions where there may be price jumps and there is no transaction taking place at the set order price. Some brokerage firms offer an additional premium service called \"guaranteed stop-loss\" whereby the stop-loss will always be executed when the underlying asset reaches the investor's specified set price.","ref":"Page 251 | Chapter 12"},{"n":161,"q":"Which of the following statements about equity CFDs is TRUE?","o":["Investors can only take a long investment position.","CFDs can be settled by cash or by physical delivery of the underlying asset.","Investors are entitled to receive cash dividends and participate in other corporate actions.","Investors are entitled to voting rights just as ordinary shareholders."],"a":[2],"e":"(12.6.8) Corporate Actions\n\nCash Dividends\n\nDividends will be credited or debited based on the investor's CFD position. Investors with long positions in equity CFDs will receive a dividend credit, while those with short positions will have the dividend amount debited from their accounts.","ref":"Page 255 | Chapter 12"},{"n":162,"q":"Equity Contracts for Differences (CFDs) and futures contracts have which of the following features in common?","o":["Entitlement to underlying share dividends.","Fixed maturity dates.","Use of leverage.","Absence of counterparty risk."],"a":[2],"e":"(12.6.9) Comparing CFDs with Futures","ref":"Page 256 | Chapter 12"},{"n":163,"q":"Which of the following strategies is employed by CFD investors?","o":["Bear spread.","Butterfly spread.","Condor spread.","Pairs trading."],"a":[3],"e":"(12.8.2) Trading in Pairs\n\nCFD pairs trading involves taking positions in two CFDs – one long and one short. The objective of this strategy is to exploit a perceived deviation in the underlying share prices from historical norms and the likelihood of price reversion to the normal trend in the near future.","ref":"Page 258 | Chapter 12"},{"n":164,"q":"Extended Settlement Contracts are used to make capital gains by ____.","o":["arbitrageurs","market makers","speculators","hedgers"],"a":[2],"e":"(13.2) Types of Investors who invest in ES contracts\n\nES contracts can be used by market participants to attain various financial objectives:\n\n1. Hedgers use ES contracts to manage their cash market exposure by holding underlying share and selling ES contracts to lock in prices.\n2. Speculative investors trade ES contracts for capital gain with the benefit of leverage as well as an extended settlement period.\n3. Arbitrageurs seek to take advantage of market inefficiencies by making simultaneous trades that offset each other and capture risk-free profits.","ref":"Page 263 | Chapter 13"},{"n":165,"q":"Purchasing an extended Settlement contract is different from purchasing share options mainly because of","o":["the economic interest in underlying shares","the required margins on purchase","liquidity","volatility of the underlying share"],"a":[0],"e":"(13.3.6) Changes in Interests\n\nTransactions in ES contracts can translate into changes of interest in the underlying security because on the settlement date, the buyer is obliged to take delivery of and the seller is obliged to deliver the underlying shares. Therefore, a position in an ES contract represents an economic interest in the underlying security, and the CMS licence holder and trading representative must record the ES transaction in the register of securities","ref":"Page 264 | Chapter 13"},{"n":166,"q":"Which statement regarding ES contracts procedures is CORRECT?","o":["ES contracts trading schedule is flexible and can be done according to the date and time set by the brokerage firm for individual contracts","First trading day is the 15th of the month immediately preceding the contract month","If all positions on outstanding ES contracts have been settled, it may be removed from quotation by SGX if it is deemed fit by SGX due to market conditions","ES contracts do not require any initial or maintenance margins"],"a":[2],"e":"(13.4.1) Underlying Securities\n\nEach ES contract is based on a single underlying SGX-ST security. Not all securities listed on SGX-ST will have corresponding ES contracts offered for listing and trading.\n\nThe criteria for share selection include trading volume and market capitalisation. SGX will conduct periodic reviews on the list of selected securities to take into account relevant market conditions. If the need arises, SGX may remove any ES contract from quotation before the LTD if all positions in such ES contract have been offset.\n\nIf there are positions in such ES contract that are not offset, SGX may require that such positions be cash settled immediately according to the terms prescribed by SGX-ST, or restrict trading only to enable those positions to be offset.","ref":"Page 265 | Chapter13"},{"n":167,"q":"Settlement of an ES contract is done on:","o":["Last Trading Day (LTD)","Last Trading Day + 1 (LTD+1)","Last Trading Day + 2 (LTD+2)","Last Trading Day + 3 (LTD+3)"],"a":[3],"e":"(13.4.4) Settlement by Delivery of Underlying Securities\n\nSettlement of ES contracts takes place by way of delivery of the underlying securities on the 3rd business day after the Last Trading Day (LTD+3). At LTD+3, ES contracts are settled in the same manner as ready market contracts. Payment and receipt of the purchase and sale consideration respectively will take place in accordance with the current practice of the ready market5.\n\nIf the seller of the ES contract does not have any or sufficient underlying securities of the ES contract on\n\nSettlement Date, CDP will commence buying-in of the underlying securities and the current procedures for buying-in under the CDP Clearing Rules will apply to such buying-in","ref":"Page 266 | Chapter13"},{"n":168,"q":"Which of the following hedging strategies can be employed using Extended Settlement Contracts if an investor has a long cash position in shares?","o":["An arbitrage trade.","A long hedge.","A short hedge.","A stock spread."],"a":[2],"e":"(13.6.2) Short hedge\n\nInvestors can use ES contracts to hedge their physical shares. An investor with a long position in the underlying shares can consider taking short positions in related ES contracts and deliver the physical underlying shares at the maturity of the ES contract.","ref":"Page 270 | Chapter13"},{"n":169,"q":"An investor purchases an ES Contract for 5,000 shares at $100 per share. The maintenance margin is 10%. If the price of the underlying shares declines to $90, what is the total required margin?","o":["$25,000","$50,000","$95,000","$75,000"],"a":[2],"e":"(13.7.2) Key Margining Conceptss","ref":"Page 273 | Chapter 13"},{"n":170,"q":"If there is a margin call for an ES contract position and the client indicates that the margin amount is forthcoming within the T+2 period, new orders may be accepted if they are:","o":["Risk increasing or risk neutral","Risk reducing only","Risk reducing or risk increasing","Risk increasing, risk neutral or risk reducing"],"a":[3],"e":"(13.7.8.1) Allowable Trading Activity within T+2 Period\n\nIf the Member or Trading Representative receives indication from the customer that margins are forthcoming within T+2:","ref":"Page 278 | Chapter13"},{"n":171,"q":"Which of the following statements about Extended Settlement (ES) contracts, margin financing and contra trading is TRUE?","o":["Contra trading has the highest borrowing cost among the three.","Leverage required for ES contracts is higher than that for margin financing.","Short selling is not allowed for ES contracts.","ES contracts have the highest financing cost."],"a":[1],"e":"(13.10) Comparing ES contracts with Contra and Margin Financing","ref":"Page 281 | Chapter13"}];
const TITLE = "CM-SIP Set 10 (Must do)";
const SIZE = 25;
const MODE = "instant";          // "instant" | "submit"
const SHUFFLE = false;
const L = ['a','b','c','d','e','f'];
const app = document.getElementById('app');
let state = null;

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  state=null;
  const sets=[];
  for(let i=0;i<DATA.length;i+=SIZE) sets.push([i,Math.min(i+SIZE,DATA.length)]);
  app.innerHTML = `<h1>${esc(TITLE)}</h1>
  <p class="sub">${DATA.length} questions &middot; ${sets.length} practice sets of up to ${SIZE}.</p>
  <div class="grid">
    <button class="setbtn rand" data-r="1"><b>Random ${Math.min(SIZE,DATA.length)}</b><span>Drawn from all ${DATA.length}</span></button>
    ${sets.map((s,i)=>`<button class="setbtn" data-i="${i}"><b>Set ${i+1}</b><span>Q${DATA[s[0]].n}&ndash;Q${DATA[s[1]-1].n} &middot; ${s[1]-s[0]} questions</span></button>`).join('')}
  </div>`;
  app.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{
    if(b.dataset.r){
      const idx=shuffled(DATA.map((_,i)=>i)).slice(0,SIZE);
      start(idx,'Random '+idx.length);
    } else {
      const s=sets[+b.dataset.i], idx=[];
      for(let k=s[0];k<s[1];k++) idx.push(k);
      start(SHUFFLE?shuffled(idx):idx,'Set '+(+b.dataset.i+1));
    }
  });
}

function start(idx,title){
  state={idx,title,picked:new Array(idx.length).fill(null),right:0,answered:0,graded:MODE!=='submit'};
  render();
}

function render(){
  const {idx,title}=state;
  app.innerHTML = `<div class="bar"><h2>${esc(title)}</h2>
    <span class="pill">Answered <b id="ans">0</b>/${idx.length}</span>
    ${MODE==='submit'?'':'<span class="pill">Score <b id="scr">0</b></span>'}
    <button class="lnk" id="back">&larr; All sets</button></div>
    <div id="qs"></div>
    ${MODE==='submit'?'<div class="foot"><button class="btn" id="grade" disabled>Submit answers</button></div>':''}
    <div id="end"></div>`;
  document.getElementById('back').onclick=home;
  const box=document.getElementById('qs');
  idx.forEach((qi,pos)=>{
    const q=DATA[qi];
    const el=document.createElement('div'); el.className='q'; el.id='q'+pos;
    el.innerHTML = `<div class="qn">Question ${pos+1} &middot; source Q${q.n}</div>
      <div class="qt">${esc(q.q)}</div>
      ${q.o.map((t,i)=>`<div class="opt" data-i="${i}"><span class="k">${L[i]}.</span><span>${esc(t)}</span></div>`).join('')}
      ${q.a.length>1?`<div class="note">The source marks ${q.a.map(i=>L[i]).join(' and ')} as correct &mdash; either is accepted.</div>`:''}
      ${q.a.length===0?`<div class="note">No answer recorded for this question in the source.</div>`:''}
      ${(q.e||q.ref)?`<div class="expl" id="e${pos}" style="display:none">${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${esc(q.e||'')}</div>`:''}`;
    el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(el,pos,qi,+o.dataset.i));
    box.appendChild(el);
  });
  if(MODE==='submit') document.getElementById('grade').onclick=gradeAll;
  window.scrollTo(0,0);
}

function pick(el,pos,qi,choice){
  if(state.graded && state.picked[pos]!==null) return;
  const q=DATA[qi], first=state.picked[pos]===null;
  state.picked[pos]=choice;
  if(first) state.answered++;
  document.getElementById('ans').textContent=state.answered;

  if(MODE==='submit'){
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.i===choice));
    const g=document.getElementById('grade');
    if(g) g.disabled = state.answered<state.idx.length;
    return;
  }
  if(q.a.includes(choice)) state.right++;
  el.classList.add('done');
  el.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    if(q.a.includes(i)) o.classList.add('correct');
    else if(i===choice) o.classList.add('wrong');
  });
  document.getElementById('scr').textContent=state.right;
  const ex=document.getElementById('e'+pos); if(ex) ex.style.display='block';
  if(state.answered===state.idx.length) finish();
}

function gradeAll(){
  state.right=0;
  state.idx.forEach((qi,pos)=>{
    const q=DATA[qi], el=document.getElementById('q'+pos), choice=state.picked[pos];
    if(q.a.includes(choice)) state.right++;
    el.classList.add('done');
    el.querySelectorAll('.opt').forEach(o=>{
      const i=+o.dataset.i;
      o.classList.remove('sel');
      if(q.a.includes(i)) o.classList.add('correct');
      else if(i===choice) o.classList.add('wrong');
    });
    const ex=document.getElementById('e'+pos); if(ex) ex.style.display='block';
  });
  const g=document.getElementById('grade'); if(g) g.remove();
  finish();
}

function finish(){
  const n=state.idx.length, r=state.right, pct=Math.round(r/n*100);
  const wrong=state.idx.map((qi,pos)=>[qi,pos]).filter(([qi,pos])=>!DATA[qi].a.includes(state.picked[pos]));
  const end=document.getElementById('end');
  end.innerHTML=`<div class="res"><div class="score">${r} / ${n}</div>
    <div class="sub">${pct}% correct${wrong.length?` &middot; missed Q${wrong.map(([qi])=>DATA[qi].n).join(', Q')}`:''}</div>
    <div class="foot"><button class="btn" id="again">Retry this set</button>
    ${wrong.length?'<button class="btn sec" id="onlywrong">Retry missed only</button>':''}
    <button class="btn sec" id="home2">All sets</button></div></div>`;
  document.getElementById('again').onclick=()=>start(state.idx,state.title);
  const ow=document.getElementById('onlywrong');
  if(ow) ow.onclick=()=>start(wrong.map(([qi])=>qi), state.title+' (missed)');
  document.getElementById('home2').onclick=home;
  end.scrollIntoView({behavior:'smooth'});
}

home();
</script></body></html>
