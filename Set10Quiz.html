ll option is $1.50 and its exercise price is $14.00, the breakeven point for the call option buyer is when the price of the underlying is exactly $15.50.","ref":"Page 67 | Chapter 4"},{"n":70,"q":"A ___________ is created using options of the same underlying security, same strike prices but with different expiration dates","o":["Diagonal spread","Horizontal spread","Vertical spread","Synthetic spread"],"a":[1],"e":"(10) Vertical, Horizontal & Diagonal Spreads\n\nThe three basic classes of spreads are the vertical spread, the horizontal spread and the diagonal spread. They are categorized by the relationships between the strike prices and expiration dates of the options involved.\n\n1. Vertical spreads are constructed using options of the same class, same underlying security, same expiration month, but at different strike prices.\n2. Horizontal (or calendar spreads) are constructed using options of the same underlying security, same strike prices but with different expiration dates. It can be created by selling short-dated options and buying a long dated one expressing a view that the volatility may increase, or vice-versa.\niii. Diagonal spreads are created using options of the same underlying security but different strike prices and expiration dates. A diagonal spread is a combination of vertical and calendar spreads.","ref":"Page 96 | Chapter 4"},{"n":71,"q":"Which of the following will affects the risk-return profile of structured products?\n\nI    Reinvestment risk\n\nII   Interest rates\n\nIII  Participation rate","o":["II only","III only","I and II only","I, II and III"],"a":[1],"e":"(10.1.2) Risk-Return Profile of Structured Products\n\nWhen evaluating structured products, investors should go beyond comparing the potential returns. As structured products contain derivatives, they should understand the risk exposure of the specific type of derivative as well as the underlying asset's representative market benchmark.\n\nThe next step would be an analysis of the product's risk-return profile, which is done by examining the derivative's price paths and payoffs, taking into account the upside and downside possibilities, and seeing how a change in some of the variables can lead to different outcomes. The overall risk-return profile of the structured product must be evaluated against the investor's risk tolerance and objectives to determine its suitability for the investor.\n\nParticipation Rate\n\n[illegible]\n\nLet us assume that in a simplified investment world, the discount sum ($100 – PV), is exactly equal to the price of the call option. In this scenario:\n\nOption maturity = Bond maturity; and\nStrike price = Spot price at the time of issuance.\nHence, there will be 100% performance participation on the upside for the investor for any movement of the S&P 500 index up to the option expiration date.\n\nIt is not always the case that the investor gets a 100% participation rate on the underlying index. If the discount sum is less than the cost of the call option, the product issuer will buy fewer option contracts and the participation rate will be less than 100%. Similarly, if the discount sum allows the issuer to purchase more call option contracts, the participation rate can exceed 100%.\n\nTherefore an investor analysing a structured note should understand the underlying asset benchmark and the participation rate as they will have an impact on the note's upside performance and overall returns.\n\nFurthermore, the 100% principal payout is a forecasted number and is not guaranteed. The investor must assess the various risks, as which could affect with similar fixed income and OTC-traded financial products, which include counterparty, credit, investment, liquidity and market risks.","ref":"Page 217 | Chapter 10"},{"n":72,"q":"A futures trader buys a futures contract because he expects the price of the underlying to rise. What is this type of trading strategy called?","o":["Basis trading","Hedge trading","Outright trading","Spread trading"],"a":[2],"e":"(3.2) Types of Trading & Strategies\n\nThe main investment and trading strategies used in the futures markets are:\n\nOutright trades\nHedging\nBasis trades\nSpread trades\n1. Outright trades – An investor can simply decide to buy or sell a futures contract, thereby wagering that the price of the underlying asset will rise or fall. Outright trades are familiar to most equity investors and are easy to understand.\n2. Hedging – The trader sells a futures contract to offset positions he/she holds in the cash market. For instance, if you have a large portfolio of U.S. stocks that you do not want to sell for tax reasons but fear a sharp market decline, you could sell S&P 500 index futures as a hedge against a market decline.\n3. Basis trades – This is an arbitrage trading strategy where the trader takes opposing long and short positions in the two securities to profit from the convergence of their values. The strategy is called basis trading because it aims to profit off very small basis point changes in value between two securities.\nFor example, a trader could be long (short) futures and short (long) the spot market in Treasuries. He could buy 10-year U.S. Treasury bond futures and short physical 10-year U.S. Treasury bonds, expecting the undervalued futures to appreciate relative to the overpriced bond, thus netting him a profit from his positions. For the trader to make a worthwhile profit, he would have to undertake a large amount of leverage to increase the size of his positions.\n\n4. Spread trades – Spread trades are discussed in detail in the next section.","ref":"Page 36 | Chapter 3"},{"n":73,"q":"Which of the following SGX-DT product is eligible for mutual offset with Chicago Mercantile Exchange (CME)?","o":["Eurodollar Futures (ED)","MSCI Taiwan Index Futures (TW)","Japanese Government Bonds Futures (JG)","RMB Index Futures (RM)"],"a":[0],"e":"(2.4.6) Mutual Offset System (MOS)\n\nSGX-DC and the Chicago Mercantile Exchange (CME) have a long standing mutual offset arrangement since 1984 that allows market participants to initiate positions in one exchange for allocation to the other exchange on a real-time basis.\n\nCurrently the following SGX-DT products are eligible for mutual offset with CME:\n\nEurodollar Futures (ED)\nEuroyen (TIBOR) Futures (EY)\nNikkei 225 Index Futures (NK)\nUSD Nikkei 225 Index Futures (NU)\nCNX Nifty Index Futures (IN)","ref":"Page 18 | Chapter 2"},{"n":74,"q":"John Lee runs a USD 50 million Bond Fund and wants to hedge his portfolio with Treasury futures. The price of each US Treasury contract is USD 100000. If the hedge ration is 0.67, how many Treasury futures contracts should he sell?","o":["225 contracts","335 contracts","460 contracts","540 contracts"],"a":[1],"e":"(3.4.8) Hedging Long-Term Interest Rate Risk\n\nNumber of contracts = – Hedge ratio x Total value to be hedged / Par value of futures contract\n\nSolution:\n\nNumber of contracts = – 0.67 x $50000000 / $100000 = 335 (Ans)","ref":"Page 46 | Chapter 3"},{"n":75,"q":"ABC Company has issued a Call warrant with the following information:\n\nShare price of ABC: $8.00\n\nExercise price of call warrant: $9.50\n\nWarrant price: $1.00\n\nConversion ratio: 4\n\nWhat is the conversion price?","o":["A. $12.00","B. $12.50","C. $13.50","D. $15.00"],"a":[2],"e":"(5.4.2) Conversion Price (CP)\n\nThis is the total price which the investor pays by converting the warrants into the underlying security, and is also known as the breakeven price.\n\nCall Warrant: CP = X + nWP\n\nPut Warrant: CP = X – nWP","ref":"Page 110 | Chapter5"},{"n":76,"q":"Which of the following statements is TRUE?","o":["Auto callable structured products usually offer lower yield for investors","Auto callable structured products can only be constructed using “American” type barrier option","Structured products with barrier options have uncertain maturity and greater reinvestment risk","A plain Vanilla financial product and a structured product would have similar volatility risk if the underlying assets is the same"],"a":[2],"e":"With an auto-callable structured product, the investor's holding period horizon can be shorter than the maturity term as there is a probability of early redemption. The negative effects of mark-to-market valuation are avoided as once the call trigger is reached, the product is redeemed. The investor gets an early payment of the redemption amount as stipulated in the product term sheet, consisting of the initial capital and upside returns based the participation rate. The return component can be zero if the option is out-of-the money or even have a negative value if the structured product has a short put or a short call position.\n\nWith an auto-callable product, the investor faces call risk as he has no control over when the product may be called, leading to uncertainty on the exact holding period of the investment. The investor also faces reinvestment risk if the product is redeemed early. The investor will look at the prospective returns Offered by the product with respect to the potential yield and upside participation, and determine if the rewards are attractive enough to invest in for assuming these risks.","ref":"Page 220 | Chapter 10"},{"n":77,"q":"Which of the following is true about commodity warrants?","o":["A. Commodity warrants are only settle by physical settlement","B. Commodity warrant usually have a short expiry date than commodity futures and options","C. Commodity warrants are usually issued by Financial Institutions","D. Commodity warrant can be link to many different benchmarks"],"a":[3],"e":"(5.9.5) Commodity Warrants\n\nA commodity warrant is a warrant that has a commodity as its underlying asset. Oil and precious metals are popular underlying commodities for such warrants. Based on their market view, investors can trade warrants on the underlying commodities.\n\nCommodity warrants structured and marketed by banks are generally cash settled. These warrants usually have a much longer expiry date than commodity futures and options. As commodities are traded globally and are linked to different benchmarks, it is important to verify the correct benchmark or index to be used at settlement.\n\nCommodity warrants can also be issued by resource-based companies or commodity firms. Depending on the warrant's structure, settlement can be by cash or physical delivery. If the warrant is settled by physical delivery, specific terms and conditions must be confirmed (e.g. delivery location, additional storage, transport costs).","ref":"Page 117 | Chapter 5"},{"n":78,"q":"Which of the following are measures that Regulators and Securities Exchanges used to mitigate Market Disruption Risk?\n\nI    Circuit breakers\n\nII   Shock absorbers\n\nIII  Price limits","o":["I and II","I and III","II and III","I, II and III"],"a":[3],"e":"(9.2.4) Market Disruption Risk\n\nMarket disruption can be defined as the effects of a large and rapid change in the market price levels, causing the market to cease functioning in a regular manner. It is usually characterised by declines which cause widespread panic and results in disorderly market conditions. To mitigate this risk, regulators and securities exchanges could put in place the following measures:\n\nCircuit Breakers – Systems in cash and derivative markets that trigger trading halts;\nShock Absorbers – These are systems in the trading infrastructure that slow down trading when markets experience significant volatility but it does not halt trading completely; or\nLimits – Session or daily price limits can be imposed to limit price volatility without slowing or halting trading activity.","ref":"Page 194 | Chapter 9"},{"n":79,"q":"The put warrant of Alton Limited have the following details:\n\nExercise price: $5.50\n\nWarrant price: $0.90\n\nDelta: -25%\n\nGearing ratio: 7.0\n\nWhat is the effective gearing of Alton put warrant?","o":["1.75 times","1.375 times","-1.375 times","-1.75 times"],"a":[3],"e":"(5.2.10) Effective Gearing\n\nEffective gearing of a warrant is calculated simply by multiplying the delta of a warrant by its gearing:\n\nEffective gearing = Delta x Gearing\n\nEffective Gearing = -0.25 x 7.0 = -1.75 times (Ans)","ref":"Page 109 | Chapter 5"},{"n":80,"q":"The Delta of a Callable Bull Bear Contract (CBBC):","o":["Is usually very close to +1 or -1","Is usually higher than +1 or lower than -1","Is usually very close to 0","Varies depending on the Issuer's specifications for that specific CBBC contract"],"a":[0],"e":"(11.5.1) Price Moving of a CBBC\n\nPrice changes of a CBBC tend to closely follow the prices changes of the underlying asset as the delta of the CBBC is close to 1. Hence, if the value of the underlying asset increases, the Bull CBBC (with conversion ratio of 1:1) will increase in value by approximately the same amount. For a Bear CBBC (with conversion ratio of 1:1), its value will decrease by approximately the same amount as the underlying asset. The conversion ratio is the number of underlying assets that each unit of CBBC is obligated to buy or sell. For example, a conversion ratio of 10:1 means that 10 units of CBBC control 1 unit of the underlying asset.","ref":"Page 236 | Chapter 11"},{"n":81,"q":"Which of the following is TRUE about Company Warrants?","o":["Typically have 1 – 3 years maturity, which is longer than structured warrants","They are usually “European-Style” options, which can only be exercised at maturity","Warrant holders do not receive or paid any dividends or cash distributions","When warrants are exercised, the company's earnings per share is unaffected"],"a":[2],"e":"(5.12) Summary\n\nCompany warrants are generally issued by listed companies to existing shareholders as a “sweetener” attached to an offering of bonds or rights issues for shares. They are essentially a long-dated “American style” options, be exercisable at any time during the life of the warrants. Warrants are detachable from the host instrument and may be listed and traded separately.","ref":"Page 121 | Chapter 5"},{"n":82,"q":"Which of the following products has the LOWEST Participation Rate?\n\nEquity-Linked Structured Notes\n | Product A | Product B | Product C | Product D\nEquity Call Premium | $7.00 | $8.00 | $8.50 | $12.00\nZero-Coupon Bond | Bond A | Bond B | Bond C | Bond D\nFace Value ($) | $100 | $100 | $100 | $100\nDiscount Rate (%) | 3.00% | 3.25% | 3.75% | 4.00%\nYear to Maturity | 2.5 | 3 | 3.5 | 4\nPresent Value ($) | 92.88 | 90.85 | 87.91 | 85.42\nDiscount Sum ($) | 7.12 | 9.15 | 12.09 | 14.58","o":["Product A","Product B","Product C","Product D"],"a":[0],"e":"(1) Classic Structured Product – Equity-Linked Structured Note\n\nAn equity-linked structured note is a popular type of structured product and we will use it here for illustration. This note is a debt instrument issued by a financial institution. The construction of this type of structured product consists of:\n\nA principal/low-risk component (zero-coupon bond); and\nA return/high-risk component (call option)\nThe holder of this instrument has a long position in a zero-coupon bond and a long position in an equity call option. The primary objective of such a product is capital preservation. This is expected to come from the bond, which is issued at a discount to face value, and will accrete to par upon maturity. The secondary objective is to generate a positive return which is to be derived from the value of the call option at maturity.\n\nSolution:\n\nParticipation Rate = Discount Sum / Call Premium\n\nProduct A = $7.12 / $7.00 x 100% = 101.71% (Ans)\n\nProduct B = $9.15 / $8.00 x 100% = 114.38%\n\nProduct C = $12.09 / $8.50 x 100% = 142.24%\n\nProduct D = $14.58 / $12.00 x 100% = 121.50%","ref":"Page 216 | Chapter 10"},{"n":83,"q":"Using AUD as the based currency, calculate the theoretical price for a 6 months AUD/SGD forward contract based on the following market information:\n\nAUD/SGD spot: 1.162\n\n6 months AUD rate: 3.25%\n\n6 months SGD rate: 1.00%","o":["1.137","1.149","1.175","1.188"],"a":[1],"e":"(2) Interest Rate Parity Theory\n\nInterest Rate Parity Theory\n\nThe theory states that the forward (futures) premium or discount between 2 currencies should be equal to the difference in the domestic interest rates for securities of the same maturity (except for the effects of small transaction costs). If the interest rate parity relationship is violated, arbitrageurs can make risk-free profits in foreign exchange markets and their actions will force futures and spot exchange rates back into alignment.\n\nThe relationship between the spot rate and forward (futures) rate is as follows:\n\nF = S x [1 + Rc(n/360)] / [1 + Rb (n/360)]\n\nSolution:\n\nF= 1.162 x [1 + 1%(180/360)] / [1 + 3.25%(180/360)] = 1.162 x (1.005 / 1.01625) = 1.149 (Ans)","ref":"Page 26 | Chapter 2"},{"n":84,"q":"Which of the following is a common feature of both Equity Contract for Different contracts and Equity futures contracts?","o":["Entitlement to underlying shares dividends","Fixed maturity dates","Margin and Leverage","No Counterparty Risk"],"a":[2],"e":"(12.6.9) Comparing CFDs with Futures\n\n | CFDs | Equity Futures\nTrading Platform | Mostly OTC (except exchanged traded CFDs) so it leads to counterparty risk | On exchanges so no counterparty risk\nMaturity & Expiry Date | Extend/Rollover for as long as investor wishes (subject to CFD provider's policy on corporate actions) | Fixed maturity dates when contracts expire\nFinancing Cost | Yes – explicitly computed & added for duration of holding period | Yes – implicit and embedded in quoted price\nDividends | Entitled | Not entitled\nMargin & Leverage | Yes | Yes","ref":"Page 257 | Chapter 12"},{"n":85,"q":"Which of the following are features of Barrier Options?\n\nI    Barrier options required lower premium than standard options\n\nII   Barrier options are Exchange traded\n\nIII  There are four categories of barrier options: Up-and-In, Up-and-Out, Down-and-In, and Down-and-Out","o":["I and II","I and III","II and III","I, II and III"],"a":[1],"e":"(11.3.4) Advantages of Barrier Options\n\nThe advantages of a long position in barrier options are listed below:\n\nBarrier options are cheaper and require a lower premium compared to standard options. The possibility exists that a knock-out barrier option will terminate before expiration (or a knock-in barrier option will never become active during its lifetime). Double barriers are cheaper than single barriers as the probability of being knocked out is higher (or probability of being knocked-in is lower);\nHigher returns on capital investment for the investor if barrier conditions are satisfied (i.e. there is no knockout event or if the knock-in event occurs) as the investment sum is lower due to cheaper cost; and\nGreater selection of option products available for investors with diverse market views and with the benefit of leverage on capital invested.\nKnock-in barrier options are considered ideal for speculating large market moves, whereas knock-out barrier options are ideal for small moves in a sideways market.\n\nPage 230 | Chapter 11        (11.3.3) Categories of Barrier Options\n\nThere are four categories of barrier options:\n\nUp-and In, Up-and-Out, Down-and In, and Down-and Out","ref":"Page 231 | Chapter 11"},{"n":86,"q":"“Dividend Stripping” is a trading strategies used by investors of which of the following products?","o":["Options","Structured noted","Structured warrant","Contract for differences"],"a":[3],"e":"(12.8.1) CFD Trading Strategies\n\n12.8.1 Trading for Dividends (Dividend Stripping / Capture)\n\nA long position in equity CFD gives the investor the benefit of receiving dividends declared by the company. Conversely, the investor, who has a short position, has to pay back the amount of dividends declared. An investor can profit from positions in good yielding stocks by timing the trade of the equity CFD to his advantage.\n\nWhen the share goes ex-dividend, its price is theoretically supposed to fall by the dividend amount and there is no net difference in the total value to the shareholder. However, share prices do not always behave this way. If sentiment is positive or the stock is rising due to positive momentum, the share price may not fall by the full amount of the dividend, and may even get back to its pre-dividend level quickly.\n\nAn astute CFD trader can exploit such market anomalies and make a tidy profit by capturing the share dividend. He buys the CFD before the ex-dividend date and closes out his position shortly thereafter, before the share price has fully adjusted to the theoretical ex-dividend price. Such an investor will look out for companies that have good dividend payouts, monitor them and select the right share offering opportunities for a dividend stripping trade.","ref":"Page 258 | Chapter 12"},{"n":87,"q":"If an investment portfolio has a one week 90% VaR of USD10 million, what does it mean?","o":["A 90% probability of a loss of less than USD 10 million in the portfolio's value in one week","A 90% probability of a loss of more than USD 10 million in the portfolio's value in one week","A 10% probability of a loss of more than USD 10 million in the portfolio's value in one week","A 10% probability of a loss of less than USD 10 million in the portfolio's value in one week"],"a":[2],"e":"(3) Value at Rick VaR\n\nA VaR statistic has three components:\n\ni. A relatively high level of confidence (typically either 95% or 99%);\n\nii. A time period (a day, a month or a year); and\n\niii. An estimate of investment loss (expressed either in dollar or percentage terms).\n\nFor example, if a portfolio has a 1-day 95% VaR of SGD 1 million, it means that there is a 5% probability that the portfolio will fall in value by more than SGD 1 million over a 1-day period. In other words, a loss of SGD 1 million or more on this portfolio is expected on 1 day in 20.","ref":"Page 209 | Chapter 9"},{"n":88,"q":"When comparing knock-out products and structured warrants, which of the following if FALSE?","o":["Neither product allowed early termination","Neither product has margin requirements","Both products allowed the investors to take on a bullish or bearish view of the market","Both products can be based on similar underlying asset classes"],"a":[0],"e":"(11.7) Similarities and Differences between Knock-Out Products and Structured Warrant\n\n | CBBCs (Knock-Out Products) | Warrants\nUnderlying asset | Equities, market indices, commodities, currencies, others | Equities, market indices, commodities, currencies, others\nTrading method | Traded on a stock exchange | Traded on a stock exchange\nBullish View | Bull contract | Call warrant\nBearish View | Bear contract | Put contract\nStrike Price | Yes | Yes\nCall Price | Yes | No\nMandatory call mechanism | Yes – Early termination when Bull contract: underlying assets ≤ call price; Bear contract: underlying assets ≥ call price | No early termination\nImplied volatility | No – insignificant to pricing | Yes – affects pricing\nMaturity | Yes | Yes\nHolding cost | Financial cost will be deducted daily | Time decay – time value decreases gradually as product approaches maturity\nMargin requirement | No | No\nDuration | Determined by the issuer | Determined by the issuer\nMaximum loss | Limited to investment amount | Limited to investment amount","ref":"Page 243 | Chapter 11"},{"n":89,"q":"Which type of the underlying strategy in a structured product does not have a minimum return of principal in its maturity pay out?","o":["A. A Constant Proportion Portfolio Insurance (CPPI) Strategy","B. A Dynamic Proportion Portfolio Insurance (DPPI) Strategy","C. A physical asset plus a short knock-out option Strategy","D. A zero coupon bond plus a long call option Strategy"],"a":[2],"e":"For a CPPI product, principal preservation is a key consideration and setting the appropriate floor value allows this objective to be achieved. When the portfolio value drops to the floor, funds are allocated to the risk free asset, so that the investor can still receive the principal investment when the structured product matures.\n\nDPPI is similar to CPPI. Unlike CPPI, however, the multiplier is a variable instead of a constant number. DPPI is also known as Dynamic Portfolio Insurance (DPI).\n\nA structured product using a zero plus option strategy is usually more appealing to conservative investors. In the worst case scenario, the investor will still receive the principal back at maturity, subject to the creditworthiness of the issuing bank","ref":"Page 130-131 | Chapter 6"},{"n":90,"q":"Which of the following warrants or warrant related securities is suitable for investor who has a Bullish market outlook?","o":["Butterfly spread","Yield enhancement","Put warrant purchase","Call warrant purchase"],"a":[3],"e":"(5.11) Market Outlook and Products\n\nThe various financial instruments covered in this chapter can be used when the investor has the following market outlook:\n\nNeutral – Yield enhanced security;\nBullish – Call warrant purchase, convertible bond (near-term outlook is uncertain or bearish), index linked note; and\nBearish – Put warrant purchase.","ref":"Page 121 | Chapter 5"},{"n":91,"q":"When assessing whether a structured product is suitable for Investor, it is important to consider\n\nI    The client's risk appetite\n\nII   The client's liquidity needs\n\nIII  The product's risk, return and time horizon","o":["A. I and II","B. I and III","C. II and III","D. I, II and III"],"a":[3],"e":"(6.7) Suitability of Structured Products for Investors\n\nA structured product is considered a complex investment product, which may not be easily understood by some investors. Before participating in this product, the investor should consider the following factors:\n\nRisk appetite of investor – This refers to the investor's ability and willingness to take risk. Even though some structured products offer some capital preservation, there is still a possibility that the investor can lose all of his investment. The investor must be aware of this possibility when considering the product.\nLiquidity needs – Early withdrawal may result in loss of part of the investment principal and returns.\nInvestors must be prepared to keep the investment amount in the product until its maturity.\n\nProduct risks – Investors need to understand the scenarios that can cause the loss of their principal investments. This can be analyzed through understanding the nature of the product, the underlying financial instruments used and details of the product issuer.\nProduct returns – It is also important for the investors to understand how the returns are generated, by understanding how the underlying instruments perform under different market conditions.\nTime horizon – The value of certain structured products will only be fully realized if they are held to maturity. Some structured products have a long time horizon, and investors must take this into account and ensure that such products are suitable for their overall investment strategy. Some structured products, on the other hand, have a profile such that their values decline over time due to time value decay, and may actually be worthless at or near their expiry dates.","ref":"Page 135 | Chapter 6"},{"n":92,"q":"A commodity futures trader is long June platinum futures contract traded on CME, he simultaneously short June gold futures contract traded on EUREX. Which of the following descried the type of futures contracts held by the trader?","o":["Intra-commodity, intra-delivery and intra Exchange","Intra-commodity, inter-delivery and intra Exchange","Inter-commodity, intra-delivery and inter Exchange","Inter-commodity, inter-delivery and inter Exchange"],"a":[2],"e":"(3.3) Spread Trades\n\nA spread combines both a long and a short position, executed at the same time in related futures contracts. The purpose of the strategy is to mitigate the risks of holding only a long or a short position.\n\nMargin requirements tend to be lower due to the more risk adverse nature of spread trades. However, a spread may be vulnerable to both legs moving in the opposite direction of what the trader may have anticipated, therefore resulting in losses. There are various types of spread trades:\n\nThis spread trade can be described as:\n\nInter-commodity – gold and silver are both metal commodities but they are not identical;\n\nIntra-market – both commodities trade on the CBOT; or\n\nInter-delivery – one commodity is delivered in March and the other in June. (Also known as intra commodity","ref":"Page 36 | Chapter 3"},{"n":93,"q":"A UK based Fund Management Company runs two investment funds, Fund X and Fund Y, which are both registered in Dublin, capital of the Republic of Ireland. Both funds adopt the same internal administration and operational procedures. Fund X is a long only equity fund while Fund Y is a long/short equity fund. What would be the main different in risks between the two Funds?","o":["Funds structure","Governance","Investment style","Legal domicile"],"a":[2],"e":"(8.1.10) Risks of Structured Funds\n\nStructure funds cover a broad variety of investments. The characteristics and risk-return profile of a specific fund primarily depends on the underlying assets in the fund, such as equities, fixed income, commodities, real estate and other asset classes.\n\nRisk in a fund is also influenced by the investment style and strategies employed, such as long only, short, long/short, and other techniques that used by various traditional, hedge fund and alternative asset managers. Funds that use leverage and use derivatives as part of their investment strategy will have a higher risk profile. Currency risk would also be relevant for funds with foreign exchange positions and that hold assets which is outside the home market in their portfolio. Finally, a fund's operation and administration can contribute to its overall risk profile. This includes the fund's structure, legal domicile, governance, and fee structure and risk management policy.","ref":"Page 169 | Chapter 8"},{"n":94,"q":"A drop in the share price will course the _______ to decline.","o":["Call option value","Put option value","Interest rate","Dividend yield"],"a":[0],"e":"(4.5.7) Summary of Factors affecting Sensitivity of Equity Options\n\nThe table below summarises the relationship of factors with the equity option price:\n\nOption Price Sensitivity | Call Option | Put Option\nPrice of underlying share ↑ | ↑ | ↓\nExercise price ↑ | ↓ | ↑\nTime to expiration ↑ | ↑ | ↑\nVolatility of underlying share ↑ | ↑ | ↑\nRisk-free interest rate ↑ | ↑ | ↓\nExpected dividends ↑ | ↓ | ↑","ref":"Page 65 | Chapter 4"},{"n":95,"q":"An investor puts $500,000 into a Structured Deposit whose return is link to the S&P 500 index. The principal is 100% guarantee at maturity and the participation rate is set at of 50% of the S&P 500 index performance. At the time of placing the money, the S&P 500 index was at 2,000 and the strike price was set at 2,000. How much does the investor get at maturity if the S&P 500 index closes at 2,500?","o":["$500,000","$562,500","$625,000","$687,500"],"a":[1],"e":"(7.3.2) Structured Deposits\n\nStructured deposits are another product similar to structured notes as they are a debt obligation of the bank. However, unlike structured notes, structured deposits are a type of deposit and are not debentures. A structured deposit is essentially a combination of a deposit and an underlying financial instrument, where the return is linked to the performance of the underlying financial instrument. In Singapore, the distinguishing feature of structured deposits is that the principal sum, with or without interest, has to be repaid in full at maturity. This may not be so in other jurisdictions. For structured notes which are not principal protected, investors may potentially lose part of or the whole principal sum.\n\nStructured deposits can only be issued by banks and must meet the definition of “deposit” as defined under the Banking Act. However, they are not covered by the Deposit Insurance Scheme under the Deposit Insurance Act 2005 (MAS Guidelines on Structured Deposits). If an investor makes an early withdrawal of the deposit, part of the return and/or principal may be lost. The amount payable depends on the market value of the underlying financial instrument that the structured deposit is linked to, at the time of the early withdrawal.\n\nSolutions:\n\n[(2,500 – 2,000) / 2,000] x 100% = 25%\n\n25% x 50% = 12.5%\n\n$500,000 x (1 + 12.5%) = $562,500 (Ans)","ref":"Page 141 | Chapter 7"},{"n":96,"q":"Which of the following is FALSE about Structured Notes?","o":["Note holders have a claim on the underlying instruments","Structured Note can have structure which link coupon payments, principal repayment or both to the performance of the underlying instrument.","The notes can have credit default swaps, collateral debt obligations or a basket of instruments.","The notes are marked-to-market periodically until maturity."],"a":[0],"e":"(7.1) What is a Structured Notes\n\nA structured note is a debt instrument / debenture, whose return characteristics, such as coupon amount or market value, are linked to the performance of other underlying instruments. These instruments may include equities, indices, interest rates, credit default swaps, collateral debt obligations or a basket of instruments.\n\nWhile the underlying instruments are generally used as a reference for the note's performance, the note holder does not typically have claim over the underlying instruments. These structures usually have one or more embedded options or derivatives, or may employ other strategies using derivatives.","ref":"Page 138 | Chapter 7"},{"n":97,"q":"Which of the following is TRUE about Credit Linked Notes (CLN)?","o":["Credit Linked Notes are exchange traded products","Credit Linked Notes are structured using credit default swaps (CDS) linked to a particular company","Credit Linked Notes can only be settled in cash in the event of credit default","Credit Linked Notes investors are guaranteed to receive the principal at maturity"],"a":[1],"e":"(7.6.4) Credit Linked Notes (CLN)\n\nA credit linked note is another type of yield enhancement structured product. As the name suggests, it has exposure to the credit markets. In a CLN, the issuer offers credit insurance known as credit default swaps (CDS) linked to a particular company (referred to as “reference entity” in the term sheet). It has a fixed income investment, which is used as collateral against the credit insurance sold in the market.\n\nA CDS is akin to providing credit insurance on a reference entity. It is a contract between two counterparties, whereby the “buyer” pays periodic payments (insurance premium) to the seller in exchange for the right to a payout if there is a credit default of the “reference entity”. CDS are OTC-traded products. A credit default is defined as an event where the reference entity:\n\nFails to pay interest on its loan or bond; and/or\nIs unable to repay the bond or loan on maturity date.\nIn the event of a credit default, there are 2 ways to settle the CDS contract:\n\nPhysical settlement – The bank, being both the seller of the CDS and issuer of the CLN, pays the CDS buyer the principal amount of the CDS in cash and receives a debt obligation (i.e. a bond) of the reference entity that is now in default. In this scenario, the CLN investors end up owning the bond of the reference entity, which would have a value determined by the market.\nCash settlement – The bank pays the CDS buyer the difference between the par value and market price of a specified debt obligation of the reference entity, typically determined in an auction. In this scenario, the CLN investors will bear a loss equivalent to that difference.","ref":"Page 148 | Chapter 7"},{"n":98,"q":"Which of the following correctly describes a directly issued Structured Notes?","o":["The issuer creates a Special Purpose Vehicle (SPV) unit, which places the notes to end investors","The notes are issued directly by the Bank and are reflected as a liability on its balance sheets","Investors of directly issued structured notes have recourse to the SPV","The issuer places the notes to the end investors through financial intermediaries"],"a":[1],"e":"(7.2) Issuer\n\nA structured note can be directly issued by a bank, or a Special Purpose Vehicle (SPV) set up by the bank.\n\n7.2.1 Direct Issuance (On Balance Sheet)\n\nUnder direct issuance, the bank issues the notes to the note holders (investors). As the funds are raised directly by the bank, the debt will be reflected on its balance sheet as a liability. This debt is a direct obligation of the bank to its creditors and the investor bears the credit risk of the bank.\n\nThe issuer of a structured note may also enter into a swap transaction with another institution to derive the cash flows in order to pay coupons to investors (if any), and make redemptions on maturity or early redemption date. In the case where the issuer passes on the credit risk of the swap counterparty to the investors, the investor bears the credit risk of both the note issuer and the swap counterparty.\n\n7.2.2 Special Purpose Vehicle Issuance (Off Balance Sheet)\n\nThe SPV is a separate legal entity set up by the bank for the purpose of the transaction. The notes are issued to the note holders directly by the SPV. The SPV will then use the proceeds to buy fixed income securities such as zero coupon bonds, debt securities, CDOs or other asset-backed securities, either to preserve the principal capital (capital preservation product) or to use them as collaterals against the options or credit insurance which they sell to the market (yield enhancement product).\n\nAs the SPV's assets and liabilities are not reflected on the bank's balance sheet, it can be referred to as off balance sheet from the bank's perspective. In the event of a default, the note holders can only make a claim on the SPV's assets and they have no recourse to the bank which set up the SPV.","ref":"Page 140 | Chapter 7"},{"n":99,"q":"Which of the following could be a reason why a Structured Exchange Traded Fund (ETF) is trading at a Discount or Premium to its Net Assets Value (NAV)?\n\nI    Direct investment restrictions in certain markets\n\nII   Arbitrage traders are taking advantage of the discount or premium prices of the ETF\n\nIII  The Structured ETF is trading in different time zones from its underlying assets","o":["I and II","I and III","II and III","I, II and III"],"a":[1],"e":"(8.2.11) Risks of ETF\n\nNAV Trading at Discount or Premium\n\nETFs may be traded at a discount or premium to NAV. This price discrepancy may be caused by supply and demand factors or imbalances during periods of high market volatility and uncertainty. Discrepancies also arise for ETFs tracking specific markets or sectors that are subject to direct investment restrictions (e.g. China A shares) or for ETFs trading in different time zones from where the underlying assets it tracks are domiciled.","ref":"Page 182| Chapter 8"},{"n":100,"q":"A bond has the following information:\n\nModified Duration: -2.5\n\nDollar Value per Basis Point (DV01): $1.00\n\nCurrent market price of Bond: $950\n\nIf the bond yield decline by 10 Basis Point, what is the price of the bond now?","o":["A. $925","B. $945","C. $960","D. $970"],"a":[2],"e":"For fixed income securities, DV01 (dollar value per basis point) is a better measure for interest rate risk as it reflects the dollar, rather than the percentage change, in price with respect to the yield of a fixed-income security or a swap.\n\nDollar Value Per Basis Point (DV01) or Price Value of a Basis Point (PVBP)\n\nDV01 or PVBP = Price change that occurs if a bond's yield changes by 1 bps.\n\nSuppose Bond X is currently priced at $980 and its PVBP = $1.\n\nIf the yield of the bond increases by 5bps, what is the price now?\n\nSince PVBP = $1, the bond price will fall by 5pb x $1 = $5\n\nThe new price is: $980 – $5 = $975 (price & yield move inversely).\n\nSolution:\n\n$950 + $10 = $960 (Ans)","ref":"Page 208 – 209 | Chapter 9"},{"n":101,"q":"For a bond investor, which of the following products is likely to have the highest Reinvestment Risk?","o":["A. Convertible bonds with mandatory conversion feature","B. High coupon callable bonds","C. Low coupon non-convertible bonds","D. Zero coupon bonds"],"a":[1],"e":"(9.4.8) Reinvestment Risk\n\nReinvestment risk refers to the risk that investors have to reinvest their bond proceeds – coupons and/or principal – at an interest rate below their yield-to-maturity (YTM). If interest rates fall, bond proceeds can only be reinvested at the prevailing lower interest rates. Hence, the bond return will be lower than the YTM.\n\nReinvestment risk is greatest for bonds with large coupons, higher coupon payment frequency, long maturities, selling at a premium. Zero coupon bonds have no reinvestment risk, while callable bonds have high reinvestment risk.","ref":"Page 205 | Chapter 9"},{"n":102,"q":"Front, middle and back office staff working in a Broking Company firm operations are mainly concern with all of the following type of risks EXCEPT:","o":["A. Credit risk","B. Market risk","C. Reinvestment risk","D. Settlement risk"],"a":[2],"e":"(9.5) Trading Risk Control and Management\n\nThere are three main types of risks involved in trading:\n\nMarket risks\nCredit risks\nSettlement risks\nThe personnel in the front, middle and back office must be diligent to proactively monitor and manage these risks. Depending on whether futures or options are involved, the risk metrics used are different.","ref":"Page 207 | Chapter 9"},{"n":103,"q":"Trading volume and open interest are useful indication of ____________.","o":["Concentration Risk","Issuer Risk","Credit Risk","Liquidity Risk"],"a":[3],"e":"Liquidity Risk\n\nSome useful indicators to gauge the level of liquidity for a particular futures contract and for particular delivery months are:\n\nTrading volume; or\n\nOpen interest (the number of open contracts not yet closed off or not yet delivered)","ref":"Page 195 | Chapter 9"},{"n":104,"q":"Which of the following scenario best describe Concentration Risk in an investment plan?","o":["Counterparties are unwilling to transact a particular futures contract as the futures price has moved by the maximum allowable daily amount","Funds are allocated to a limited number of financial instruments or asset classes","Futures contract positions are significantly mismatched to the underlying asset resulting in over-hedging.","Large volumes of redemption occur at the end of a calendar month or quarter"],"a":[1],"e":"(9.2.5) Concentration Risk\n\nConcentration risk is generally applicable to investors who unevenly allocate their funds to only a very limited number of financial instruments or asset classes. Due to a lack of diversification, if one asset underperforms, the performance of the whole portfolio would suffer more than anticipated.","ref":"Page 194 | Chapter 9"},{"n":105,"q":"Structured products are availability to investors in different forms or wrapper which allowed financial intermediaries to achieve which of the following objective?","o":["A. Customized solutions to meet financial needs","B. Cheapest products and services","C. Maximum market returns","D. Guaranteed return and capital protection"],"a":[0],"e":"(10.1.1) Wrappers\n\nStructured products are available to investors in a variety of wrappers. Common wrappers include deposits, notes and bonds, funds, warrants, ILPs, ETFs and ETNs. Even if the underlying instrument is the same, a wrapper offers certain benefits to meet the financial needs and objectives of investors.","ref":"Page 215 | Chapter 10"},{"n":106,"q":"A Discount Certificate is a structured product that consists of a _______ position in a _______, and a ______ call position on a given stock.","o":["A. Long; call option; short","B. Long; put option; short","C. Long; call option; long","D. Short; put option; long"],"a":[0],"e":"(10.3.2) Discount Certificate\n\nFor an equity discount certificate, the payoff is similar to that of a reverse convertible. The construction is different as it consists of a long position zero-strike call option and a short call position on a given stock (with a strike that is at-the-money or out-of-the money).","ref":"Page 225| Chapter 10"},{"n":107,"q":"For a single knock-out barrier put option, the barrier level is when the put price is _____the strike price.","o":["Lower than","Higher than","Lower than or equal to","Higher than or equal to"],"a":[2],"e":"(11.3.1) Single Barrier Option\n\nThis is the most common type of barrier option, where there is one barrier. When the barrier level is reached, the option gets “knocked out.”\n\nThe barrier level is the call price, and with respect to the strike price:\n\nFor a call barrier option, the call price is HIGHER than or EQUAL to the strike price.\nFor a put barrier option, the put price is LOWER than or EQUAL to the strike price.","ref":"Page 228 | Chapter 11"},{"n":108,"q":"The specifications of a Bear CBBC (Callable Bull Bear Contracts) are as follow:\n\nStrike price = $20.00\n\nMaturity = 3 Months\n\nFinancial cost = $2.00\n\nConversion ratio 1:1\n\nCurrent spot price of underlying assets = $17.50\n\nWhat is the theoretical value of this Bear CBBC contract?","o":["$2.50","$3.00","$4.50","$5.00"],"a":[2],"e":"Theoretical Price of CBBC\n\nBull Contract = (Underlying Asset Price – Strike Price) + Financial Cost / Conversion Ratio\n\nBear Contract = (Strike Price – Underlying Asset Price) + Financial Cost / Conversion Ratio\n\nSolutions:\n\n[($20.00 – $17.50) + $2.00] / 1 = $4.50 (Ans)","ref":"Page 327 | Appendix D – Formulae Sheet"},{"n":109,"q":"Investors do not encounter counter party risk in which of the following business model of CFD (Contract for Differences)?","o":["A. Direct Market Access","B. Exchange – Traded CFDs","C. Market – Maker","D. None of the above – Counter party risk is inherent in all business model"],"a":[1],"e":"(12.4) CFD Business Models\n\nThere are three main business models used by CFD providers in global markets:\n\nMarket-Maker – The CFD provider makes a market in CFDs and quotes its own bid-ask prices based on the underlying asset.\nDirect Market Access (DMA) – The buy/sell order goes through the CFD provider's platform. The investor gets direct access to the market in which the underlying asset is traded, and its market price determines the price paid by the investor for the CFD contract. This is the predominant approach of brokerage firms who are CFD providers in Singapore.\nExchange-Traded CFDs – These CFDs are traded on an exchange just like listed equities. Orders are placed through brokers who have access to the exchange. This type of CFD is not common and is currently only available in Australia.","ref":"Page 248 | Chapter 12"},{"n":110,"q":"CFDs are __________ and have __________.","o":["A. Physically settled; an expiry date of up to 3 months","B. Physically settled; no expiry date","C. Cash settled; an expiry date of up to 6 months","D. Cash settles; no expiry date"],"a":[3],"e":"(12.3) Characteristics and Features of CFDs\n\nThe main characteristics and features of CFDs are:\n\nLeverage – The margin requirement is a fraction of the underlying asset value. For a small outlay, the investor can get a larger market exposure. For example, if the margin requirement is 10%, the potential gains can be magnified by a factor of 10. However, on the downside, any loss will also be magnified;\nFlexibility – It is easy to take long or short positions to exploit opportunities in both rising and falling markets;\nLow Cost – Brokerage commissions and finance charges tend to be low and highly competitive. In Singapore, there is no stamp duty to be paid;\nTransparency – The underlying asset or index is known at the outset and can be easily tracked as the CFD follows the underlying price very closely;\nEase & Simplicity – Investors can trade via a personal broker or online, with online trading being widely popular with investors. CFD providers are brokerage firms who are members of exchanges, with robust CFD online trading platforms that provide real-time information. Once the investor opens an account and has capital available, all he needs is internet access to trade in CFDs;\nNo Expiry Date – An open position can be rolled over and held as long as the investor wishes. The investor can close out his position when he so desires;\nAccess to Asset Classes – Investors can trade in CFDs on many individual stocks, indices, government treasuries, foreign exchange, commodities, real estate and ETFs. New asset classes and market indicators are always emerging and these products are offered to CFD investors, such as market volatility indices and weather futures;\nAccess to Global Investments – CFDs are not limited to domestic Singapore securities. The investor can access many equities, indices, investment classes and sectors that are traded worldwide on various exchanges;\nCash Settlement – CFDs are cash settled products as there is no delivery of any underlying instrument, such as a share certificate. The settlement involves the cash difference between the buy price and the sell price; and\nCorporate Actions – For equity CFDs, the investor holding a long position will get cash dividends on the underlying stock, and participate in share splits and other corporate actions, just as if the investor owns the physical stock (the opposite applies to an investor with a short position). The only major difference is that the CFD investor is not entitled to any voting rights.","ref":"Page 247 | Chapter 12"},{"n":111,"q":"Which of the following risks could be face by CFD investors?\n\nI    Leverage risk\n\nII   Currency risk\n\nIII  Volatility risk","o":["A. I and II","B. I and III","C. II and III","D. I, II and III"],"a":[3],"e":"(12.3) Characteristics and Features of CFDs\n\nThe main characteristics and features of CFDs are:\n\nLeverage – The margin requirement is a fraction of the underlying asset value. For a small outlay, the investor can get a larger market exposure. For example, if the margin requirement is 10%, the potential gains can be magnified by a factor of 10. However, on the downside, any loss will also be magnified;\nFlexibility – It is easy to take long or short positions to exploit opportunities in both rising and falling markets;\nAccess to Asset Classes – Investors can trade in CFDs on many individual stocks, indices, government treasuries, foreign exchange, commodities, real estate and ETFs. New asset classes and market indicators are always emerging and these products are offered to CFD investors, such as market volatility indices and weather futures;","ref":"Page 247 | Chapter 12"},{"n":112,"q":"Which type of investors use Extended Settlement contracts to make directional bets for capital gain with the benefit of leverage as well as an extended settlement period?","o":["A. Arbitrageur","B. Hedger","C. Market maker","D. Speculator"],"a":[3],"e":"(13.2) Types of Investors who invest in ES contracts\n\nES contracts can be used by market participants to attain various financial objectives:\n\nHedgers use ES contracts to manage their cash market exposure by holding underlying share and selling ES contracts to lock in prices.\nSpeculative investors trade ES contracts for capital gain with the benefit of leverage as well as an extended settlement period.\nArbitrageurs seek to take advantage of market inefficiencies by making simultaneous trades that offset each other and capture risk-free profits.","ref":"Page 263 | Chapter 13"},{"n":113,"q":"When comparing trading in Extended Settlement contracts, Margin Financing and Contra trading, which of the following is TRUE?","o":["A. ES contracts has the lowest financing cost","B. Short selling is not permitted on all ES contracts","C. Contra trading has the lowest leverage","D. ES contracts have the highest borrowing cost"],"a":[0],"e":"(13.10) Comparing ES contracts with Contra and Margin Financing\n\n | Contra Trading | Margin Financing | ES Contracts\nLeverage | Infinite Leverage | Shares 2X leverage; Cash 3x leverage | 5x to 20x Leverage\nFinancing Cost | <  3days, no financing cost; > 3 days, Cash tie-up | > 3 days, financing costs kick in | <= 35 days no financing cost; >= 35 days low opportunity cost on cash (margins only)\nShort Selling | Intra short selling | No short selling | Taking short positions up to the tenure of the contract\nBorrowing cost | N.A. | Reverse margin (SBL) involves borrowing cost | No borrowing cost","ref":"Page 281 | Chapter 13"},{"n":114,"q":"An investor entered into a long ES contract for 1,000 shares of ABC Limited at $20.00 a share. The maintenance margin is 15%. After a week, the price of ABC Limited share is $18.00, what is the total Required Margin?","o":["$2,000","$3,000","$5,000","$7,000"],"a":[2],"e":"(13.7.2) Key Margining Concepts\n\nRequired Margin = Maintenance Margin + Additional Margin\n\nThe maintenance margin is computed by multiplying the prescribed margin rate with the ES contract value. The ES contract value will be derived based on the last traded price of the underlying security in the ready market.\n\nSolution:\n\nRequired Margin = ($18,000 x 15%) + [($18 – $20) x 1,000] = $4,700 (Ans)","ref":"Page 273 | Chapter 13"},{"n":115,"q":"Listed Companies must be mindful that transactions in the ES contracts must comply with the relevant rules and regulations, because of the ____________ in the underlying shares.","o":["Changes in interest","Margining","Price volatility","Trading volume"],"a":[0],"e":"(13.3.6) Changes in Interests\n\nTransactions in ES contracts can translate into changes of interest in the underlying security because on the settlement date, the buyer is obliged to take delivery of and the seller is obliged to deliver the underlying shares.\n\nTherefore, a position in an ES contract represents an economic interest in the underlying security, and the CMS licence holder and trading representative must record the ES transaction in the register of securities.\n\nInvestors and directors of listed companies must also note that ES transactions can amount to a change of interest in the underlying security, and should comply with the relevant sections of the Companies Act (Especially sections 164-166), the SFA (Division 2 and 3 of Part VII), as well as Listing Rule 704 of the SGX-ST Listing Manual.","ref":"Page 265 | Chapter 13"},{"n":116,"q":"A warrant is trading at $0.40. The exercise price is $0.80. The share price is $2.40. What is its gearing? (Assume that the warrant is company-issued; in practice they all have a conversion ratio of 1, unless otherwise stated)","o":["2x","6x","3x","5x"],"a":[1],"e":"refer to:\n\nGearing ratio = Share price / (Warrant price x n)\n\nGearing indicates how many more warrants can be bought for a certain amount of capital, compared to buying the underlying share. For example, if the gearing of the warrant is 8x, the investor can have 8 times more underlying exposure than if they purchased the underlying with the same amount of capital.\n\nConversion ratio (n) is the number of warrants needed to be exercised to buy or sell one unit of the underlying security.","ref":"Page 108 | Chapter 5"},{"n":117,"q":"Calculate the effective gearing of a put warrant based on the following information. Exercise price=$10, Warrant price=$1.50, Delta=20%, Gearing ratio=5.0.","o":["1 time.","2 times.","3 times.","5 times."],"a":[0],"e":"refer to:\n\n(5.2.10) Effective Gearing\n\nEffective gearing of a warrant is calculated simply by multiplying the delta of a warrant by its gearing:\n\nEffective gearing = Delta x Gearing","ref":"Page 109 | Chapter 5"},{"n":118,"q":"Calculate the conversion price of a call warrant based on the following information. Market price of the underlying=$100, exercise price=$105, warrant price=$2, and conversion ratio=3.","o":["$111","$102","$106","$94"],"a":[0],"e":"refer to:\n\n(5.4.2) Conversion Price of Warrants\n\nThis is the total price which the investor pays by converting the warrants into the underlying security, and is also known as the breakeven price.\n\nCall Warrant: CP = X + nWP\n\nPut Warrant: CP = X – nWP","ref":"Page 110 | Chapter 5"},{"n":119,"q":"Company A's warrant is trading at $0.35, its exercise price is $0.50 while the share price is $0.65. What is its intrinsic value?","o":["$0.85","$0.15","$0.30","$1.00"],"a":[1],"e":"refer to:\n\n5.4.1 Intrinsic Value\n\nThis is the difference between the exercise price of a warrant and the market price of the underlying asset. Only in-the-money warrants have intrinsic value.\n\nCall Warrant: IV = MAX [0, (S – X)/h]\n\nPut Warrant: IV = MAX [0, (X – S)/h]","ref":"Page 110 | Chapter 5"},{"n":120,"q":"Which of the following statements about company warrants is TRUE?","o":["They are long-dated European exercise style options.","They cannot be detached or traded separately from the host instrument.","They usually have a longer maturity as compared to structured warrants.","Company warrant holders are entitled to receive dividends paid by the underlying shares."],"a":[2],"e":"refer to:\n\n(5.12) Summary\n\nCompany warrants are generally issued by listed companies to existing shareholders as a “sweetener” attached to an offering of bonds or rights issues for shares. They are essentially a long-dated Americanstyle” options, be exercisable at any time during the life of the warrants. Warrants are detachable from the host instrument and may be listed and traded separately.","ref":"Page 121 | Chapter 5"},{"n":121,"q":"Which of the following statements about foreign exchange (FX) warrants is TRUE?","o":["They are physically settled.","They are not leveraged instruments.","The price of a FX warrant depends on the change in the exchange rate between the two underlying currencies.","FX warrants are suitable only for investors who have a neutral view on the exchange rates between the underlying currencies."],"a":[2],"e":"refer to:\n\n(5.9.6) Foreign Exchange (FX) Warrants\n\nThe price of a FX warrant is driven by the changes in the exchange rate between the two underlying currencies. Similar to currency options, FX warrant holders have the right to exchange an amount of one currency into another currency at a specified exchange rate before or on a specified date.\n\nFX warrants are suited to investors who have a particular view on FX rates, either to hedge their currency exposure or speculate on currency movements. Before trading FX warrants, the investor has to identify which currency pair he wants trade, of which one currency is considered bullish and the other currency bearish, relative to one another. For example, for the USD/JPY pair, if the investor is bullish on USD and bearish on Yen, he will buy USD/JPY call warrants. Another investor who believes that the Japanese Yen will appreciate against USD will buy USD/JPY put warrants.\n\nFX warrants are cash settled and have features similar to other structured warrants. FX warrants are leveraged instruments where returns can be magnified when the FX market moves favourably. However, losses can be compounded if exchange rates move in the opposite direction from what the investor had anticipated. Investors should monitor FX movements closely and be aware of the macroeconomic factors which influence global and local economic activity, political developments, etc. Currencies of some countries which are endowed with abundant natural resources can be very responsive to moves in commodity prices, such as Australia and Canada.","ref":"Page 118 | Chapter 5"},{"n":122,"q":"Which of the following statements about a structured product with a long zero-coupon bond and a long call option is FALSE?","o":["The zero coupon bond provides a degree of capital preservation.","The long call provides the returns component.","Investors are subject to significant risks related to the mark-to-market prices from time to time till maturity.","Participation rate should be considered to assess the return potential of the product."],"a":[2],"e":"refer to:\n\n(6.4.1) “Zero Plus” Option\n\nA zero plus option strategy employs a zero coupon fixed income instrument, usually a zero coupon note with a call option on an underlying financial instrument. The underlying financial instrument can be an equity security, equity index, currency pair, commodity or commodity index. The performance of the underlying financial instrument determines the upside returns that the structured product investor gets.\n\nAs long as there is no credit event in the issuing bank, the investor will at least get back 100% of the principal sum. This strategy is also known as a capital preservation strategy. The return of this structured product is a function of the performance of the underlying asset over and above the strike price and the participation rate.","ref":"Page 129 | Chapter 6"},{"n":123,"q":"Which of the following strategy in a structured product will NOT guarantee the return of principal at maturity?","o":["A Constant Proportion Portfolio Insurance (CPPI) strategy.","A Dynamic Proportion Portfolio Insurance (DPPI) strategy.","A physical asset plus a short knock-out option strategy.","A zero-coupon bond plus a long call option strategy."],"a":[2],"e":"refer to:\n\n(6.4.2) “Zero Plus” Option\n\nFor a CPPI product, principal preservation is a key consideration and setting the appropriate floor value allows this objective to be achieved. When the portfolio value drops to the floor, funds are allocated to the risk free asset, so that the investor can still receive the principal investment when the structured product matures.\n\nDPPI is similar to CPPI. Unlike CPPI, however, the multiplier is a variable instead of a constant number. DPPI is also known as Dynamic Portfolio Insurance (DPI).\n\nA structured product using a zero plus option strategy is usually more appealing to conservative investors. In the worst case scenario, the investor will still receive the principal back at maturity, subject to the creditworthiness of the issuing bank","ref":"Page 130-131 | Chapter 6"},{"n":124,"q":"Which of the following aspects must be considered by financial advisers before recommending a structured product to clients?\n\nI    Risk appetite of client\n\nII   Time horizon of the client\n\nIII  Liquidity requirements of the client.","o":["I only.","II only.","I & III","I, II & III"],"a":[3],"e":"refer to:\n\n(6.7) Suitability of Structured Products for Investors","ref":"Page 135 | Chapter 6"},{"n":125,"q":"Which of the following statements about structured notes is FALSE?","o":["The note holders have a claim on the underlying instruments.","The notes can have structures which link coupon payments, principal repayment, or both to the performance of the underlying instrument.","The notes can have credit default swaps (CDSs) as underlying instruments.","The notes are marked-to-market periodically until maturity."],"a":[0],"e":"refer to:\n\n(7.1) What is a Structured Notes\n\nA structured note is a debt instrument / debenture, whose return characteristics, such as coupon amount or market value, are linked to the performance of other underlying instruments. These instruments may include equities, indices, interest rates, credit default swaps, collateral debt obligations or a basket of instruments.\n\nWhile the underlying instruments are generally used as a reference for the note's performance, the note holder does not typically have claim over the underlying instruments. These structures usually have one or more embedded options or derivatives, or may employ other strategies using derivatives.","ref":"Page 138 | Chapter7"},{"n":126,"q":"Which of the following statements about structured notes issued by special purpose vehicles (SPVs) is TRUE?","o":["The collateral held by the SPV will always enable the bank to guarantee the principal sum to the note holders.","The SPV is a separate legal entity set up by the bank to specifically manage the transactions and the legal liabilities related to the note issuance.","The SPV is a direct subsidiary of the bank, and the bank is fully liable to the note holders for the returns and principal sum.","The SPV's liabilities from the note issuance are reflected in the balance sheet of the bank."],"a":[1],"e":"refer to:\n\n(7.2.2) Special Purpose Vehicle Issuance (Off Balance Sheet)\n\nThe SPV is a separate legal entity set up by the bank for the purpose of the transaction. The notes are issued to the note holders directly by the SPV. The SPV will then use the proceeds to buy fixed income securities such as zero coupon bonds, debt securities, CDOs or other asset-backed securities, either to preserve the principal capital (capital preservation product) or to use them as collaterals against the options or credit insurance which they sell to the market (yield enhancement product).\n\nAs the SPV's assets and liabilities are not reflected on the bank's balance sheet, it can be referred to as off balance sheet from the bank's perspective. In the event of a default, the note holders can only make a claim on the SPV's assets and they have no recourse to the bank which set up the SPV.","ref":"Page 140 | Chapter 7"},{"n":127,"q":"Calculate the maturity payout value for an investor who invests $100,000 in an index-lined structured deposit with a participation rate of 20% of the index performance. The index value rises from 10,000 points to 12,000 points by the maturity date. The principal payment is guaranteed at maturity.","o":["$100,000","$104,000","$108,000","$120,000"],"a":[1],"e":"refer to:\n\n(7.3.2) Structured Deposits\n\nFrom a risk perspective, structured deposits are generally less risky than direct investments in underlying assets / financial instruments such as equities or bonds, because the bank has to repay the full principal at maturity or when it redeems the deposit before the maturity date (applicable to structured deposits with early redemption features). Structured deposits are considered riskier than normal deposits because their returns depend on the performance of other instruments. In some scenarios, investors may only get back the principal with no returns.","ref":"Page 141 | Chapter 7"},{"n":128,"q":"If an investor wants to participate in the upside potential of equities in a stock market, which of the following methods would lead to the HIGHEST active management and transaction costs?","o":["Purchase of the relevant equity index futures.","Purchase of the relevant equity index options.","Purchase of an ETF tracking the relevant equity index.","Purchasing of all the shares comprising the relevant equity index."],"a":[3],"e":"refer to:\n\nTotal Return Swap (TRS)\n\nA common derivative transaction, the TRS, is used under the indirect approach. To illustrate, assume that a fund wants to match the performance of the Straits Times Index (STI). The fund has many ways of tracking the index – simply buy the underlying 30 company shares which make up the STI with the corresponding weightings, or more realistically trade the STI futures. However, these strategies require some ongoing active management, either by frequently rebalancing the stock portfolio and reinvesting the dividends, or by rolling over the futures close to maturity.","ref":"Page 166 | Chapter 8"},{"n":129,"q":"A fund management company has one long only fund and one long-short fund. Both the funds are registered in the same country and have the same internal fund management processes. These two funds could differ the MOST in their ____.","o":["governance","structures","regulatory requirements","investment strategies"],"a":[3],"e":"refer to:\n\n(8.1.10) Risks of Structured Funds\n\nStructure funds cover a broad variety of investments. The characteristics and risk-return profile of a specific fund primarily depends on the underlying assets in the fund, such as equities, fixed income, commodities, real estate and other asset classes.\n\nRisk in a fund is also influenced by the investment style and strategies employed, such as long only, short, long-short, and other techniques that used by various traditional, hedge fund and alternative asset managers. Funds that use leverage and use derivatives as part of their investment strategy will have a higher risk profile. Currency risk would also be relevant for funds with foreign exchange positions and that hold assets which is outside the home market in their portfolio. Finally, a fund's operation and administration can contribute to its overall risk profile. This includes the fund's structure, legal domicile, governance, and fee structure and risk management policy.","ref":"Page 169 – 170 | Chapter 8"},{"n":130,"q":"If one compares ETFs with mutual funds, which of the following statements is TRUE?","o":["ETFs can only be bought at the end of the day NAV, whereas mutual funds allow intraday trading.","ETFs are more liquid as they offer primary and secondary liquidity.","Mutual funds are not subject to regulatory oversight.","Mutual funds are less volatile because the underlying assets are less volatile."],"a":[1],"e":"refer to:\n\n(8.2.7) ETFs vs Mutual Funds\n\nThe key differentiating factor between ETFs and the other popular fund formats, such as mutual funds and closed-end funds, is that ETFs offer investors two sources of liquidity:\n\nPrimary liquidity via the creation and redemption process; and\n\nSecondary liquidity through the trading of shares on exchange","ref":"Page 183 | Chapter 8"},{"n":131,"q":"Which among the following products is likely to have the MAXIMUM tracking error?","o":["An exchange-traded commodity product based on physical silver.","An exchange-traded note based on the synthetic replication of an equity index futures.","A synthetic replication ETF based on the Nikkei 225.","A synthetic replication ETF based on the S&P 500."],"a":[0],"e":"refer to:\n\nTracking errors\n\nTracking errors refer to the disparity in performance between an ETF and its underlying index.\n\nIn general, tracking error is:\n\nLower for synthetic replication ETFs than physical replication ETFs\n\nHigher for benchmarks with higher volatility such as emerging markets","ref":"Page 183 | Chapter8"},{"n":132,"q":"Which of the following factors DOES NOT directly impact the returns from a structured fund?","o":["Payout structure.","Underlying assets.","Domicile.","Time to maturity."],"a":[2],"e":"refer to:\n\nThe 4 main components that go into the building of a structured fund are the underlying asset, tenor / maturity, payout structure and market views. Once all the input parameters have been defined, structured fund can be established","ref":"Page 188 | Chapter 8"},{"n":133,"q":"Which of the following measures CANNOT directly reduce market disruption risk?","o":["circuit breakers","limits","shock absorbers","margins"],"a":[3],"e":"refer to:\n\n(9.2.3) Market Disruption Risk\n\nMarket disruption can be defined as the effects of a large and rapid change in the market price levels, causing the market to cease functioning in a regular manner. It is usually characterised by declines which cause widespread panic and results in disorderly market conditions. To mitigate this risk, regulators and securities exchanges could put in place the following measures:\n\nCircuit Breakers – Systems in cash and derivative markets that trigger trading halts;\n\nShock Absorbers – These are systems in the trading infrastructure that slow down trading when markets experience significant volatility but it does not halt trading completely; or\n\nLimits – Session or daily price limits can be imposed to limit price volatility without slowing or halting trading activity.","ref":"Page 193 | Chapter 9"},{"n":134,"q":"Concentration risk in an investment fund can be best represented by which of the following situations?","o":["Counterparties are unwilling to transact a particular futures contract because the futures price has moved by the maximum allowable daily limit.","Funds are allocated to only a few asset classes.","Futures contract positions are significantly mismatched to the underlying asset resulting in over-hedging.","Large volumes of redemption occur at the end of a calendar month."],"a":[1],"e":"refer to:\n\n(9.2.5) Concentration Risk\n\nConcentration risk is generally applicable to investors who unevenly allocate their funds to only a very limited number of financial instruments or asset classes. Due to a lack of diversification, if one asset underperforms, the performance of the whole portfolio would suffer more than anticipated.","ref":"Page 194 | Chapter 9"},{"n":135,"q":"Which of the following market factors should be used to assess the liquidity risk of investing in a stock market?","o":["Volatility.","Trading volumes and open interest.","Ratings by different agencies.","Exchange rates."],"a":[1],"e":"refer to:\n\nLiquidity Risk\n\nSome useful indicators to gauge the level of liquidity for a particular futures contract and for particular delivery months are:\n\nTrading volume; or\n\nOpen interest (the number of open contracts not yet closed off or not yet delivered)","ref":"Page 195 | Chapter9"},{"n":136,"q":"Which of the following can be considered as an indicator of an increase in the default risk in the financial markets?","o":["Narrowing butterfly spread.","Narrowing calendar spread.","Widening condor spread.","Widening TED spread."],"a":[3],"e":"(3.3.4) TED Spread\n\nThe TED spread is used as an indicator of credit risk because U.S. T-bills are considered risk free, while the rate associated with the Eurodollar futures reflects the credit ratings of corporate borrowers. When the TED spread increases, default risk is seen to be increasing and investors will prefer safer investments. As the spread shrinks, the default risk is seen to be decreasing.","ref":"Page 39 | Chapter 3"},{"n":137,"q":"Which of the following factors is UNLIKELY to influence the systemic risk faced by an investor?","o":["Degree of leverage.","Changes in GDP growth rate.","Political instability.","Interest rates."],"a":[0],"e":"refer to:\n\n(9.4.2) Market Risk\n\nMarket risk is essentially systemic risk which affects the entire market. The main sources of market risk are changes in macroeconomic factors such as interest rate, inflation rate, employment rate and recession, and microeconomic drivers such as corporate earnings, which can affect company share prices. Market risk is also affected by political factors, such as government instability and policy uncertainty.","ref":"Page 198 | Chapter 9"},{"n":138,"q":"A local company wishes to take a 6-month USD 50 million loan from an American bank in 5 months' time (i.e., in September). Currently, the 6-month USD lending rate is 1.65%. The September and December Eurodollar futures are 98.25 and 98.10 respectively. 5 months later, the 6-month USD lending rate rises to 2.15%. The September and December Eurodollar futures are 97.85 and 97.45 respectively. Assuming the company intends to fully hedge his interest rate exposure via September futures contract, calculate the number of contracts he needs to execute:","o":["25","50","100","150"],"a":[2],"e":"(3.4.7) Types of Hedges (Strips and Stacks)\n\nSolution:\n\n50 million loans start September and good for 6 months, to hedge using ED futures:\n\nStrips:\n\nShort 50 contracts of Sep ED and Short 50 contracts of Dec ED (matching the tenor of loan)\n\nStacks:\n\nShort 100 contracts of Sep ED (Stack onto a single contract)","ref":"Page 54 | Chapter 3"},{"n":139,"q":"If an investor invests most of his money in exchange-traded blue chip equities, the BIGGEST risk faced by him is the ____.","o":["Concentration risk","Correlation risk","Market risk","Liquidity risk"],"a":[0],"e":"(9.2.5) Concentration Risk\n\nConcentration risk is generally applicable to investors who unevenly allocate their funds to only a very limited number of financial instruments or asset classes. Due to a lack of diversification, if one asset underperforms, the performance of the whole portfolio would suffer more than anticipated.","ref":"Page 194 | Chapter 9"},{"n":140,"q":"A local company wishes to take a 6-month USD 50 million loan, and the prevailing 6-month USD lending rate is 2.15%. The September Eurodollar Futures contract is trading at 98.15. At the time of entering the hedge, the price of September Eurodollar futures is 98.65. Assuming the interest rate on the loan is correlated one-to-one with the Eurodollar, and company intends to fully hedge its interest rate exposure using September futures, calculate the number of contracts that will be needed to execute the hedge.","o":["25","50","100","150"],"a":[2],"e":"(3.4.7) Types of Hedges (Strips and Stacks)\n\nSolution:\n\n50 million loans start September and good for 6 months, to hedge using ED futures:\n\nStrips:\n\nShort 50 contracts of Sep ED and Short 50 contracts of Dec ED (matching the tenor of loan)\n\nStacks:\n\nShort 100 contracts of Sep ED (Stack onto a single contract)","ref":"Page 54 | Chapter 3"},{"n":141,"q":"In the case of a structured product with short put options on the securities index, what happens when there's a fall in the securities index?","o":["There is no loss to the structured product","The put option will be in the money and investors of the structured product have to payout to the option buyer","Both the principal and return component will be definitely affected","None of the above"],"a":[1],"e":"refer to:\n\nStructured Product with Shorting of Put Option on Securities Index (selling protection against the increase of a securities index)\n\nFor a structured product shorting a put option on a particular securities index, the option will be in-the- money when value of the index decreases. When a market event occurs, such as a recession or a major financial scandal, it is likely that the value of the index will fall. The put option will be in-the-money and the investors of the structured product, being the put option seller, will have to pay out to the option buyer, resulting in a reduction in their investment return.","ref":"Page 199 | Chapter 9"},{"n":142,"q":"Which of the following statements best describes credit risk?","o":["Risk relating to a credit product whereby the borrower is unable to fulfill its loan conditions due to a default situation","Risk relating to the credit rating of a structured product","Risk relating to a structured product that involves borrowing of funds for its investment","Risk relating to the issuer of a structured product when it is involved in other credit activities as well"],"a":[0],"e":"refer to:\n\n(9.4.3) Credit and Counterparty Risks\n\nA structured product is exposed to the credit risk of the issuer. This would include special purpose vehicles, which are separate legal entities usually created by banks to manage the issuance of the securities. If these separate entities are not guaranteed by the parent, investors will have no recourse if the issuer defaults.\n\nInvestors should check and know exactly the credit rating and standing (e.g. credit outlook, credit watch and guarantee status) of the issuer before investing in the product.","ref":"Page 201 | Chapter 9"},{"n":143,"q":"Which of the following products has the HIGHEST reinvestment risk for an investor?","o":["A plain vanilla bond with lower coupon payment frequency.","A Zero-coupon bond.","A put able bond.","A callable bond."],"a":[3],"e":"(9.4.8) Reinvestment Risks\n\nReinvestment risk refers to the risk that investors have to reinvest their bond proceeds – coupons and/or principal – at an interest rate below their yield-to-maturity (YTM). If interest rates fall, bond proceeds can only be reinvested at the prevailing lower interest rates. Hence, the bond return will be lower than the YTM.\n\nReinves
