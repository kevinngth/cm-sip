t only the positive aspects and downplay the risks to align with the firm's expectations."],"a":[1],"e":"(B) is correct because fully disclosing both the potential returns and the significant risks of the product ensures that Jack is upholding his ethical obligations for transparency and protecting his clients' interests. (A), (C), and (D) are incorrect as they compromise transparency and may mislead clients, violating ethical guidelines."},{"n":62,"q":"John, a senior portfolio manager at Elite Trading Solutions ('Elite'), is under pressure to meet quarterly performance targets. He considers recommending a series of high-risk derivatives trades that could potentially boost the portfolio's performance in the short term but are not aligned with his clients' long-term investment objectives and risk tolerance. After reflecting on the potential consequences of such actions, John decides against making these trades and instead focuses on strategies that align with his clients' best interests, even if it means potentially missing the quarterly targets.\n\nWhat ethical dilemma is John facing and how does he resolve it?","o":["Balancing personal growth and the benefit of the capital markets and financial system.","Putting clients' interests first and emphasizing integrity, competence, diligence, and respect.","Exercising care and independent professional judgement in making recommendations.","Building trust with clients and ensuring respect of market conduct rules."],"a":[1],"e":"(B) is correct because John is facing the ethical dilemma of balancing the pressure to meet performance targets with the need to act in his clients' best interests. He resolves this dilemma by emphasizing integrity, competence, diligence, and respect, ultimately deciding to put his clients' interests first. This decision reflects the ethical principle of prioritizing clients' needs over personal or organizational goals. (A), (C), and (D) are important aspects of ethical behavior but do not directly address John's specific dilemma and resolution."},{"n":63,"q":"Lily, a securities dealing representative at Ethical Edge Financial, is under pressure from her manager to push a new investment product that she believes is not in the best interest of several of her clients due to its risk profile. Lily values her job but is committed to ethical practices.\n\nIn facing this ethical dilemma, what should Lily consider to ensure she maintains her ethical obligations?","o":["Yield to her superiors' pressure to secure her position at the firm.","Refuse to recommend the product and report the undue pressure to the firm's compliance department.","Recommend the product only to clients who have the highest risk tolerance.","Seek advice from a mentor outside the firm on how to balance ethical obligations with career considerations."],"a":[1],"e":"(B) is correct because Lily should not recommend unsuitable products to her clients under pressure or for career considerations. She should report the matter to the compliance."},{"n":64,"q":"During a portfolio review, Thomas, a securities dealing representative at Visionary Investments, realizes that several of his clients could benefit from reallocating their investments to more conservative options given the current market volatility. However, these options offer lower commissions. Thomas is committed to prioritizing his clients' best interests over personal gain.\n\nWhat actions should Thomas take to align with the ethical guidelines on serving clients with honesty?","o":["Continue recommending higher commission products that align with the original investment strategy.","Reassess each client's situation and recommend the more conservative options if they align better with the clients' current needs.","Avoid discussing the conservative options to prevent clients from worrying about market volatility.","Only offer the conservative options to clients who express concerns about market conditions."],"a":[1],"e":"(B) is correct because reassessing each client's situation and recommending more conservative options, if they align better with the clients' current needs, demonstrates Thomas's commitment to serving his clients with honesty and integrity, prioritizing their best interests. (A), (C), and (D) are incorrect as they do not fully embrace the ethical responsibility to act in the best interest of the clients."},{"n":65,"q":"Emily, a securities dealing representative at FutureInvest, feels pressured by her team to recommend a particular investment product to all her clients, regardless of their individual risk profiles. The product has been highly profitable for the firm, and her colleagues argue that not offering it could be a disservice to clients. Emily is unsure, as she believes the product may not be suitable for all her clients.\n\nWhat should Emily consider when identifying this potential ethical dilemma?","o":["The profitability of the investment product for the firm and her colleagues.","The suitability of the investment product for each of her clients' risk profiles.","The ethical issues in going for career advancement by aligning with her team's approach.","The firm's policy on ensuring product recommendations are based on client suitability."],"a":[1,2,3],"e":"(B), (C), and (D) are correct because Emily should consider the suitability of the product for her clients, the potential conflict between career advancement and ethical conduct, and the firm's policies on client suitability. (A) is incorrect because the profitability of the product for the firm should not override the importance of suitability for clients.","multi":true},{"n":66,"q":"Lim, a securities dealing representative at TrustEdge Brokers, is tasked with introducing a new complex financial instrument to his clients. Aware of the product's complexity, Lim worries that not all his clients will fully grasp the associated risks. He contemplates the best approach to ensure his clients' understanding and compliance with ethical guidelines.\n\nWhat steps should Lim take to align with the ethical framework regarding understanding and comprehension?","o":["Simplify the explanation of the product to the point of omitting some less favorable details.","Provide comprehensive information, including all potential risks, ensuring clients fully understand the product.","Explain and recommend the product only to his most sophisticated clients who are likely to understand the complexity.","Organize an educational session for clients to explain the product's features and risks in detail."],"a":[1,2,3],"e":"(B), (C), and (D) are correct because providing comprehensive information, targeting the product recommendation to clients who are likely to understand its complexity, and organizing educational sessions to enhance clients' understanding are all in line with ensuring clients are well-informed. (A) is incorrect as omitting less favorable details can lead to misrepresentation and does not ensure clients' full understanding.","multi":true},{"n":67,"q":"Rachel, a securities dealing representative, is offered confidential information by a client that could significantly impact the market if it became public. Rachel is torn between using this information to benefit her clients and the legal implications of acting on insider information.\n\nConsidering the ethical dilemmas in securities dealing, what should Rachel consider in her decision-making process?","o":["The potential benefit to her clients if she acts on the information.","The legal consequences of using confidential, potentially market-impacting information.","Her ethical obligation to maintain market integrity and client confidentiality.","The possibility of unfairly gaining a competitive edge in the market."],"a":[1,2,3],"e":"(B), (C), and (D) are correct because Rachel should consider the legal consequences of using insider information, her ethical obligations to maintain market integrity and confidentiality, and the broader possibility of unfairly gaining a competitive edge in the market. (A) is incorrect because the potential benefit to her clients does not justify violating ethical standards and legal requirements.","multi":true},{"n":68,"q":"Alex, a derivatives trader at Zenith Financial Group ('Zenith'), faces a dilemma when he discovers a loophole in the trading system that could be exploited for significant financial gain. However, exploiting this loophole would compromise the integrity of the market and potentially harm other market participants. After careful consideration, Alex decides to report the loophole to the regulatory authorities and his firm's compliance department, despite the potential personal financial gain.\n\nWhat ethical principles is Alex demonstrating by choosing to report the loophole?","o":["Understanding & Comprehension; Execute Solutions.","Analyze Risks; Serve Clients.","Safeguarding Reputation; Serve Clients.","Understanding & Comprehension; Safeguarding Reputation."],"a":[2,3],"e":"(C) and (D) are correct because Alex is demonstrating the ethical principles of Safeguarding Reputation by taking action to protect the integrity of the market and his firm, and Understanding & Comprehension by recognizing the broader implications of exploiting the loophole. This decision reflects a commitment to ethical behavior beyond personal gain, aligning with the ethical framework's emphasis on serving clients' interests and maintaining the industry's reputation. (A) and (B) are important components of the ethical framework but do not directly address Alex's decision to report the loophole.","multi":true},{"n":69,"q":"Alex, an investment advisor at Elite Investments, is approached by a new client who wants to invest a significant amount in a high-risk fund. Alex knows the client has a low risk tolerance but is tempted by the potential high commission from the investment.\n\nWhat ethical principles should guide Alex's recommendations to the client?","o":["Ensuring that the charges, commissions, and expenses incurred are fair, transparent, and communicated to clients.","Observing best execution rules and priority of clients' orders above self-interests.","Ensuring proper understanding of clients' needs, financial goals, and risk appetite before making recommendations.","Providing factual information and explaining different scenarios when communicating to clients."],"a":[2,3],"e":"(C) and (D) are correct because Alex should understand the client's risk tolerance and financial goals and provide factual information about the investment, including potential risks. (A) and (B) are incorrect in this context because they do not directly address the ethical dilemma of recommending unsuitable investments for personal gain.","multi":true},{"n":70,"q":"Caroline, an investment banker at Global Capital Solutions ('Global'), is working on a deal that involves a company known to have environmental compliance issues. The client insists that these issues are not material and should not be disclosed in the deal documentation. Caroline is concerned that omitting this information could mislead investors and potentially harm Global's reputation.\n\nHow should Caroline proceed to ensure her actions are ethical?","o":["Omit the information as per the client's request to maintain a good relationship.","Disclose the environmental issues in the deal documentation despite the client's objections.","Consult with Global's legal and compliance departments for guidance on how to proceed.","Suggest to the client to delay the deal until the environmental issues are resolved."],"a":[2],"e":"(C) is correct because consulting with the legal and compliance departments ensures that Caroline's actions are in line with ethical standards and regulatory requirements. (A) is incorrect because omitting material information at the client's request could mislead investors. (B) is incorrect because unilateral disclosure without consulting compliance or legal departments could lead to legal issues. (D) is incorrect because while it addresses the environmental issues, it does not directly deal with the ethical dilemma of disclosure."},{"n":71,"q":"Lim, a senior analyst at Vertex Capital, is under pressure from his manager to recommend investments in companies that Vertex has undisclosed financial interests in. Lim is aware that these recommendations could mislead clients and potentially harm their investment portfolios.\n\nWhat ethical frameworks should guide Lim's response to this pressure?","o":["The necessity of protecting the capital markets and financial system from instability.","The importance of observing applicable laws and regulations and complying with gifts and entertainment policies of the employer.","The duty to exercise care and independent professional judgment when making investment recommendations.","The responsibility to maintain secrecy and confidentiality of client's information."],"a":[2],"e":"Option (C) is correct because Lim must exercise care and independent professional judgment when making investment recommendations. (A), (B) and (D) are not directly relevant in the given scenario because the recommendation of the product is unlikely to adversely impact the financial system, there is no gift involved in the scenario, and confidentiality of client information is not an issue in the given context."},{"n":72,"q":"Rachel, a compliance officer at Global Funds, uncovers a scheme within the firm where certain fund managers have been selectively disclosing positive fund performance to attract new clients, while omitting less favorable outcomes. Rachel recognizes this as a potential ethical dilemma involving misrepresentation.\n\nWhat steps should Rachel take to address this ethical dilemma?","o":["Report the findings to senior management and recommend an immediate review of communication policies.","Advise the fund managers involved to balance their performance disclosures with more transparency.","Document her findings and initiate a training session on ethical communication and disclosure practices.","Suggest that the fund managers involved compensate the affected clients to mitigate the consequences of their actions."],"a":[0,2],"e":"(A) and (C) are correct because Rachel should report her findings to senior management and initiate training on ethical practices. (B) is incorrect because advising fund managers without taking formal action may be inappropriate before completion of the investigation. (D) is incorrect because compensation does not address the root issue of misrepresentation.","multi":true},{"n":73,"q":"Michael, a securities dealing representative, is offered an expensive watch by a client as a thank you for his investment advice. Michael knows accepting the gift could be perceived as a conflict of interest.\n\nAccording to the professional ethics, codes, and standards of conduct, what actions should Michael take?","o":["Politely decline the gift explaining it could be perceived as a conflict of interest.","Accept the gift but report it to his firm's compliance department.","Ask the client to make the gift in the form of a charitable donation instead.","Consult his firm's policies on gifts and entertainment to determine the appropriate course of action."],"a":[0,3],"e":"(A) and (D) are correct because Michael should decline gifts that could create a conflict of interest and consult his firm's policies on gifts and entertainment to ensure his actions align with professional ethics and standards of conduct. (B) is a potential action but accepting the gift could still imply a conflict of interest. (C) is a positive suggestion but does not directly address the issue of potential conflict of interest.","multi":true},{"n":74,"q":"Simon, a derivatives analyst at Apex Financial Group ('Apex'), is faced with a challenging situation where he has access to material non-public information about an upcoming merger that could significantly impact the price of certain derivatives contracts. Simon is tempted to use this information for personal gain by trading on it before the merger is announced. However, after considering the ethical implications and the potential harm his actions could cause to market integrity and investor trust, Simon decides to abstain from trading on this information and reports his knowledge of the potential merger to the compliance department without disclosing it to anyone else.\n\nWhat ethical dilemma is Simon facing and how does he resolve it?","o":["The temptation to engage in insider trading for personal gain.","The challenge of maintaining confidentiality and trust in client relationships.","The need for continuous professional development and understanding of ethical roles.","The process of recognizing and resolving ethical dilemmas in the workplace."],"a":[0],"e":"(A) is correct because Simon is facing the ethical dilemma of being tempted to engage in insider trading using material non-public information for personal gain. He resolves this dilemma by choosing to abstain from trading on the information and reporting his knowledge to the compliance department, thereby upholding the ethical standards expected in the derivatives trading industry and protecting market integrity. (B), (C), and (D) are important aspects of ethical behavior but do not directly address Simon's specific dilemma of insider trading and his resolution to report the information."},{"n":75,"q":"Lara, a research analyst at Falcon Investments, is under pressure from her firm to produce a favorable analysis of a company that is a significant client of Falcon Investments. Lara is concerned that yielding to this pressure could compromise her independence and objectivity.\n\nAccording to the standards of professional conduct, which actions should Lara avoid to maintain her independence and objectivity?","o":["Yielding to pressure and producing a biased analysis favoring the significant client.","Consulting with Falcon Investments' compliance department about the pressure she's facing.","Disclosing the potential conflict of interest in her research report.","Seeking advice from a mentor outside her firm on how to handle the situation ethically."],"a":[0],"e":"(A) is correct because yielding to pressure and producing a biased analysis directly compromises Lara's independence and objectivity, violating professional conduct standards. (B), (C), and (D) are actions Lara should consider taking to address the situation ethically and maintain her professional integrity."},{"n":76,"q":"Frank, a senior analyst at Quantum Financial, is evaluating the ethical framework of a new client, TechForward, as part of Quantum's due diligence process. He discovers that TechForward has a history of aggressive tax avoidance strategies and has been criticized for its labor practices in overseas factories. Frank is aware that Quantum Financial prides itself on ethical investing.\n\nWhat actions should Frank recommend based on his findings?","o":["Continue the partnership with TechForward without any conditions.","Recommend a thorough review of TechForward's tax and labor practices.","Suggest Quantum Financial to conditionally proceed with the partnership, requiring TechForward to address these ethical concerns.","Advise Quantum Financial against partnering with TechForward due to ethical misalignments."],"a":[1,2,3],"e":"(A) is incorrect because it ignores Quantum's commitment to ethical investing. (B) is correct because it ensures due diligence and ethical alignment. (C) is correct because it allows for partnership while addressing ethical concerns. (D) is correct because it prioritizes Quantum's ethical standards.","multi":true},{"n":77,"q":"Nathan, working at Premier Capital, is responsible for advising clients on corporate finance transactions. One of his clients, EcoBuild, is considering a merger with another company that has a history of environmental violations. EcoBuild's management is unaware of these violations. Nathan believes that disclosing this information might jeopardize the merger but also recognizes the potential reputational risk to EcoBuild.\n\nHow should Nathan navigate this ethical dilemma?","o":["Withhold the information to facilitate the merger process.","Disclose the environmental violations to EcoBuild's management.","Recommend EcoBuild conduct its own due diligence on the potential partner.","Consult with Premier Capital's ethics committee on how to proceed."],"a":[1,2,3],"e":"(A) is incorrect because it involves withholding material information that could impact the client's decision. (B) is correct because it ensures transparency and protects the client's interests. (C) is correct because it encourages thorough due diligence by the client. (D) is correct because it seeks guidance within the firm's ethical framework.","multi":true},{"n":78,"q":"Grace, a compliance officer at Elite Advisory, is tasked with developing a training program for new hires on the importance of ethics in corporate finance. She plans to include real-world scenarios that highlight potential ethical dilemmas they might face.\n\nWhich topics should Grace include in her training program to cover a broad range of ethical considerations?","o":["The importance of transparency in client communications.","How to handle confidential information.","The impact of personal conflicts of interest on professional judgment.","Strategies for maximizing short-term profits regardless of ethical implications."],"a":[0,1,2],"e":"(A), (B), and (C) are correct because they address key ethical considerations in corporate finance. (D) is incorrect because it contradicts ethical principles by prioritizing profits over ethics.","multi":true},{"n":79,"q":"[cut off] of an investment product to close a sale with a hesitant client. He believes that the product is genuinely a good fit for the client but is concerned that without embellishment, the client may not proceed.\n\nAccording to the standards of professional conduct, which actions should Alex avoid to prevent misrepresentation?","o":["Exaggerating the potential returns of the investment product.","Providing the client with factual information and data supporting the product's potential.","Omitting certain risks associated with the investment product to make it more appealing.","Encouraging the client to rely solely on their own research on the product."],"a":[0,2,3],"e":"(A), (C), and (D) are correct because exaggerating potential returns, omitting risks, and encouraging the client to rely solely on their own research without professional guidance can lead to misrepresentation. (B) is incorrect as it is the appropriate action to provide factual information and data to support investment recommendations.","multi":true},{"n":80,"q":"Sophie, a portfolio manager at Ethical Edge Advisors, receives instructions from a client to engage in a trading strategy that, while legal, Sophie believes could harm the market's integrity or disadvantage other market participants. The client is insistent, citing the legality of the strategy as justification.\n\nHow should Sophie approach this situation to ensure her actions are both legal and ethical?","o":["Follow the client's instructions strictly based on their legality.","Explain her ethical concerns to the client and suggest alternative strategies.","Seek advice from the firm's legal and compliance departments on how to proceed.","Disregard her ethical concerns and prioritize the client's satisfaction."],"a":[1,2],"e":"(B) and (C) are correct because explaining ethical concerns to the client and seeking advice from legal and compliance departments are actions that ensure Sophie's decisions are both legal and ethical. These steps help maintain the integrity of the market and protect the interests of all participants. (A) and (D) are incorrect as they ignore the importance of ethical considerations in professional decision-making.","multi":true},{"n":81,"q":"Nathan, a financial analyst at Prosperity Investment Group, is reviewing a company's financials for a potential investment. He discovers accounting irregularities that could inflate the company's valuation. Nathan is under pressure from his superiors to overlook these irregularities to secure the investment, which would result in significant fees for Prosperity.\n\nWhat ethical dilemmas is Nathan facing, and what should be his course of action?","o":["Adjusting his analysis to conform to his superiors' expectations, compromising his professional integrity.","Reporting the irregularities to the appropriate regulatory authorities if internal reporting does not lead to corrective action.","Discussing his findings with his superiors and explaining the potential risks to the firm and its clients if these irregularities are ignored.","Recommending the investment despite the irregularities to secure the fees for Prosperity."],"a":[1,2],"e":"(B) and (C) are correct because Nathan should address his concerns with his superiors and report the irregularities if necessary to protect the integrity of the investment process. (A) and (D) are incorrect because they involve compromising ethical standards for personal or company gain.","multi":true},{"n":82,"q":"Sophia, a securities dealing representative at Dynamic Financial Solutions, is passionate about her career growth and ethical practice. She's exploring ways to enhance her understanding of ethical dilemmas and improve her decision-making skills in complex situations. Sophia is considering additional training and certification in ethics and compliance.\n\nHow should Sophia apply the ethical framework to enhance her professional development and ethical decision-making skills?","o":["Assume her current level of knowledge and ethical understanding is sufficient for her role.","Pursue additional training and certification focused on ethics and compliance in the financial industry.","Rely solely on her firm's mandatory ethics training without seeking further education.","Wait for a situation to arise before researching the ethical considerations involved."],"a":[1],"e":"(B) is correct because pursuing additional training and certification in ethics and compliance demonstrates Sophia's commitment to professional development and ethical practice, aligning with the ethical framework's emphasis on maintaining and improving professional competence. (A), (C), and (D) are incorrect as they do not proactively address the need for continuous learning and improvement in understanding and resolving ethical dilemmas."},{"n":83,"q":"Emma, a securities dealing representative at Future Wealth Management, is reviewing her client portfolios to ensure they align with each client's financial goals and risk tolerance. She notices a few clients are invested in products that may no longer suit their current financial situation. Emma considers the best approach to realign the investments with the clients' interests without causing unnecessary alarm or dissatisfaction.\n\nWhat actions should Emma take to uphold her duty to serve clients with integrity?","o":["Quietly realign the investments without informing the clients to avoid causing them stress.","Schedule consultations with each affected client to discuss their current financial situation and adjust their portfolios as needed.","Recommend new, higher-commission products that could also fit the clients' profiles to increase her earnings.","Maintain the current investments as changing them might imply she made a mistake in her initial recommendations."],"a":[1],"e":"(B) is correct because scheduling consultations to discuss and potentially adjust the clients' portfolios ensures that Emma is serving her clients with integrity and prioritizing their best interests. (A), (C), and (D) are incorrect as they either avoid transparency, prioritize personal gain, or fail to address potential misalignments with the clients' current financial situations."},{"n":84,"q":"Sophia, a fund manager at Ethical Investments, is approached by a company offering a substantial donation to her favorite charity in exchange for investing in their upcoming project. Sophia is tempted by the offer, as the donation could significantly benefit the charity, but she is also aware of the potential conflict of interest.\n\nWhat ethical standards are at risk of being violated if Sophia accepts the company's offer?","o":["The need to maintain and improve their professional competence.","The duty to act with reasonable care and exercise prudent judgment.","The importance of ensuring that investment actions comply with the clients' agreed-upon strategies and risk profiles.","The obligation to disclose any changes in investment strategy to clients and obtain their consent before implementation."],"a":[2,3],"e":"(C) and (D) are correct because Sophia must ensure that her investment decisions align with her clients' strategies and risk profiles and must disclose any potential conflicts of interest to her clients for their consent. (A) and (B) are incorrect in this context because they relate to professional development and the general duty of care, not directly to the ethical dilemma presented by the company's offer.","multi":true}];
const TITLE = "RES 1B Chapter 4";
const SIZE = 28;
const MODE = "instant";          // "instant" | "submit"
const SHUFFLE = false;
const L = ['a','b','c','d','e','f'];
const app = document.getElementById('app');
let state = null;

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  state=null;
  const sets=[];
  for(let i=0;i<DATA.length;i+=SIZE) sets.push([i,Math.min(i+SIZE,DATA.length)]);
  app.innerHTML = `<h1>${esc(TITLE)}</h1>
  <p class="sub">${DATA.length} questions &middot; ${sets.length} practice sets of up to ${SIZE}.</p>
  <div class="grid">
    <button class="setbtn rand" data-r="1"><b>Random ${Math.min(SIZE,DATA.length)}</b><span>Drawn from all ${DATA.length}</span></button>
    ${sets.map((s,i)=>`<button class="setbtn" data-i="${i}"><b>Set ${i+1}</b><span>Q${DATA[s[0]].n}&ndash;Q${DATA[s[1]-1].n} &middot; ${s[1]-s[0]} questions</span></button>`).join('')}
  </div>`;
  app.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{
    if(b.dataset.r){
      const idx=shuffled(DATA.map((_,i)=>i)).slice(0,SIZE);
      start(idx,'Random '+idx.length);
    } else {
      const s=sets[+b.dataset.i], idx=[];
      for(let k=s[0];k<s[1];k++) idx.push(k);
      start(SHUFFLE?shuffled(idx):idx,'Set '+(+b.dataset.i+1));
    }
  });
}

function start(idx,title){
  state={idx,title,picked:new Array(idx.length).fill(null),multi:{},locked:{},
         right:0,answered:0,graded:MODE!=='submit'};
  render();
}

function render(){
  const {idx,title}=state;
  app.innerHTML = `<div class="bar"><h2>${esc(title)}</h2>
    <span class="pill">Answered <b id="ans">0</b>/${idx.length}</span>
    ${MODE==='submit'?'':'<span class="pill">Score <b id="scr">0</b></span>'}
    <button class="lnk" id="back">&larr; All sets</button></div>
    <div id="qs"></div>
    ${MODE==='submit'?'<div class="foot"><button class="btn" id="grade" disabled>Submit answers</button></div>':''}
    <div id="end"></div>`;
  document.getElementById('back').onclick=home;
  const box=document.getElementById('qs');
  idx.forEach((qi,pos)=>{
    const q=DATA[qi];
    const el=document.createElement('div'); el.className='q'; el.id='q'+pos;
    el.innerHTML = `<div class="qn">Question ${pos+1} &middot; source Q${q.n}</div>
      <div class="qt">${esc(q.q)}</div>
      ${q.multi?`<div class="note" style="margin:0 0 8px">Select all that apply &mdash; ${q.a.length} of ${q.o.length} are correct.</div>`:''}
      ${q.o.map((t,i)=>`<div class="opt" data-i="${i}"><span class="k">${q.multi?'&#9744;':L[i]+'.'}</span><span>${esc(t)}</span></div>`).join('')}
      ${(!q.multi&&q.a.length>1)?`<div class="note">The source marks ${q.a.map(i=>L[i]).join(' and ')} as correct &mdash; either is accepted.</div>`:''}
      ${q.multi?`<div class="foot" style="justify-content:flex-start"><button class="btn sec" data-check="${pos}">Check answer</button></div>`:''}
      ${q.a.length===0?`<div class="note">No answer recorded for this question in the source.</div>`:''}
      ${(q.e||q.ref)?`<div class="expl" id="e${pos}" style="display:none">${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${esc(q.e||'')}</div>`:''}`;
    el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(el,pos,qi,+o.dataset.i));
    const cb=el.querySelector('[data-check]'); if(cb) cb.onclick=()=>gradeMulti(pos);
    box.appendChild(el);
  });
  if(MODE==='submit') document.getElementById('grade').onclick=gradeAll;
  window.scrollTo(0,0);
}

function pick(el,pos,qi,choice){
  const q=DATA[qi];
  if(q.multi){
    if(state.locked[pos]) return;
    const sel=state.multi[pos]=state.multi[pos]||new Set();
    sel.has(choice)?sel.delete(choice):sel.add(choice);
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',sel.has(+o.dataset.i)));
    return;
  }
  if(state.graded && state.picked[pos]!==null) return;
  const first=state.picked[pos]===null;
  state.picked[pos]=choice;
  if(first) state.answered++;
  document.getElementById('ans').textContent=state.answered;

  if(MODE==='submit'){
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.i===choice));
    const g=document.getElementById('grade');
    if(g) g.disabled = state.answered<state.idx.length;
    return;
  }
  if(q.a.includes(choice)) state.right++;
  el.classList.add('done');
  el.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    if(q.a.includes(i)) o.classList.add('correct');
    else if(i===choice) o.classList.add('wrong');
  });
  document.getElementById('scr').textContent=state.right;
  const ex=document.getElementById('e'+pos); if(ex) ex.style.display='block';
  if(state.answered===state.idx.length) finish();
}

function gradeMulti(pos){
  const qi=state.idx[pos], q=DATA[qi], el=document.getElementById('q'+pos);
  if(state.locked[pos]) return;
  const sel=state.multi[pos]||new Set();
  if(!sel.size) return;
  state.locked[pos]=true; state.answered++;
  // Select-all-that-apply is only right if the chosen set matches exactly;
  // crediting a partial selection would teach the wrong thing.
  const ok = sel.size===q.a.length && q.a.every(i=>sel.has(i));
  if(ok) state.right++;
  el.classList.add('done');
  el.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i; o.classList.remove('sel');
    if(q.a.includes(i)) o.classList.add('correct');
    else if(sel.has(i)) o.classList.add('wrong');
  });
  const b=el.querySelector('[data-check]'); if(b) b.remove();
  const ex=document.getElementById('e'+pos); if(ex) ex.style.display='block';
  const a=document.getElementById('ans'); if(a) a.textContent=state.answered;
  const s=document.getElementById('scr'); if(s) s.textContent=state.right;
  if(state.answered===state.idx.length) finish();
}

function gradeAll(){
  state.right=0;
  state.idx.forEach((qi,pos)=>{
    const q=DATA[qi], el=document.getElementById('q'+pos), choice=state.picked[pos];
    if(q.a.includes(choice)) state.right++;
    el.classList.add('done');
    el.querySelectorAll('.opt').forEach(o=>{
      const i=+o.dataset.i;
      o.classList.remove('sel');
      if(q.a.includes(i)) o.classList.add('correct');
      else if(i===choice) o.classList.add('wrong');
    });
    const ex=document.getElementById('e'+pos); if(ex) ex.style.display='block';
  });
  const g=document.getElementById('grade'); if(g) g.remove();
  finish();
}

function finish(){
  const n=state.idx.length, r=state.right, pct=Math.round(r/n*100);
  const wrong=state.idx.map((qi,pos)=>[qi,pos]).filter(([qi,pos])=>!DATA[qi].a.includes(state.picked[pos]));
  const end=document.getElementById('end');
  end.innerHTML=`<div class="res"><div class="score">${r} / ${n}</div>
    <div class="sub">${pct}% correct${wrong.length?` &middot; missed Q${wrong.map(([qi])=>DATA[qi].n).join(', Q')}`:''}</div>
    <div class="foot"><button class="btn" id="again">Retry this set</button>
    ${wrong.length?'<button class="btn sec" id="onlywrong">Retry missed only</button>':''}
    <button class="btn sec" id="home2">All sets</button></div></div>`;
  document.getElementById('again').onclick=()=>start(state.idx,state.title);
  const ow=document.getElementById('onlywrong');
  if(ow) ow.onclick=()=>start(wrong.map(([qi])=>qi), state.title+' (missed)');
  document.getElementById('home2').onclick=home;
  end.scrollIntoView({behavior:'smooth'});
}

home();
</script></body></html>
