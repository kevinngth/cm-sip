<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES 1B (Others)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#6b7280;--line:#e3e6ea;--acc:#2563eb;
--ok:#16a34a;--okbg:#eaf7ef;--no:#dc2626;--nobg:#fdeeee}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1c2024;--ink:#e8eaed;--mut:#9aa3ad;
--line:#2c3238;--okbg:#14301f;--nobg:#331717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.setbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.setbtn:hover{border-color:var(--acc)}
.setbtn b{display:block;font-size:15px}
.setbtn span{color:var(--mut);font-size:13px}
.rand{background:var(--acc);border-color:var(--acc);color:#fff}.rand span{color:#dbe6ff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
margin:0 -18px 20px;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-size:16px;margin:0;flex:1}
.pill{font-size:13px;color:var(--mut);white-space:nowrap}.pill b{color:var(--ink)}
button.lnk{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qn{color:var(--mut);font-size:13px;margin-bottom:6px}
.qt{font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
padding:9px 12px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:#9aa3ad}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt .k{font-weight:600;color:var(--mut);min-width:16px}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt.correct .k{color:var(--ok)}.opt.wrong .k{color:var(--no)}
.done .opt{cursor:default}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.expl{margin-top:12px;padding:12px 14px;border-left:3px solid var(--acc);background:rgba(37,99,235,.05);
border-radius:0 8px 8px 0;font-size:14px;line-height:1.6;white-space:pre-wrap}
.expl .ref{display:block;color:var(--mut);font-size:12px;margin-bottom:6px;font-weight:600}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
.res .score{font-size:34px;font-weight:700}
.foot{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA = [{"n":1,"q":"The assessment of a person as being Fit and Proper under the Honesty, Integrity and Reputation criteria includes considering whether he:","o":["Has accepted civil liability for fraud or misrepresentation under any law in any jurisdiction","Was a director of a company which has been convicted of a criminal offence in relation to a matter that took place within one year of his relinquishing office as a director.","Has been a substantial shareholder of a business which has been refused registration by a professional body outside Singapore.","Has been censured by the MAS."],"a":[0,2,3],"e":"Some of the key criteria for judging Honesty, Integrity and Reputation criteria include whether the person is or has been a director, partner, substantial shareholder or concerned in the management of a business that has been censured, disciplined, prosecuted or convicted of a criminal offence or been the subject of any disciplinary or criminal investigation or proceeding, in Singapore or elsewhere, in relation to any matter that took place WHILE the person was a director, partner, substantial shareholder or concerned in the management of the business. Therefore, option B is incorrect. The other options, (A), (C) and (D), correctly state criteria for judging Honesty, Integrity and Reputation of the person. Please refer to FSG-G01 (Guidelines on Fit and Proper Criteria).","multi":true},{"n":2,"q":"Which of the following transactions is/are examples of suspicious transactions under the AML/CFT laws?","o":["Settlement of securities transactions through large third party cheques endorsed in favour of the customer.","Routine requests made to a CMI by a customer for holding his securities in safe custody.","All cross-border transactions involving acquisition of property.","All of the above."],"a":[0],"e":"Settlement of securities transactions through large THIRD-party cheques endorsed in favour of the customer should evoke suspicion of ML/TF. Routine requests made to a Capital Market Intermediary by a customer for holding his securities in safe custody and ALL cross-border transactions involving acquisition of property are NOT suspicious transactions."},{"n":3,"q":"Sophie, a risk manager at Secure Capital ('Secure'), is tasked with enhancing the firm's anti-money laundering (AML) protocols. During her review, she identifies a pattern of transactions from a corporate client, GreenTech Solutions ('GreenTech'), that involves the frequent purchase and immediate resale of precious metals, with no apparent business need or strategic investment rationale. GreenTech's operations are focused on renewable energy solutions, and these transactions stand out as inconsistent with their core business activities.\n\nWhat red flags for potential money laundering activities are evident in GreenTech's transactions?","o":["Transactions which, without plausible reason, result in the intensive use of what was previously a relatively inactive account.","Transactions involving large amounts of cash.","Purchase or sale of large amounts of precious metals by a customer which is not in line with his business or background.","Transactions that are suspected to be in violation of another country's or jurisdiction's foreign exchange laws and regulations."],"a":[0,2],"e":"(A) and (C) are correct because the frequent and immediate resale of precious metals without a clear business need could indicate an attempt to launder money through transaction layering, and such transactions do not align with GreenTech's known business operations. (B) is incorrect because there's no mention of cash transactions. (D) is incorrect because there's no specific indication of violating foreign exchange laws.","multi":true},{"n":4,"q":"Maria owns a small boutique in a bustling city and has been a customer of GreenBank for over a decade, maintaining a modest account used primarily for business transactions. Recently, she inherited a significant sum from a distant relative and decided to deposit this windfall into her GreenBank account. Within days of the deposit, Maria withdrew half of the amount in cash, explaining she wanted to keep it \"safe at home.\"\n\nWhat aspects of Maria's actions could raise suspicions of money laundering?","o":["Withdrawing a large sum of cash shortly after depositing it","The sudden change in account activity from modest to significant transactions","The implausible explanation for withdrawing a large amount of cash","The account being used primarily for business transactions"],"a":[0,1,2],"e":"(A) and (C) are correct because withdrawing large sums of cash shortly after depositing and providing implausible explanations for doing so are potential red flags for money laundering, as they do not make economic sense and could indicate an attempt to move funds without a legitimate purpose. (B) should also raise suspicion of ML. (D) is incorrect because using an account for business transactions is normal, and not inherently suspicious.","multi":true},{"n":5,"q":"Global Trust Investments is implementing a new client screening process to identify potential AML/CFT risks. The process includes screening against sanctions lists and monitoring for changes in clients' risk profiles.\n\nWhat should Global Trust Investments ensure is part of their client screening process?","o":["Conduct screening at account opening, periodically, and when there are updates to sanctions lists or the client's information.","Focus screening efforts exclusively on high-net-worth individuals due to their higher risk profile.","Rely on clients to self-disclose any connections to sanctioned individuals or entities.","Assume that initial screening at account opening is sufficient for ongoing AML/CFT compliance."],"a":[0],"e":"(A) is correct because conducting screening at account opening, periodically, and when there are updates to sanctions lists or the client's information ensures comprehensive monitoring of AML/CFT risks."},{"n":6,"q":"Eric, a software engineer, has been receiving monthly payments from a tech startup for freelance work. The payments are made in large, round-number amounts, significantly higher than the market rate for such work. Eric immediately transfers a portion of these funds to a personal savings account in a country known for its secrecy laws.\n\nWhat aspects of Eric's actions could raise suspicions of money laundering?","o":["Receiving payments significantly higher than the market rate","Payments made in large, round-number amounts","Immediate transfer of funds to a personal savings account in a secrecy jurisdiction","The freelance work arrangement with the tech startup"],"a":[0,2],"e":"(A) Receiving payments significantly higher than the market rate and (C) the immediate transfer of funds to a personal savings account in a secrecy jurisdiction are red flags for money laundering, as they could indicate an attempt to move illicit funds under the guise of legitimate work. (B) While large, round-number payments might be unusual, they are not directly suspicious without the context of other red flags. (D) Freelance work arrangements are common in the tech industry and not inherently suspicious.","multi":true},{"n":7,"q":"Quantum Asset Management is considering promoting an internal candidate to a senior portfolio manager position. The candidate has shown exceptional performance but has not held a management role before.\n\nWhat factors should Quantum Asset Management consider in assessing the candidate's competence and capability for the new role?","o":["The candidate's past performance and expertise in investment analysis.","Whether the candidate's new responsibilities might conflict with their ability to perform the role effectively.","The candidate's educational qualifications and experience relevant to the senior portfolio manager position.","The candidate's willingness to undergo additional training to fill any gaps in management skills."],"a":[0,1,2,3],"e":"(A), (B), (C), and (D) are important factors to consider as they address the candidate's readiness for the management role, including potential conflicts of interest, relevant qualifications and experience, and willingness to improve competencies through additional training.","multi":true},{"n":8,"q":"Grace, a consultant, has an account with GlobalConsultancyBank, primarily used for her professional fees. Over the past year, Grace's account has seen a substantial increase in deposits, purportedly from consulting fees. However, these deposits are inconsistent with the scale of her consultancy work. Furthermore, Grace has made several large donations to a charity known for its international relief efforts but has been under scrutiny for potential misuse of funds. Grace insists her donations are genuine and aimed at supporting global causes.\n\nWhat aspects of Grace's actions could raise suspicions of money laundering?","o":["Substantial increase in deposits purportedly from consulting fees","Inconsistency between the scale of consultancy work and the deposits","Making several large donations to a charity under scrutiny","Insisting donations are genuine despite the charity's scrutiny"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because a substantial increase in deposits not consistent with the known scale of work, especially when followed by large donations to a charity under scrutiny, could indicate an attempt to launder money under the guise of legitimate income and philanthropy. (D) is incorrect because insisting donations are genuine, while potentially raising ethical questions, does not directly indicate money laundering without the context of other suspicious financial behaviors.","multi":true},{"n":9,"q":"Nathan, a freelance photographer, has maintained a checking account with CityBank for personal and occasional freelance business transactions. Recently, Nathan started depositing checks from various third parties, significantly higher than his usual income. When asked, Nathan explained these were payments for a big project he recently undertook. However, he failed to provide any contracts or documentation for such a project. Shortly after, he requested wire transfers to multiple overseas accounts, claiming these were payments to his subcontractors.\n\nWhat aspects of Nathan's actions could raise suspicions of money laundering?","o":["Depositing checks significantly higher than usual income","Failure to provide documentation for the alleged big project","Requesting wire transfers to multiple overseas accounts","Explaining the deposits as payments for a project"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because depositing checks significantly higher than usual income without providing documentation for the source, coupled with requesting wire transfers to multiple overseas accounts without clear justification, are red flags for money laundering. (D) is incorrect because explaining the deposits as payments for a project is a normal practice, but it becomes suspicious only when it cannot be substantiated with documentation.","multi":true},{"n":10,"q":"Derek, an antique dealer, has an account with HeritageBank, primarily used for his business transactions. Derek has recently started using his account to deposit large cash amounts, claiming these are proceeds from private sales of rare antiques. Shortly after these deposits, Derek requests immediate cash withdrawals or wire transfers to accounts in countries known for their privacy laws. When asked for documentation or details about these sales, Derek provides vague invoices that lack specific details about the buyers or the antiques sold.\n\nWhat aspects of Derek's actions could raise suspicions of money laundering?","o":["Depositing large cash amounts claimed as proceeds from private sales","Immediate cash withdrawals or wire transfers following deposits","Vague invoices lacking specific details about sales","Wire transfers to accounts in countries known for privacy laws"],"a":[0,1,2,3],"e":"(A), (B), and (C) are correct because depositing large cash amounts claimed as proceeds from private sales, followed by immediate cash withdrawals or wire transfers, especially with vague invoices that lack detail, are red flags for money laundering. The use of countries known for privacy laws (D) is also suspicious in the given context.","multi":true},{"n":11,"q":"Isabella, an entrepreneur, owns a series of small cafes across the city and has been a loyal customer of MetroBank for her business transactions. Over the past six months, Isabella's accounts have shown a pattern of receiving large, undocumented cash deposits late at night. These deposits are often followed by immediate transfers to a series of new accounts she opened at the same bank. Isabella claims these are proceeds from her cafes, but the amounts far exceed the expected revenue based on the size and number of her establishments.\n\nWhat aspects of Isabella's actions could raise suspicions of money laundering?","o":["Making large, undocumented cash deposits late at night","Immediate transfers to newly opened accounts","Claiming proceeds from cafes that exceed expected revenue","Opening a series of new accounts at the same bank"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because making large, undocumented cash deposits, especially during unusual hours, followed by immediate transfers to newly opened accounts, and claiming proceeds that significantly exceed expected revenue based on business size, are indicative of money laundering. (D) is incorrect because opening new accounts at the same bank is not inherently suspicious without the context of other red flags.","multi":true},{"n":12,"q":"Olivia, a renowned painter, frequently sells her artwork through her gallery, which has been in operation for several years. She has an account with ArtisticBank, where she deposits the proceeds from her sales. Recently, Olivia started receiving payments in large cash amounts directly at her gallery, which she then deposited into her account. When questioned by the bank, Olivia mentioned these were from private collectors who preferred anonymity. Additionally, Olivia requested the bank to transfer these funds to various international accounts, claiming these were investments in art supplies and collaborations with overseas artists.\n\nWhat aspects of Olivia's actions could raise suspicions of money laundering?","o":["Receiving payments in large cash amounts for artwork","Depositing large cash amounts from sales directly into the bank account","Requesting transfers to various international accounts for art investments","Claiming the need for anonymity on behalf of her buyers"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because receiving and depositing large cash amounts from artwork sales, especially when coupled with requests for international transfers under the guise of art investments, are potential red flags for money laundering. The preference for anonymity by buyers, while potentially legitimate in the art world, when combined with other suspicious activities, adds to the concern. (D) is incorrect because while claiming anonymity for buyers might raise questions, it is not uncommon in high-value art transactions and, by itself, is not a direct indicator of money laundering without the context of other suspicious activities.","multi":true},{"n":13,"q":"Julian, a real estate agent, has an account with CoastalBank, where he has been conducting his business transactions for years. Recently, Julian began receiving frequent, large wire transfers from a country known for its high risk of financial crimes. He explained these were payments for properties purchased by overseas investors. However, Julian quickly redirected these funds to purchase luxury items and for large cash withdrawals, without any evidence of properties being sold.\n\nWhat aspects of Julian's actions could raise suspicions of money laundering?","o":["Receiving frequent, large wire transfers from a high-risk country","Quick redirection of funds to purchase luxury items","Large cash withdrawals without corresponding business transactions","Claiming payments for properties without evidence of sales"],"a":[0,1,2,3],"e":"(A), (B), and (C) are correct because receiving frequent, large wire transfers from a high-risk country, quickly using those funds for personal luxury purchases or large cash withdrawals without corresponding business transactions, are red flags for money laundering. (D) is correct because claiming payments for properties becomes suspicious if there is no evidence of sales.","multi":true},{"n":14,"q":"Rachel, a concert promoter, has an account with EventBank, where she usually receives payments for concert tickets and pays her vendors. Recently, Rachel's account started showing a pattern of receiving large wire transfers labeled as \"sponsorship funds\" from companies with no clear connection to the music or entertainment industry. These funds are often quickly redirected to various accounts under different names, purportedly as payments for event services. However, the scale of these transactions and the lack of clear documentation for the services rendered raise questions.\n\nWhat aspects of Rachel's actions could raise suspicions of money laundering?","o":["Receiving large wire transfers labeled as \"sponsorship funds\"","Companies with no clear connection to the music or entertainment industry","Quick redirection of funds to various accounts under different names","Lack of clear documentation for services rendered"],"a":[0,1,2,3],"e":"(A), (B), and (C) are correct because receiving large wire transfers labeled as \"sponsorship funds\" from companies with no clear connection to the industry, and quickly redirecting those funds to various accounts, are significant red flags for money laundering. The lack of clear documentation (D) is also suspicious in the given context.","multi":true},{"n":15,"q":"Lena, a freelance software developer, has an account with CyberBank, where she usually receives payments for her projects. Suddenly, Lena starts receiving multiple small wire transfers from different accounts within a short period, which she immediately consolidates and then wires to a single overseas account, claiming it to be a payment for a software development tool from a foreign supplier. The frequency and pattern of these transactions do not match Lena's usual business activity, and she provides minimal documentation to justify the overseas transfer.\n\nWhat aspects of Lena's actions could raise suspicions of money laundering?","o":["Receiving multiple small wire transfers from different accounts","Immediate consolidation and wiring of funds to a single overseas account","The frequency and pattern of transactions do not match usual business activity","Minimal documentation to justify the overseas transfer"],"a":[0,1,2,3],"e":"(A), (B), and (C) are correct because receiving multiple small wire transfers from different accounts, immediately consolidating them, and then wiring them overseas, especially when the pattern does not match usual business activity, are indicative of structuring, a common money laundering technique. Minimal documentation for the overseas transfer (D) is also suspicious in the given context.","multi":true},{"n":16,"q":"Marco, a successful entrepreneur, has recently diversified his business interests into the import and export of luxury goods. He has an account with TradeBank, where he conducts most of his business transactions. Over the past few months, Marco's account has shown a pattern of receiving wire transfers from companies based in countries known for lax financial regulations. These funds are often quickly used to settle large invoices for luxury goods, which Marco claims are pre-sold to clients overseas. However, there is minimal documentation to support these transactions, and the goods do not seem to align with his known business operations.\n\nWhat aspects of Marco's actions could raise suspicions of money laundering?","o":["Receiving wire transfers from companies in countries with lax financial regulations","Quick settlement of large invoices for luxury goods","Minimal documentation to support the transactions","Goods not aligning with known business operations"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because receiving wire transfers from companies in jurisdictions with lax financial regulations, quickly using those funds to settle large invoices for luxury goods without adequate documentation, are significant red flags for money laundering. The goods not aligning with known business operations (D) is also suspicious, but the combination of A, B, and C directly addresses the patterns of behavior that are typically associated with money laundering activities.","multi":true},{"n":17,"q":"Jordan, a consultant, has been making frequent large deposits into his account, all just below the reporting threshold. He claims these are payments for consulting services from various international clients. However, Jordan's business does not have a website, nor does he have any online or public presence as a consultant.\n\nWhat aspects of Jordan's actions could raise suspicions of money laundering?","o":["Making frequent large deposits just below the reporting threshold","Claims of payments for consulting services from international clients","Lack of an online or public presence as a consultant","The inconsistency between Jordan's claimed business activities and his banking behavior"],"a":[0,1,2,3],"e":"(A), (B), and (C) are correct because structuring deposits to avoid reporting thresholds, claiming international payments for a business with no verifiable presence, and the lack of consistency between claimed activities and banking behavior are red flags for money laundering. The inconsistency (D) is also a concern.","multi":true},{"n":18,"q":"Ethan, a cryptocurrency trader, has an account with DigitalBank, where he conducts his trading activities. Ethan's account shows a pattern of receiving multiple small deposits that cumulatively amount to significant sums. These deposits are often followed by immediate purchases of cryptocurrencies, which are then transferred out of his account to various digital wallets. Ethan claims these activities are part of his trading strategy to take advantage of market fluctuations.\n\nWhat aspects of Ethan's actions could raise suspicions of money laundering?","o":["Receiving multiple small deposits that cumulatively amount to significant sums","Immediate purchases of cryptocurrencies following the deposits","Transferring purchased cryptocurrencies to various digital wallets","Claiming trading strategy as a reason for his pattern of transactions"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because the pattern of receiving multiple small deposits that cumulatively amount to significant sums, immediately using those funds to purchase cryptocurrencies, and then transferring them to various digital wallets, could indicate a layering phase of money laundering, known as \"smurfing.\" (D) is incorrect because the actions could be a part of a trading strategy.","multi":true},{"n":19,"q":"Linda, a compliance officer at Global Investments ('Global'), reviews transactions to ensure they align with regulatory standards. She notices a series of transactions by a client, Tech Innovations ('Tech'), which involve frequent large cash deposits followed by immediate transfers to various international accounts. Tech claims these transactions are payments for software development services from overseas contractors. However, Linda finds it unusual that Tech, a company specializing in hardware manufacturing, would engage in such extensive software development activities.\n\nWhat aspects of these transactions should raise suspicion for potential money laundering activities?","o":["Transactions that cannot be reconciled with the usual activities of the customer.","Transactions involving large amounts of cash.","Transactions involving transfers abroad.","Transactions that are suspected to be in violation of another country's or jurisdiction's foreign exchange laws and regulations."],"a":[0,1,2],"e":"(A), (B), and (C) are correct because they align with the indicators of suspicious transactions that could suggest money laundering, as Tech's transactions do not align with its usual business activities, involve large cash amounts, and include international transfers. (D) is incorrect because there's no specific indication that these transactions violate foreign exchange laws.","multi":true},{"n":20,"q":"Alex, a real estate broker, has recently been involved in transactions where his clients pay large sums in cash for properties significantly below market value. These transactions are quickly followed by sales at market value, with the profits being transferred to offshore accounts. Alex insists these are savvy investments.\n\nWhat aspects of Alex's actions could raise suspicions of money laundering?","o":["Clients paying in large sums of cash for undervalued properties","Quick resale of properties at market value","Profits being transferred to offshore accounts","Alex's insistence on these being savvy investments"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because transactions involving large cash payments, especially for undervalued properties followed by quick resale at market value and transferring profits offshore, are classic red flags for money laundering through real estate. Alex's insistence on these being savvy investments (D) does not directly indicate suspicious activity without the context of the other options.","multi":true},{"n":21,"q":"Samantha, a gallery owner, frequently purchases expensive art pieces from unknown artists using cash. She then ships these artworks to foreign buyers who pay significantly above the purchase price through bank transfers. Samantha claims these transactions are due to the rising popularity of the artists involved.\n\nWhat aspects of Samantha's actions could raise suspicions of money laundering?","o":["Purchasing art pieces from unknown artists with cash","Shipping artworks to foreign buyers for significantly higher prices","Claiming rising popularity of artists to justify transactions","Frequent involvement in high-value art transactions"],"a":[0,1,2],"e":"(A), (B), and (C) are correct because using cash to purchase art from unknown artists and selling them at significantly higher prices to foreign buyers, coupled with vague justifications, are indicative of money laundering through art trade. The frequency of high-value transactions (D) could be a concern but is not directly suspicious without the context of the other options.","multi":true},{"n":22,"q":"During the onboarding process of a high-net-worth individual at Elite Wealth Management, the compliance team identifies that the individual has substantial business dealings in high-risk jurisdictions. The team decides that enhanced due diligence (EDD) is necessary.\n\nWhat aspects should the compliance team focus on during the EDD process?","o":["The source of the individual's wealth and the nature of their business dealings in high-risk jurisdictions.","The individual's political connections or associations that may increase AML/CFT risks.","Any previous refusals of financial services by other institutions based on AML/CFT concerns.","The individual's understanding of the EDD process."],"a":[0,1,2],"e":"(A), (B), and (C) are crucial aspects to focus on during the EDD process as they help in understanding the potential AML/CFT risks associated with the individual's wealth, political connections, and past interactions with financial institutions.","multi":true},{"n":23,"q":"During the hiring process for a new financial advisor, the HR team at Trust Financial Group discovers that the candidate was previously disciplined by a financial regulatory authority in another country for minor non-compliance issues. The candidate has since completed all required corrective actions and has had no further incidents.\n\nWhat factors should the HR team consider in assessing the candidate's honesty, integrity, and reputation?","o":["The seriousness of the disciplinary action and the candidate's efforts to rectify the issue.","The candidate's declaration that they have learned from the incident and will not repeat it.","The relevance of the disciplinary action to the duties the candidate will perform at Trust Financial Group.","The passage of time since the disciplinary action took place."],"a":[0,2,3],"e":"(A), (C) and (D) are relevant factors to consider as may help judge the candidate's honestly, integrity and reputation.","multi":true},{"n":24,"q":"Elena, a retired teacher, recently opened an account with SafeHaven Bank. Shortly after, she started receiving monthly transfers from a company known for its charitable work. Elena uses these funds to purchase assets like stocks and bonds, and occasionally, she transfers significant portions of these funds to accounts overseas, claiming these are donations to support educational projects.\n\nWhat aspects of Elena's actions could raise suspicions of money laundering?","o":["Receiving regular transfers from a charitable organization","Using funds to purchase assets","Transferring significant amounts overseas under the guise of donations","The sudden change in financial behavior after account opening"],"a":[0,2,3],"e":"(A), (C), and (D) are correct because receiving regular transfers from a charitable organization, especially when followed by significant overseas transfers under the guise of donations, and a sudden change in financial behavior after account opening, could indicate money laundering or terrorist financing. (B) is incorrect because using funds to purchase assets is a common financial activity and not inherently suspicious without other red flags.","multi":true},{"n":25,"q":"Marcus, a portfolio manager at Elite Wealth Management ('Elite'), is approached by a new client, Helena, who wishes to invest a substantial sum of money. Helena insists on investing exclusively in physical gold and gold certificates, expressing a strong aversion to any form of equity or bond investments. She is vague about the source of her funds, mentioning only that it comes from \"family wealth\" and becomes defensive when asked for more details.\n\nBased on the investment preferences and behavior of the client, which type of transactions does Helena's request align with?","o":["Transactions involving large amounts of cash.","Buying and selling of security with no discernible purpose or in circumstances which appear unusual.","Request by a customer for investment management services where the source of funds is unclear.","Transactions that are suspected to be in violation of another country's or jurisdiction's foreign exchange laws and regulations."],"a":[1,2],"e":"(B) and (C) are correct because Helena's insistence on specific investments without clear rationale and her vague explanation about the source of funds align with behaviors that could indicate money laundering or other suspicious activities. (A) is incorrect because there's no mention of cash transactions. (D) is incorrect because there's no specific indication of violating foreign exchange laws.","multi":true},{"n":26,"q":"At Apex Financial Solutions, the compliance team is updating its client verification procedures to enhance AML/CFT compliance. They aim to ensure that all client information is accurately verified using reliable, independent sources.\n\nWhat steps should the compliance team take to ensure thorough verification of client information?","o":["Rely on information provided by the client without seeking independent verification.","Use reliable, independent source documents, data, or information for verification purposes.","Assume that information from social media profiles is sufficient for verification.","Conduct additional verification for clients with complex ownership structures or who are politically exposed persons (PEPs)."],"a":[1,3],"e":"(B) and (D) are correct because using reliable, independent source documents for verification and conducting additional verification for clients with complex ownership structures or who are PEPs are essential for thorough AML/CFT compliance.","multi":true},{"n":27,"q":"Mia, an antique book dealer, frequently travels to auctions around the world to purchase rare books. She pays for these books with large amounts of cash and ships them to buyers she claims are private collectors. Mia's account at GlobalHeritage Bank shows these cash withdrawals followed by deposits labeled as \"sales proceeds\" from various international locations.\n\nWhat aspects of Mia's actions could raise suspicions of money laundering?","o":["Frequent international travel for auctions","Paying for rare books with large amounts of cash","Shipping books to claimed private collectors","Account shows cash withdrawals followed by international deposits labeled as \"sales proceeds\""],"a":[1,3],"e":"(B) Paying for rare books with large amounts of cash and (D) the pattern of cash withdrawals followed by international deposits labeled as \"sales proceeds\" are red flags for money laundering, as they could indicate an attempt to legitimize cash through the sale of high-value items. (A) While frequent international travel might raise questions, it is not directly suspicious without the context of other red flags. (C) Shipping books to private collectors is a normal business practice for an antique book dealer and not inherently suspicious.","multi":true},{"n":28,"q":"Linda, a professional art restorer, has recently started accepting projects from overseas clients, requiring her to receive payments in various foreign currencies. Oddly, the amounts received often exceed the quoted fees for her services. Linda uses the excess funds to purchase cryptocurrency, which she then transfers to another digital wallet without clear ownership.\n\nWhat aspects of Linda's actions could raise suspicions of money laundering?","o":["Receiving payments in foreign currencies","Payments exceeding the quoted fees for services","Purchase of cryptocurrency with excess funds","Transferring cryptocurrency to a digital wallet without clear ownership"],"a":[1,2,3],"e":"(B) Payments exceeding the quoted fees for services, (C) the purchase of cryptocurrency with excess funds, and (D) transferring cryptocurrency to a digital wallet without clear ownership are red flags for money laundering. These actions could indicate an attempt to launder money through overpayments and the anonymous nature of cryptocurrency transactions. (A) Receiving payments in foreign currencies is not unusual for someone working with overseas clients and does not directly indicate suspicious activity.","multi":true},{"n":29,"q":"Sophie, an art dealer, frequently travels to various countries to acquire unique pieces for her gallery. She has an account with GlobalBank, where she deposits large amounts of cash upon returning from her trips. Sophie insists these deposits are proceeds from art sales abroad, yet she seldom provides documentation for these transactions. Additionally, the amounts deposited are inconsistent with her gallery's sales records.\n\nWhat aspects of Sophie's actions could raise suspicions of money laundering?","o":["Frequent travel to various countries","Depositing large amounts of cash without sufficient documentation","Inconsistency between deposited amounts and business sales records","Insistence that deposits are proceeds from art sales abroad"],"a":[1,2,3],"e":"(B), (C), and (D) are correct because depositing large amounts of cash without sufficient documentation, inconsistencies between deposited amounts and business records, and insistence on the source of funds without plausible evidence are red flags for money laundering. (A) is incorrect because frequent travel, by itself, is not a direct indicator of money laundering without the context of suspicious financial behavior.","multi":true},{"n":30,"q":"Tina, a jewelry designer, has an account with PreciousBank, primarily used for her business transactions. Recently, Tina began receiving frequent deposits labeled as \"investment returns\" from a company she claims to have invested in. These deposits are significantly higher than the usual business revenue Tina's account has seen. Shortly after these deposits, Tina requests wire transfers to various international accounts, stating these are payments for raw materials. However, the amounts transferred are disproportionate to her usual procurement costs.\n\nWhat aspects of Tina's actions could raise suspicions of money laundering?","o":["Frequent deposits labeled as \"investment returns\"","Deposits significantly higher than usual business revenue","Requests for wire transfers to various international accounts","Amounts transferred disproportionate to usual procurement costs"],"a":[1,2,3],"e":"(B), (C), and (D) are correct because deposits that are significantly higher than usual business revenue, coupled with requests for wire transfers to various international accounts in amounts disproportionate to known costs, are indicative of money laundering. The discrepancy between the nature of the deposits and the scale of the wire transfers suggests an attempt to legitimize illicit funds. By itself, frequent deposits labeled as \"investment returns\" is not a red flag.","multi":true},{"n":31,"q":"In relation to an exempt person, the term 'Key Officer' DOES NOT include ____.","o":["a director","the Chief Executive Officer","the finance manager","None of the above."],"a":[2],"e":"A key officer, in relation to an exempt person, means a director or an equivalent person, or a chief executive officer or an equivalent person."},{"n":32,"q":"In relation to a bank incorporated in Singapore and licensed by MAS under the Banking Act, the term Relevant Person includes which of the following persons of the bank?","o":["A substantial shareholder.","A Chief Executive Officer.","A Deputy Chief Executive Officer.","A marketing manager."],"a":[0,1,2],"e":"A marketing manager is NOT a relevant person in the given context. A substantial shareholder, or a CEO or a Deputy CEO is a relevant person.","multi":true},{"n":33,"q":"Which of the following is included in the definition of Excluded Investment Products?","o":["A contract where one party agrees to exchange currency at an agreed rate of exchange with another party, where such currency exchange is effected at a specified future date.","A debenture that is a structured note.","A stapled product containing shares of a corporation and units of a business trust, where the shares or the units cannot be transferred or dealt without the other.","All of the above."],"a":[2],"e":"A stapled product containing shares of a corporation and units of a business trust, where the shares or the units cannot be transferred or dealt without the other, OR any debenture OTHER THAN a structured note, OR any contract or arrangement the effect of which is that one party agrees to exchange currency at an agreed rate of exchange with another party, where such currency exchange is effected IMMEDIATELY is an Excluded investment product."},{"n":34,"q":"In the case of a bank incorporated outside Singapore, which of the following persons is/are included in the definition of a Relevant Person?","o":["The Chief Executive Officer.","The Deputy Chief Executive Officer.","The Head of Treasury.","A substantial shareholder."],"a":[0,1,2],"e":"A substantial shareholder is NOT a relevant person in the given context. The CEO or the deputy CEO or the head of treasury is a relevant person.","multi":true},{"n":35,"q":"Which of the following can be considered examples of suspicious transactions/activities under AML/CFT laws?","o":["A defaulter customer suddenly makes a large payment.","An unlisted company makes a large advance payment to a new party for goods it has never purchased before.","Frequent algorithmic trading by a customer.","Making windfall gains in a particular stock."],"a":[0,1],"e":"Algo trading or abnormal profits is ordinarily NOT suspicious from the perspective of AML/TF. A defaulter customer suddenly making a large payment and an unlisted company making a large advance payment to a new party for goods it has never purchased before are examples of suspicious activities in the context of ML/TF.","multi":true},{"n":36,"q":"Secure Capital Partners is assessing the financial soundness of a potential institutional partner that has recently undergone a significant restructuring. The restructuring was due to financial difficulties, but the institution now presents a stable financial outlook.\n\nWhat should Secure Capital Partners consider in assessing the financial soundness of the potential partner?","o":["Whether the institution has been unable to fulfill any of its financial obligations in the past.","If the institution has entered into any compromise or scheme of arrangement with its creditors.","The institution's current financial stability and measures taken to prevent future financial difficulties.","The passage of time since the institution's financial restructuring and evidence of sustained financial health."],"a":[0,1,2,3],"e":"All the given aspects must be considered.","multi":true},{"n":37,"q":"Alex, a financial advisor at Trust Financial Services ('Trust'), is reviewing the portfolio of a long-standing client, Derek, who has expressed interest in diversifying his investments. Derek, traditionally invested in blue-chip stocks, now wants to include units in a business trust and derivatives of those units. He believes this will spread his risk and potentially increase his returns. Alex knows that certain investment products are excluded from the definition of \"Excluded Investment Products\" and needs to advise Derek accordingly.\n\nWhich of Derek's desired investment additions are considered \"Excluded Investment Products\"?","o":["Units in a business trust.","Derivatives of units in a business trust.","Stocks or shares issued by a corporation, other than a CIS.","Units in a listed collective investment scheme that is a trust and primarily invests in real estate."],"a":[0,1,2,3],"e":"All the given options are correct.","multi":true},{"n":38,"q":"Which of the following persons is/are included in the definition of a Relevant Person for a Merchant Bank approved under the MAS Act?","o":["The CEO.","The Deputy CEO.","The Head of Treasury.","All of the above."],"a":[3],"e":"All the given persons are relevant persons in the given context."},{"n":39,"q":"Which of the following persons is NOT a Relevant Person in the case of a person whose activity is regulated by MAS under the FAA?","o":["An exempt financial institution.","A representative of an exempt financial institution.","An exempt person.","None of the above"],"a":[3],"e":"All the given persons are relevant persons in the given context."},{"n":40,"q":"For assessing whether a person is Fit and Proper, the Honesty, Integrity and Reputation criteria include whether the person:","o":["Has been refused the right to carry on any trade for which a specific licence is required by the law in any jurisdiction.","Has been issued a warning by MAS.","Has been reprimanded by an operator of a clearing facility outside Singapore.","Is subject to any pending proceedings which may lead to his conviction under any law outside Singapore."],"a":[0,1,2,3],"e":"All the options state criteria for judging Honesty, Integrity and Reputation of the person.","multi":true},{"n":41,"q":"A contract which involves exchange of currency at an agreed rate between two parties is an Excluded Investment Product if ____.","o":["The currency exchange is effected immediately.","The currency exchange is effected at a future date.","The actual currency exchange never takes place.","None of the above."],"a":[0],"e":"Any contract or arrangement the effect of which is that one party agrees to exchange currency at an agreed rate of exchange with another party, where such currency exchange is effected immediately is an excluded investment product."},{"n":42,"q":"Excluded investment products mean:","o":["Stocks proposed to be issued by a body unincorporate, other than a collective investment scheme.","Shares issued by a corporation, other than a collective investment scheme.","Any unit of a share which does not represent ownership in the underlying share.","Any derivative of units in a business trust."],"a":[0,1,3],"e":"Any unit of a share which REPRESENTS ownership of the underlying share (subject to other conditions) is an excluded investment product. Stocks proposed to be issued by a body unincorporate, other than a CIS, shares issued by a corporation, other than a CIS, and any derivative of units in a business trust are excluded investment products.","multi":true},{"n":43,"q":"A unit of a share which represents ownership of the underlying share is considered an Excluded Investment Product (EIP) if ____.","o":["The underlying is held on trust for the unit holder by a custodian.","No administrative fee is payable by the unit-holder if he converts the unit of share into the underlying share.","The underlying is the stock of a company which has consistently reported net profits over the last 5 years.","All of the above."],"a":[0],"e":"Any unit of a share which represents ownership of the underlying share, is an excluded investment product if the underlying share is held on trust for the unit-holder by a custodian, and no additional consideration (OTHER THAN administrative fees) is payable."},{"n":44,"q":"Liam, a software developer, has been a client of TechBank for several years, maintaining a relatively inactive account with minimal transactions, reflecting his modest lifestyle. Suddenly, his account starts receiving large sums from overseas, significantly exceeding his known income. Liam quickly moves these funds through various newly opened accounts within TechBank before withdrawing them in cash.\n\nWhat aspects of Liam's actions could raise suspicions of money laundering?","o":["The sudden and significant increase in account activity","Opening multiple new accounts for moving large sums","Quick withdrawal of large sums in cash after deposit","Transactions significantly exceeding Liam's known income"],"a":[0,1,2,3],"e":"Based on the details in the question, all the given options are correct.","multi":true},{"n":45,"q":"Differences between the legal system in Singapore and that of the country where an overseas-listed investment product is listed may result in additional risks related to ____.","o":["Restrictions on repatriation of dividends.","Liquidity and prices of the overseas-listed investment product.","Uncertainty in being able to predict the outcome of judicial proceedings.","All of the above."],"a":[3],"e":"Differences between the legal system in Singapore and that of the country where an overseas-listed investment product is listed may result in additional risks related to the factors given in all the options."},{"n":46,"q":"Differences between the regulatory regime in Singapore and that of the country where an overseas-listed investment product is listed may include those related to ____.","o":["Disclosure requirements.","Investor protection.","Safekeeping of securities held by depositories.","All of the above."],"a":[3],"e":"Differences between the legal system in Singapore and that of the country where an overseas-listed investment product is listed may result in additional risks related to the factors given in all the options."},{"n":47,"q":"Which of the following transactions may be considered suspicious by a CMS licence holder?","o":["A client with annual income of $1 million places a buy order for stocks for $50,000.","Frequent deposit and withdrawal from an account without any logical basis.","A customer continues to buy a stock in small quantities though the stock keeps falling in the stock market.","A customer keeps a substantial portion of his savings in the form of gold ETFs."],"a":[1],"e":"Frequent deposits and withdrawals from an account without any logical basis should evoke suspicion of ML/TF. Buying stocks worth $50K is not a suspicious activity, especially for a client with an annual income of $1 million. Buying a falling stock or investing majorly in gold is not a suspicious activity. Both these could be trading and investment strategies."},{"n":48,"q":"In which of the following cases will an applicant for a CMS licence be considered to have failed the fit and proper test?","o":["He has been refused a fidelity bond in Singapore.","He has been refused a surety bond outside Singapore.","He has shown an unwillingness to comply with a professional standard outside Singapore.","He has abetted another person in breach of the SFR."],"a":[0,1,2,3],"e":"In all the given cases, the applicant will fail the fit and proper test of honesty and integrity.","multi":true},{"n":49,"q":"In which of the following cases will an applicant for a CMS licence be considered to fail the fit and proper test?","o":["If he has been uncooperative in his dealings with a regulatory authority outside Singapore.","If he has deliberately provided wrong information about his personal details.","If he has refused to uphold an ethical standard outside Singapore.","All of the above."],"a":[3],"e":"In all the given cases, the applicant will fail the fit and proper test of honesty and integrity."},{"n":50,"q":"For a relevant person whose activity is regulated by MAS, the term Institution includes which of the following entities?","o":["A licensed trade repository.","A licensed foreign trade repository.","A registered insurance broker.","All of the above."],"a":[3],"e":"Institution, in relation to a relevant person whose activity is regulated by MAS under the FAA, the IA or the SFA, means a licensed trade repository, a licensed foreign trade repository, and a registered insurance broker."},{"n":51,"q":"In the context of a relevant person whose activity is regulated by MAS, the term Institution includes which of the following entities?","o":["An approved MAT insurance broker.","An approved general reinsurance broker","An approved life reinsurance broker.","All of the above."],"a":[3],"e":"Institution, in relation to a relevant person whose activity is regulated by MAS under the FAA, the IA or the SFA, means an approved MAT insurance broker, an approved general reinsurance broker, and an approved life reinsurance broker."},{"n":52,"q":"A customer whose trading account has been highly active for the past 4 years suddenly becomes significantly less active for 1 month. Should this change be viewed with suspicion by the Capital Markets Intermediary (CMI) in the context of AML/CFT laws?","o":["Yes, it should raise suspicion.","No, one month period of inactivity is too small to draw a conclusion.","It depends on the personal opinion of the relevant account manager of the CMI.","CMIs should not be concerned with changes in the levels of activity of their clients."],"a":[1],"e":"One month of inactivity is too less to evoke suspicion. For example, the client could have gone on a vacation."},{"n":53,"q":"When conducting the Customer Account Review (CAR) and Customer Knowledge Assessment (CKA), which of the following sources can be used as evidence to decide whether a retail customer has sufficient knowledge?","o":["He has transacted in SIPs which are listed or quoted on a securities or futures exchange at least 6 times in the last 3 years.","He has transacted in unlisted collective investment schemes at least 3 times in the last 6 years.","He has a minimum 3 consecutive years of relevant working experience in the past 10 years.","He has demonstrated his knowledge of the features and risks of SIPs through a learning module provided by the Member."],"a":[0,2],"e":"Options 1 and 3 are correct. In addition, when conducting the CAR or CKA, a retail customer would be deemed to have sufficient knowledge if he, for CKA, has invested or transacted in unlisted collective investment schemes or ILPs at least 6 times in the preceding 3 years. Where a customer is assessed to not possess knowledge or experience in derivatives, but subsequently demonstrates sufficient understanding of the features and risks of derivatives through a learning module provided by an independent body, the customer may be deemed to possess the knowledge to transact in specified investment products which are listed or quoted on a securities market or a futures market.","multi":true},{"n":54,"q":"Which of the following can be considered an Overseas-Listed Investment Product?","o":["A capital market product that is listed for quotation only on an overseas securities exchange.","A capital market product that is quoted only on an overseas futures exchange.","A capital market product that is listed in Singapore and in an overseas securities exchange.","A capital market product that is listed in Singapore and in an overseas futures exchange."],"a":[0,1],"e":"Overseas-Listed Investment Product means any capital markets products that is approved in-principle for listing and quotation ONLY on, or listed for quotation or quoted ONLY on, one or more overseas exchange(s).","multi":true},{"n":55,"q":"A customer purchased unusually large number of lots of futures contracts on gold. Should this be considered as a suspicious activity under the AML/CFT laws?","o":["Yes.","Yes, if the customer refuses to declare the source of funds for the purchase.","Yes, but only if the customer ultimately makes a profit on the trade.","Yes, but only if the customer ultimately suffers a loss on the trade."],"a":[1],"e":"Purchase of an unusually large number of lots of futures contracts on gold by a customer of the Capital Market Intermediary may not normally be considered as a suspicious transaction under the AML/CFT laws. This is because gold futures contracts are traded on an exchange. However, if the customer is unable or reluctant to declare the source of the funds for the purchase, the transaction may be treated as suspicious. ML/TF risks are NOT related to the outcome (profit or loss) of the trade."},{"n":56,"q":"Which of the following is/are NOT included in the definition of Excluded Investment Products?","o":["Shares proposed to be issued by a body unincorporated which is a collective investment scheme.","Units of a share which represent ownership of the underlying share, and half of the issue price of the share needs to be paid by the unit holder for conversion.","A right proposed to be issued by a body unincorporate in respect of its own stocks.","A unit in a business trust."],"a":[0,1],"e":"Shares proposed to be issued by a body unincorporated which is NOT a collective investment scheme and units of a share which represent ownership of the underlying share, and NO CONSIDERATION needs to be paid by the unit holder for conversion are excluded investment products. Also, a right proposed to be issued by a body unincorporate in respect of its own stocks and a unit in a business trust are excluded investment products.","multi":true},{"n":57,"q":"A unit in a collective investment scheme (CIS) is considered an Excluded Investment Product, inter-alia, if ____.","o":["The CIS is a trust.","The scheme does not invest in real estate.","The units of the scheme are not listed for quotation on a securities exchange.","All of the above."],"a":[0],"e":"The definition of excluded investment products includes any unit in a CIS, such CIS being an arrangement that is a trust, which INVESTS primarily in real estate and real estate-related assets specified by the Authority in the Code on CISs, and all or any units of which ARE listed for quotation on a securities exchange."},{"n":58,"q":"Which of the following is NOT an Excluded Investment Product?","o":["A unit in a collective investment scheme (CIS) if the manager is restricted by the scheme documents not to engage in securities lending.","A unit in a collective investment scheme (CIS) if the manager is allowed to invest in any instrument without any restrictions.","A debenture which is a structured note.","A debenture which is an asset-backed security."],"a":[1,2,3],"e":"The definition of excluded investment products includes any unit in a CIS, where the manager MUST invest only in selected products and NOT engage in securities lending or repurchase transactions for the scheme. Debentures, OTHER THAN structured notes or ABS are excluded investment products.","multi":true},{"n":59,"q":"The factors to consider before investing in an overseas-listed investment product include:","o":["Counterparty risk.","Correspondent broker risk.","Correspondent bank risk.","Social factors influencing the overseas markets."],"a":[0,1,2,3],"e":"The factors to consider before investing in an overseas-listed investment product include counterparty risk, correspondent bank risk, correspondent broker risk and social factors influencing the market.","multi":true},{"n":60,"q":"The Financial Soundness criteria for determining whether a person is Fit and Proper include:","o":["Whether he has been unable to fulfil any of its financial obligations outside Singapore.","Whether he has entered into a compromise with his creditors.","Whether he has been subject to a bankruptcy petition outside Singapore.","Has been subject to a fully satisfied judgement debt outside Singapore."],"a":[0,1,2],"e":"The Financial Soundness criteria for determining whether a person is Fit and Proper include checking whether the person is subject to a judgement debt which is UNSATISFIED, either in whole or in part, in Singapore or elsewhere. The other options state financial soundness criteria.","multi":true},{"n":61,"q":"In relation to a bank incorporated in Singapore and licensed by MAS under the Banking Act, a 'relevant person' DOES NOT include:","o":["The Head of Treasury.","A purchase Manager.","An operations manager.","The front office staff."],"a":[1,2,3],"e":"The head of treasury is a relevant person. A purchase manager, operations manager or the front office staff is not a relevant person in the given context.","multi":true},{"n":62,"q":"An Excluded Investment Products-Collective Investment Scheme (EIP-CIS) holds units in another EIP-CIS (underlying EIP-CIS), and the units of the underlying EIP-CIS cease to be classified as EIP. Which of the following options does the responsible person of the EIP-CIS have?","o":["Sell the units in the underlying EIP-CIS within 3 months, and remain classified as an EIP-CIS.","Sell the units in the underlying EIP-CIS within 12 months if the relevant person of the EIP-CIS can convince its trustee that disposal within a shorter time is against the interests of the unit holders, and continue to retain the classification as an EIP-CIS.","Do nothing if the holdings in the underlying EIP-CIS are less than 5% of the total assets under management of the EIP-CIS, and still retain the classification as an EIP-CIS.","Change the investment objective of the EIP-CIS within 4 months and be designated as a Specified Investment Product-CIS, and continue to retain the units of the underlying EIP-CIS."],"a":[0,1,3],"e":"The responsible person CANNOT do nothing. He can take the actions mentioned in the other three options.","multi":true},{"n":63,"q":"To satisfy the MAS that it meets the fit and proper criteria, a relevant person that is an exempt entity must, inter-alia, demonstrate that all of its substantial shareholders control, directly or indirectly, not less than ____ of the voting power in the entity.","o":["0.05","0.1","0.2","0.51"],"a":[2],"e":"To satisfy the MAS that it meets the fit and proper criteria, a relevant person that is an exempt entity must, inter-alia, demonstrate that all of its substantial shareholders control, directly or indirectly, not less than 20% of the voting power in the entity."},{"n":64,"q":"Examples of suspicious transactions by a client under the AML/CFT laws include:","o":["Use of numbered accounts for investment transactions between unidentified parties.","Transfer of assets to a known beneficiary.","Use of pseudonyms for trading transactions between unidentified parties.","Providing a large collateral guarantee by the customer to a third party without any apparent business reason."],"a":[0,2,3],"e":"Transfer of assets to a known beneficiary should NOT evoke ML/TF suspicion. The scenarios in the other options should evoke ML/TF suspicion.","multi":true},{"n":65,"q":"While determining his suitability for investing in overseas-listed investment products, an investor should consider his:","o":["Risk appetite.","Financial resources.","Experience.","Objectives."],"a":[0,1,2,3],"e":"While determining his suitability for investing in overseas-listed investment products, an investor should consider all the given factors.","multi":true},{"n":66,"q":"Transactions involving large amounts of cash which may be considered suspicious include:","o":["Provision of large margin collaterals in cash.","Payments containing counterfeit notes.","Deposits containing forged documents.","Withdrawing large amounts of cash, being profit of investments, and depositing the cash in spouse's bank account."],"a":[0,1,2],"e":"Withdrawing large amounts of cash, being profits of investments, and depositing the cash in spouse's bank account is NOT a suspicious activity, but a routine transaction. The other options describe suspicious activities.","multi":true},{"n":67,"q":"A person may be considered as having sufficient knowledge for trading in Specified Investment Products (SIPs) if he has minimum ____.","o":["3 consecutive years of working experience in the past 6 years in treasury activities.","4 consecutive years of working experience in the past 7 years in accountancy.","3 consecutive years of working experience in the past 6 years in development of investment products.","3 consecutive years of working experience in the past 10 years in provision of training in investment products."],"a":[3],"e":"A person may be considered as having sufficient knowledge for trading in Specified Investment Products (SIPs) if he has minimum 3 consecutive years of working experience in the past 10 years in provision of training in investment products."},{"n":68,"q":"While conducting a Customer Account Review (CAR) or Customer Knowledge Assessment (CKA), a retail customer is deemed to possess sufficient knowledge to trade in Specified Investment Products (SIPs) if:-","o":["For CAR, he has transacted in SIPs quoted on a futures exchange at least 6 times in the last 5 years.","For CKA, he has invested in unlisted collective investment schemes at least 6 times in the last 3 years.","For CKA, he has invested in unlisted structured notes at least 6 times in the last 4 years.","He has professional finance related qualification such as CFA."],"a":[1,3],"e":"While conducting a Customer Account Review (CAR) or Customer Knowledge Assessment (CKA), a retail customer is deemed to possess sufficient knowledge to trade in Specified Investment Products (SIPs) if for CKA, he has invested in unlisted CISs at least 6 times in the last 3 years, or he has professional finance related qualification such as CFA.","multi":true},{"n":69,"q":"A Member definitely need NOT perform Customer Knowledge Assessment when the customer:","o":["has a Bachelor's degree in Fine Arts.","Wants to buy shares of a company listed on the SGX.","wants to trade in an unlisted equity-linked structured note.","wants to trade in an unlisted credit linked structured note."],"a":[1],"e":"CKA is not required if the customer wants to buy shares of a company listed on the SGX. CKA is required for UNLISTED specified investment products. Specified Investment Products (SIPs) are derivatives or products which may contain derivatives."},{"n":70,"q":"When conducting the CAR or CKA, a retail customer would be deemed to have sufficient knowledge if he:","o":["holds a diploma in accountancy.","holds a bachelor's degree in accountancy.","holds a Master's degree in actuarial science.","holds a diploma in computational finance and insurance."],"a":[0,1,2,3],"e":"When conducting a CAR or CKA, a retail customer would be deemed to have sufficient knowledge if he holds a diploma or has higher qualifications in accountancy, actuarial science, business / business administration / business management / business studies, capital markets, commerce, economics, finance, financial engineering, financial planning, computational finance and insurance, or has professional finance-related qualifications, such as CFA or ACCA.","multi":true},{"n":71,"q":"John (age 35 years) earns an average net profit of S$50,000 per month from his antiques business in Singapore. He lives with his wife and two sons in a high-end apartment in Singapore. He invests his savings from time to time based on the advice given by his financial adviser ABC Corporation. Based on this information, which of the following transactions should raise the suspicion of money laundering (ML) or terrorism financing (TF)?","o":["John invests S$ 5,000 in penny stocks whereas he usually invests money in bonds and shares of blue-chip companies.","John gives the appointed representative of ABC S$ 15,000 in cash for investment in a gold ETF.","John buys an apartment for Euro 100,000 in Lisbon for rental income.","John remits Euro 200,000 to a numbered account abroad as a wedding gift to a friend in Italy."],"a":[3],"e":"A one-time S$5,000 investment in penny stocks is not a huge investment considering John's financial profile. Cash transactions below S$20,000 are usually not considered suspicious. In any case, the investment of S$15,000 is in ETFs. Based on John's profile, a Euro 100,000 apartment in Lisbon is not a large transaction and is in a relatively safe jurisdiction, with a clear purpose. Sending Euro 200,000 to a numbered account abroad for the wedding of a friend (not a family member/relative) should raise suspicion of ML/TF unless there is proper justification."},{"n":72,"q":"Overseas-Listed Investment Products include capital market products that are ____.","o":["Listed for quotation on an overseas securities exchange and on the SGX.","Listed for quotation only on an overseas futures exchange.","Quoted on the SGX and an overseas commodities exchange.","All of the above."],"a":[1],"e":"An overseas-listed investment product refers to a capital markets product that is listed for quotation or quoted only on overseas securities exchange or overseas futures exchange(collectively referred to as overseas exchanges)."},{"n":73,"q":"Before investing in an overseas-listed investment product, investors need to be aware of:-","o":["The level of investor protection related to the product offered only in Singapore.","Tax implications.","Currency risks.","Additional transaction costs."],"a":[1,2,3],"e":"Before investing in an overseas-listed investment product, investors need to be aware of the tax implications, currency risks, additional transaction costs, etc. related to the OVERSEAS jurisdiction. The level of investor protection related to the product offered only in SINGAPORE is NOT relevant.","multi":true},{"n":74,"q":"In the context of overseas-listed investment products, differences in regulatory regimes in Singapore and the relevant foreign country may include those related to:-","o":["Return potential.","Future prospects of the economy.","Clearing and settlement rules.","Expectations on interest rates."],"a":[2],"e":"In the context of overseas-listed investment products, differences in REGULATORY regimes in Singapore and the relevant foreign country may include those related clearing and settlement rules."},{"n":75,"q":"Which of the following should normally be considered as suspicious transactions under AML/CFT laws?","o":["Frequent changes of authorised signatories in respect of a customer account.","Frequent changes to the customers address.","A relatively high proportion of equity in the portfolio of a 60 year old client.","Customer being reluctant to disclose the names of the UBOs."],"a":[0,1,3],"e":"Frequent changes to the address or authorised signatories should evoke ML/TF suspicion. A relatively high proportion of equity in the portfolio of a 60 years old client should NOT evoke suspicion, although it indicates an unusual risk appetite.","multi":true},{"n":76,"q":"Which of the following CANNOT be considered examples of suspicious transactions under the AML/CFT laws?","o":["Frequent cash payments made by a business to an unrelated entity.","Every cash settlement of securities transactions.","Providing large amounts of funds for fund management in cash.","None of the above."],"a":[1],"e":"Larger or unusual settlements of securities transactions in cash form. Note that \"cash settlement\" in the context of securities transactions does NOT mean settling the transaction with cold hard cash bills."},{"n":77,"q":"Which of the following statements regarding suspicious transactions involving large amounts of cash under AML/CFT laws is/are TRUE?","o":["Cash payments for SGD200,000 should evoke suspicion.","Margin collateral of $1 million in cash should evoke suspicion.","Large cash withdrawals two years after receipt of a credit from a large foreign multinational company should not evoke suspicion.","Payments made using counterfeit notes should not evoke suspicion."],"a":[0,1,2],"e":"Large cash withdrawals two years after receipt of a credit from a large foreign multinational company should NOT evoke suspicion. This is because the money was received from a large MNC (most likely reputed and regulated) and the long period between deposit and withdrawal. Payments made using counterfeit notes SHOULD evoke suspicion. Cash payments for SGD200,000 (a large cash payment) SHOULD evoke suspicion. Margin collateral of $1 million in cash SHOULD evoke suspicion.","multi":tru
