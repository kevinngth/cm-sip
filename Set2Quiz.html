<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMFAS RES5 - Set 2</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#6b7280;--line:#e3e6ea;--acc:#2563eb;
--ok:#16a34a;--okbg:#eaf7ef;--no:#dc2626;--nobg:#fdeeee}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1c2024;--ink:#e8eaed;--mut:#9aa3ad;
--line:#2c3238;--okbg:#14301f;--nobg:#331717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.setbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.setbtn:hover{border-color:var(--acc)}
.setbtn b{display:block;font-size:15px}
.setbtn span{color:var(--mut);font-size:13px}
.rand{background:var(--acc);border-color:var(--acc);color:#fff}.rand span{color:#dbe6ff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
margin:0 -18px 20px;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-size:16px;margin:0;flex:1}
.pill{font-size:13px;color:var(--mut);white-space:nowrap}.pill b{color:var(--ink)}
button.lnk{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qn{color:var(--mut);font-size:13px;margin-bottom:6px}
.qt{font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
padding:9px 12px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:#9aa3ad}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt .k{font-weight:600;color:var(--mut);min-width:16px}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt.correct .k{color:var(--ok)}.opt.wrong .k{color:var(--no)}
.done .opt{cursor:default}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
.res .score{font-size:34px;font-weight:700}
.foot{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style></head><body><div class="wrap" id="app"></div>

const TITLE = "CMFAS RES5 - Set 2";
const SIZE = 25;
const MODE = "instant";          // "instant" | "submit"
const SHUFFLE = false;
const L = ['a','b','c','d','e','f'];
const app = document.getElementById('app');
let state = null;

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  state=null;
  const sets=[];
  for(let i=0;i<DATA.length;i+=SIZE) sets.push([i,Math.min(i+SIZE,DATA.length)]);
  app.innerHTML = `<h1>${esc(TITLE)}</h1>
  <p class="sub">${DATA.length} questions &middot; ${sets.length} practice sets of up to ${SIZE}.</p>
  <div class="grid">
    <button class="setbtn rand" data-r="1"><b>Random ${Math.min(SIZE,DATA.length)}</b><span>Drawn from all ${DATA.length}</span></button>
    ${sets.map((s,i)=>`<button class="setbtn" data-i="${i}"><b>Set ${i+1}</b><span>Q${DATA[s[0]].n}&ndash;Q${DATA[s[1]-1].n} &middot; ${s[1]-s[0]} questions</span></button>`).join('')}
  </div>`;
  app.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{
    if(b.dataset.r){
      const idx=shuffled(DATA.map((_,i)=>i)).slice(0,SIZE);
      start(idx,'Random '+idx.length);
    } else {
      const s=sets[+b.dataset.i], idx=[];
      for(let k=s[0];k<s[1];k++) idx.push(k);
      start(SHUFFLE?shuffled(idx):idx,'Set '+(+b.dataset.i+1));
    }
  });
}

function start(idx,title){
  state={idx,title,picked:new Array(idx.length).fill(null),right:0,answered:0,graded:MODE!=='submit'};
  render();
}

function render(){
  const {idx,title}=state;
  app.innerHTML = `<div class="bar"><h2>${esc(title)}</h2>
    <span class="pill">Answered <b id="ans">0</b>/${idx.length}</span>
    ${MODE==='submit'?'':'<span class="pill">Score <b id="scr">0</b></span>'}
    <button class="lnk" id="back">&larr; All sets</button></div>
    <div id="qs"></div>
    ${MODE==='submit'?'<div class="foot"><button class="btn" id="grade" disabled>Submit answers</button></div>':''}
    <div id="end"></div>`;
  document.getElementById('back').onclick=home;
  const box=document.getElementById('qs');
  idx.forEach((qi,pos)=>{
    const q=DATA[qi];
    const el=document.createElement('div'); el.className='q'; el.id='q'+pos;
    el.innerHTML = `<div class="qn">Question ${pos+1} &middot; source Q${q.n}</div>
      <div class="qt">${esc(q.q)}</div>
      ${q.o.map((t,i)=>`<div class="opt" data-i="${i}"><span class="k">${L[i]}.</span><span>${esc(t)}</span></div>`).join('')}
      ${q.a.length>1?`<div class="note">The source marks ${q.a.map(i=>L[i]).join(' and ')} as correct &mdash; either is accepted.</div>`:''}
      ${q.a.length===0?`<div class="note">No answer recorded for this question in the source.</div>`:''}`;
    el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(el,pos,qi,+o.dataset.i));
    box.appendChild(el);
  });
  if(MODE==='submit') document.getElementById('grade').onclick=gradeAll;
  window.scrollTo(0,0);
}

function pick(el,pos,qi,choice){
  if(state.graded && state.picked[pos]!==null) return;
  const q=DATA[qi], first=state.picked[pos]===null;
  state.picked[pos]=choice;
  if(first) state.answered++;
  document.getElementById('ans').textContent=state.answered;

  if(MODE==='submit'){
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.i===choice));
    const g=document.getElementById('grade');
    if(g) g.disabled = state.answered<state.idx.length;
    return;
  }
  if(q.a.includes(choice)) state.right++;
  el.classList.add('done');
  el.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    if(q.a.includes(i)) o.classList.add('correct');
    else if(i===choice) o.classList.add('wrong');
  });
  document.getElementById('scr').textContent=state.right;
  if(state.answered===state.idx.length) finish();
}

function gradeAll(){
  state.right=0;
  state.idx.forEach((qi,pos)=>{
    const q=DATA[qi], el=document.getElementById('q'+pos), choice=state.picked[pos];
    if(q.a.includes(choice)) state.right++;
    el.classList.add('done');
    el.querySelectorAll('.opt').forEach(o=>{
      const i=+o.dataset.i;
      o.classList.remove('sel');
      if(q.a.includes(i)) o.classList.add('correct');
      else if(i===choice) o.classList.add('wrong');
    });
  });
  const g=document.getElementById('grade'); if(g) g.remove();
  finish();
}

function finish(){
  const n=state.idx.length, r=state.right, pct=Math.round(r/n*100);
  const wrong=state.idx.map((qi,pos)=>[qi,pos]).filter(([qi,pos])=>!DATA[qi].a.includes(state.picked[pos]));
  const end=document.getElementById('end');
  end.innerHTML=`<div class="res"><div class="score">${r} / ${n}</div>
    <div class="sub">${pct}% correct${wrong.length?` &middot; missed Q${wrong.map(([qi])=>DATA[qi].n).join(', Q')}`:''}</div>
    <div class="foot"><button class="btn" id="again">Retry this set</button>
    ${wrong.length?'<button class="btn sec" id="onlywrong">Retry missed only</button>':''}
    <button class="btn sec" id="home2">All sets</button></div></div>`;
  document.getElementById('again').onclick=()=>start(state.idx,state.title);
  const ow=document.getElementById('onlywrong');
  if(ow) ow.onclick=()=>start(wrong.map(([qi])=>qi), state.title+' (missed)');
  document.getElementById('home2').onclick=home;
  end.scrollIntoView({behavior:'smooth'});
}

home();
</script></body></html>
